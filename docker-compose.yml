name: dumbmonit

services:
  dumbmonit:
    image: ghcr.io/selfhostr/dumbmonit:latest
    ports:
      - "8080:8080"
      # Encrypted agent channel (TLS 1.3 + client certificates). The only port
      # agents on other networks need; the web port can stay private.
      - "8443:8443"
      # Optional single port: web UI, API and agents on 443 (agents are told
      # apart by TLS ALPN). Set DUMBMONIT_SINGLE_PORT: "443" under
      # `environment` and net.ipv4.ip_unprivileged_port_start: "443" under
      # `sysctls`; keep 8443 until every agent is up to date.
      # - "443:443"
      # Central logs (off by default; turn on with DUMBMONIT_SYSLOG_ENABLED /
      # DUMBMONIT_TRAPS_ENABLED under `environment`, and the log store in
      # Settings > System). Unprivileged ports: the container runs as non-root.
      # - "5514:5514/udp"   # syslog (RFC 3164 / 5424)
      # - "5514:5514/tcp"
      # - "1162:1162/udp"   # SNMP traps (v1 / v2c)
      # Network flows (beta, off by default; turn on in Settings > System).
      # - "2055:2055/udp"   # NetFlow v5 / v9, IPFIX
      # - "6343:6343/udp"   # sFlow v5
    volumes:
      - dumbmonit-data:/data
      # Or a host directory; on a SELinux host (Fedora, RHEL) add `:Z`:
      # - ./dumbmonit:/data:Z
    # environment:
    #   PUID: "1000"   # owner of the files in /data (default 65532)
    #   PGID: "1000"
    #   # Browser monitors (see the dumbmonit-browser service below):
    #   DUMBMONIT_BROWSER_URL: "http://dumbmonit-browser:3000"
    #   DUMBMONIT_BROWSER_TOKEN: "${BROWSER_TOKEN}"
    #   DUMBMONIT_BROWSER_CONCURRENCY: "2"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    # Starts as root only to give /data to user 65532 (or PUID/PGID), then
    # drops root for good: a host directory works as it is. Remove `user` and
    # `cap_add` to run as 65532 from the start (the files must belong to it).
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    sysctls:
      net.ipv4.ping_group_range: "0 2147483647"

  # Optional sidecar for browser monitors (Playwright + Chromium, about 2 GB
  # image, about 300 MB of memory per running scenario). Off by default:
  #   BROWSER_TOKEN=$(openssl rand -hex 32) docker compose --profile browser up -d
  # then uncomment the DUMBMONIT_BROWSER_* lines above and pass the same token.
  dumbmonit-browser:
    image: ghcr.io/selfhostr/dumbmonit-browser:latest
    profiles: [browser]
    environment:
      BROWSER_TOKEN: "${BROWSER_TOKEN:-}"   # at least 32 random characters, the sidecar refuses to start without
      BROWSER_CONCURRENCY: "2"
    # No published port: only the dumbmonit service reaches it, over the compose network.
    restart: unless-stopped
    stop_grace_period: 40s
    read_only: true
    tmpfs: [/tmp]
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    mem_limit: 1g
    pids_limit: 512

volumes:
  dumbmonit-data:
    name: dumbmonit-data
