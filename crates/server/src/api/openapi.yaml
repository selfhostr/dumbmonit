      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogDestinationRequest" }
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteLogDestination
      tags: [Logs]
      summary: Remove a log destination
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/logs/destinations/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testLogDestination
      tags: [Logs]
      summary: Send one test record to a log destination, now
      security: [{ cookieAuth: [] }]
