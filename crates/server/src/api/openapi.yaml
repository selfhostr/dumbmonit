    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: runRemediationAction
      tags: [Remediation]
      summary: Run an action by hand
      description: >-
        Operators run an action from an active alert (`fingerprint`): the device is the
        alert's, or the one fixed on the action. Administrators may name `target_id`
        instead. At most 30 runs per minute for the whole instance. Audited.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fingerprint: { type: string }
                target_id: { type: integer, format: int64 }
      responses:
        "201":
          description: The log entry (queued for the agent, or already finished).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationRun" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

