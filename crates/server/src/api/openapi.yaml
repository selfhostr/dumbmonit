  /api/deadlines:
    get:
      operationId: listDeadlines
      tags: [Integrations]
      summary: Expiry dates across the instance, soonest first
      description: >
        Domains, certificates, application secrets (Entra), products
        (Infomaniak), device keys (Tailscale) and licences, read from the last
        point of each collected expiry series. Already expired items stay for
        thirty days. With `upcoming=true` the list also holds what is about to
        become a problem without being an expiry date: disks the forecast says
        will be full within the horizon, and backups that are late or will be
        within a day (age of the last success past the limit of the integration).
      x-token-scope: read
      parameters:
        - name: target
          in: query
          required: false
          description: Only this monitor.
          schema: { type: integer }
        - name: max_days
          in: query
          required: false
          description: Horizon in days (default 366, at most 3650).
          schema: { type: number }
        - name: upcoming
          in: query
          required: false
          description: Add disks that are filling up and late backups (`disk` and `backup` kinds).
          schema: { type: boolean }
      responses:
        "200":
          description: The deadlines of the monitors the caller can see.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Deadline" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/{id}/blacklist:
    parameters:
