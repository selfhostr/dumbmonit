      x-token-scope: write
      responses:
        "204": { description: Pack uninstalled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/packs/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/PackId"
    put:
      operationId: enablePack
      tags: [Integration packs]
      summary: Register the pack's device type
      x-token-scope: write
      responses:
        "200":
          description: The pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/packs/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/PackId"
    put:
      operationId: disablePack
