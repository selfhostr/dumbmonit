      responses:
        "200":
          description: Whether the record was accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/backup:
    get:
      operationId: getBackupStatus
      tags: [Backup]
      summary: What a backup bundle would contain, and the scheduled backups
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Backup state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: exportBackup
      tags: [Backup]
      summary: Export an encrypted backup bundle
      description: >-
        Returns the bundle itself as a JSON file: a cleartext header and a payload
        encrypted with AES-256-GCM under a key derived from the passphrase by
        Argon2id (at least 16 characters). It carries every credential of the
        instance, which is why tokens are refused.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupExportRequest" }
      responses:
        "200":
          description: The bundle, as an attachment.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/backup/restore:
    post:
      operationId: restoreBackup
      tags: [Backup]
      summary: Restore a backup bundle (dry run unless `apply`)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupRestoreRequest" }
      responses:
        "200":
          description: Per-section report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestoreReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/backup/local:
    post:
      operationId: runLocalBackup
      tags: [Backup]
      summary: Write one scheduled-style local backup now
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The scheduled backups' state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalBackupStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/backup/schedule:
    put:
      operationId: setBackupSchedule
      tags: [Backup]
      summary: Change the schedule of the local backups
      description: >-
        Administrator session only, recorded in the audit log. Values are clamped (1 to 8760 hours,
        1 to 365 copies). A `DUMBMONIT_BACKUP_ENABLED`, `DUMBMONIT_BACKUP_INTERVAL_HOURS` or
        `DUMBMONIT_BACKUP_KEEP` variable that is set still wins; `env_managed` says which.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, interval_hours, keep]
              properties:
                enabled: { type: boolean }
                interval_hours: { type: integer, minimum: 1 }
                keep: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The scheduled backups' state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalBackupStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/backup/local/files:
    get:
      operationId: listLocalBackups
      tags: [Backup]
      summary: The local backups on disk
      description: Administrator session only. Newest first.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The files.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    bytes: { type: integer }
                    at: { type: string }
                    with_secret: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/backup/local/files/{name}:
    get:
      operationId: downloadLocalBackup
      tags: [Backup]
      summary: Download one local backup
      description: >-
        Administrator session only, recorded in the audit log. The SQLite file alone, never
        `secret.key`. The name must be `dumbmonit-YYYYMMDD-HHMMSS.db`, else `400`.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The database copy.
          content:
            application/vnd.sqlite3:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/backup/destinations:
    get:
      operationId: listBackupDestinations
      tags: [Backup]
      summary: The off-site destinations of the local backups
      description: >-
        Administrator session only. Secrets are never returned: `has_secret` and `saved_secrets`
        (field names only) say what is stored. `uploading` is true while an upload runs.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      x-roles: [admin]
      responses:
        "200":
          description: The destinations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestinationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createBackupDestination
      tags: [Backup]
      summary: Add an off-site destination (S3-compatible, WebDAV or SFTP)
      description: >-
        Administrator session only, recorded in the audit log. After each successful local backup
        the file is uploaded to every enabled destination, which then keeps its `keep` newest
        copies. `secret.key` goes too only with `include_key`. An SFTP destination authenticates
        only once its `host_key` fingerprint is confirmed.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupDestinationRequest" }
      responses:
        "201":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/backup/destinations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      operationId: updateBackupDestination
      tags: [Backup]
      summary: Change an off-site destination
      description: >-
        Administrator session only, recorded in the audit log. `secrets` omitted or `null` keeps
        the stored ones, `{}` clears them; when the server or the account changes they must be
        sent again. Changing the SFTP host or port drops the confirmed host key.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupDestinationRequest" }
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestination" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteBackupDestination
      tags: [Backup]
      summary: Remove an off-site destination (the copies already there stay)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      x-roles: [admin]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/backup/destinations/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      operationId: testBackupDestination
      tags: [Backup]
      summary: Write, list and delete a small test file on a destination
      description: >-
        Administrator session only, recorded in the audit log. For SFTP, a host key that is not
        confirmed (or changed) is refused before authenticating, and `host_key` gives the
        fingerprint the server presented, for the administrator to check and confirm.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      x-roles: [admin]
      responses:
        "200":
          description: The outcome (a failure is reported here, not as an HTTP error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupDestinationTest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/config/plan:
    post:
      operationId: planConfig
      tags: [Configuration files]
      summary: What a configuration file would change (nothing is written)
      description: >-
        Send the file as `yaml` or the same document as `config` (JSON). The
        plan names the fields that differ, never their values. Secret references
        (`${NAME}`) that were not resolved are listed in `unresolved` and assumed
        unchanged.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigRequest" }
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/apply:
    post:
      operationId: applyConfig
      tags: [Configuration files]
      summary: Apply a configuration file, in one transaction
      description: >-
        Creates and updates what the file declares, marks it as managed by file,
        and with `prune` deletes managed objects that are no longer declared.
        Any refused entry (unknown reference, invalid value) cancels everything.
        Unresolved secret references are refused: resolve them first (the
        command-line tool does).
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfigRequest" }
      responses:
        "200":
          description: What was done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPlan" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/export:
    get:
      operationId: exportConfig
      tags: [Configuration files]
      summary: Export the instance as a configuration file
      description: >-
        YAML by default, `?format=json` for an object holding the YAML, the
        document and the variables to define. Secrets are replaced by references
        (`${DUMBMONIT_...}`), never exported. Monitors created by Docker labels
        or discovered by agents, and built-in rules, are left out.
      x-token-scope: read
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [yaml, json] } }
      responses:
        "200":
          description: The configuration file.
          content:
            application/yaml:
              schema: { type: string }
            application/json:
              schema: { $ref: "#/components/schemas/ConfigExport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/status:
    get:
      operationId: getConfigStatus
      tags: [Configuration files]
      summary: Watched directory and objects managed by file
      x-token-scope: read
      responses:
        "200":
          description: State.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/config/release:
    post:
      operationId: releaseConfig
      tags: [Configuration files]
      summary: Hand every file-managed object back to manual management
      description: Deletes nothing; the next apply adopts the declared objects again.
      x-token-scope: write
      responses:
        "200":
          description: How many markers were removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  released: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ----------------------------------------------------- auto-surveillance
  /api/self-monitoring:
    get:
      operationId: getSelfMonitoring
      tags: [Self-monitoring]
      summary: Health of DumbMonit itself and the heartbeat setting
      description: >-
        The three conditions of a heartbeat (scheduler running, database
        answering, VictoriaMetrics reachable), the data volume, the database
        size, restarts of the embedded VictoriaMetrics, and the heartbeat
        setting. The heartbeat URL itself is never returned, only its host.
      x-token-scope: read
      responses:
        "200":
          description: The current state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SelfMonitoring" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/self-monitoring/heartbeat:
    put:
      operationId: setHeartbeat
      tags: [Self-monitoring]
      summary: Configure the outgoing heartbeat
      description: >-
        `url` omitted keeps the stored URL, an empty string clears it. Turning
        the heartbeat on needs a URL. The interval is 30 to 3600 seconds.
        Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeartbeatUpdate" }
      responses:
        "200":
          description: The new setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Heartbeat" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/self-monitoring/heartbeat/test:
    post:
      operationId: testHeartbeat
      tags: [Self-monitoring]
      summary: Send one heartbeat now
      description: >-
        A plain "up" call to `url`, or to the stored URL when `url` is absent,
        whatever the engine's health. Errors never quote the URL.
        Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: [string, "null"] }
      responses:
        "200":
          description: Whether the service accepted the call.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeartbeatTestResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

