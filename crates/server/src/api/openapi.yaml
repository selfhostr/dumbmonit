            application/json:
              schema: { $ref: "#/components/schemas/OnCallProfile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: updateMyOnCallProfile
      tags: [On-call]
      summary: Set the time zone and quiet hours (null quiet hours clear them)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnCallProfilePayload" }
      responses:
        "200":
          description: Profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnCallProfile" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/account/oncall/calendar:
    post:
      operationId: createMyOnCallCalendar
      tags: [On-call]
      summary: Create a new iCal subscription link (the previous one stops working)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The link, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnCallCalendarLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: revokeMyOnCallCalendar
      tags: [On-call]
      summary: Revoke the iCal subscription link
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Link revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/public/oncall/calendar/{token}:
    parameters:
      - { name: token, in: path, required: true, description: "The secret of the link, with or without `.ics`.", schema: { type: string } }
    get:
      operationId: onCallCalendar
      tags: [On-call]
      summary: A person's on-call shifts as an iCalendar feed (30 days back, 90 days ahead)
      security: []
      x-token-scope: public
      responses:
        "200":
          description: The calendar.
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dmt_…
      description: >-
        API token created in Settings → API & assistants, sent as the header
        `Authorization: Bearer dmt_…` (no cookie, no `X-Requested-With`). `read` scope: every
        `GET`; `write` scope: also `POST`, `PUT`, `DELETE`. Never valid on
        operations marked `x-token-scope: none`. 120 calls per minute per token.
    scimBearer:
      type: http
      scheme: bearer
      bearerFormat: dmscim_…
      description: >-
        The SCIM token generated in Settings for the identity provider. Valid
        only on `/api/scim/v2`; repeated failures from one address are answered
        429.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-dumbmonit_session
      description: >-
        Session opened by `POST /api/auth/login`. State-changing requests must
        also carry `X-Requested-With: DumbMonit`.

  parameters:
    ScimId:
      name: id
      in: path
      required: true
      description: SCIM id (a UUID).
      schema: { type: string }
    ScimFilter:
      name: filter
      in: query
      description: 'For example `userName eq "jane@example.org"`.'
      schema: { type: string }
    ScimStartIndex:
      name: startIndex
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    ScimCount:
      name: count
      in: query
      schema: { type: integer, minimum: 0, maximum: 200, default: 200 }
    ScimExcludedAttributes:
      name: excludedAttributes
      in: query
      description: Comma-separated attributes to leave out, such as `members`.
      schema: { type: string }
    LogDays:
      name: days
      in: query
      description: Number of days, today included, from 1 to the retention.
      schema: { type: integer, minimum: 1, default: 1 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TargetId:
      name: id
      in: path
      required: true
      description: Device id.
      schema: { type: integer, format: int64 }
    PackId:
      name: id
      in: path
      required: true
      description: Pack id, as declared in its YAML.
      schema: { type: string }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9-]{2,40}$" }
    ComponentKey:
      name: key
      in: path
      required: true
      description: The service's `key` in the public document (its label in URL form).
      schema: { type: string }
    BadgeStyle:
      name: style
      in: query
      description: Shape of the badge.
      schema: { type: string, enum: [flat, flat-square, for-the-badge], default: flat }
    BadgeDays:
      name: days
      in: query
      description: Window of the mean, `400` beyond the page's history.
      schema: { type: integer, enum: [1, 7, 30, 90], default: 30 }
    SubscriptionToken:
      name: token
      in: query
      required: true
      description: The token from the confirmation or update email.
      schema: { type: string }
    ContainerName:
      name: name
      in: path
      required: true
      description: Container name, as Docker reports it.
      schema: { type: string, maxLength: 128 }
    FailureDays:
      name: days
      in: query
      description: How far back to look.
      schema: { type: integer, minimum: 1 }

  headers:
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer }
    RateLimitLimit:
      description: Calls allowed per minute for this token.
      schema: { type: integer }
    RateLimitRemaining:
      description: Calls left in the current window.
      schema: { type: integer }
    RateLimitReset:
      description: Seconds until the window resets.
      schema: { type: integer }
    WwwAuthenticate:
      description: "`Bearer` (with `error=\"invalid_token\"` for an expired token)."
      schema: { type: string }

  requestBodies:
    ScimResource:
      required: true
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimResource" }
        application/json:
          schema: { $ref: "#/components/schemas/ScimResource" }
    ScimPatch:
      required: true
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimPatch" }
        application/json:
          schema: { $ref: "#/components/schemas/ScimPatch" }

  responses:
    ScimResource:
      description: A SCIM resource (RFC 7643).
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimResource" }
    ScimList:
      description: A SCIM `ListResponse`.
      content:
        application/scim+json:
          schema:
            type: object
            required: [schemas, totalResults, Resources]
            properties:
              schemas: { type: array, items: { type: string } }
              totalResults: { type: integer }
              startIndex: { type: integer }
              itemsPerPage: { type: integer }
              Resources:
                type: array
                items: { $ref: "#/components/schemas/ScimResource" }
    ScimError:
      description: >-
        A SCIM error: `400` (`scimType` invalidFilter, invalidValue,
        invalidSyntax, mutability, noTarget, invalidPath), `401` missing or
        wrong token, `403` the target is an administrator, `404` unknown id or
        SCIM disabled, `409` uniqueness, `429` too many failed attempts.
      content:
        application/scim+json:
          schema: { $ref: "#/components/schemas/ScimError" }
    BadRequest:
      description: The request is malformed or invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: No valid session or API token (unknown, revoked or expired token).
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WwwAuthenticate" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >-
        Not allowed: viewer, operator outside alert handling, or `read` token
        on a write operation, token on a
        session-only operation or from a network it is not allowed from,
        missing `X-Requested-With: DumbMonit` on a cookie write.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown id.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Not possible in the current state.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PageAccessRequired:
      description: >-
        A private status page: `access` says what it wants, `password` (POST it to
        `/api/public/status/{slug}/access`) or `users` (sign in to DumbMonit).
      content:
        application/json:
          schema:
            type: object
            required: [error, access]
            properties:
              error: { type: string }
              access: { type: string, enum: [password, users] }
    TooManyRequests:
      description: Rate limited.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        RateLimit-Limit: { $ref: "#/components/headers/RateLimitLimit" }
        RateLimit-Remaining: { $ref: "#/components/headers/RateLimitRemaining" }
        RateLimit-Reset: { $ref: "#/components/headers/RateLimitReset" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadGateway:
      description: >-
        A service the server depends on (the metrics database) is unreachable,
        too slow or answered with an error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Svg:
      description: An SVG badge, `Cache-Control public, max-age=60`.
      content:
        image/svg+xml:
          schema: { type: string }

  schemas:
    ScimSettings:
      type: object
      required: [enabled, base_url, token_set, token_created_at, default_role]
      properties:
        enabled: { type: boolean }
        base_url: { type: string, description: "Tenant URL to give the identity provider: `<origin>/api/scim/v2`." }
        token_set: { type: boolean }
        token_created_at: { type: [string, "null"], description: RFC 3339 UTC. }
        default_role: { type: string, enum: [viewer, operator, wall] }

    ScimResource:
      type: object
      description: A SCIM `User` or `Group` (RFC 7643 §4), or a discovery document.
      additionalProperties: true
      properties:
        schemas: { type: array, items: { type: string } }
        id: { type: string }

    ScimPatch:
      type: object
      required: [Operations]
      properties:
        schemas: { type: array, items: { type: string } }
        Operations:
          type: array
          items:
            type: object
            required: [op]
            properties:
              op: { type: string, description: "`add`, `replace` or `remove`, in any case." }
              path: { type: string }
              value: {}

    ScimError:
      type: object
      required: [schemas, status, detail]
      properties:
        schemas: { type: array, items: { type: string } }
        status: { type: string, description: The HTTP status, as a string. }
        scimType: { type: string }
        detail: { type: string }

    RunbookLink:
      type: object
      required: [scope, value]
      properties:
        scope: { type: string, enum: [rule, group, kind] }
        value: { type: string, description: "Rule uid, folder name or device kind." }
    RunbookInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, description: "Markdown, 64 KiB max. HTML is shown as text." }
        links: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/RunbookLink" } }
    Runbook:
      type: object
      required: [id, title, body, links, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        body: { type: string }
        links: { type: array, items: { $ref: "#/components/schemas/RunbookLink" } }
        created_at: { type: string }
        updated_at: { type: string }
        updated_by: { type: [string, "null"] }
    RemediationKind:
      type: object
      required: [kind, label, description, needs_agent, fields]
      properties:
        kind: { type: string, enum: [service.restart, container.restart, script.run, webhook] }
        label: { type: string }
        description: { type: string }
        needs_agent: { type: boolean }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              input: { type: string, enum: [text, url, secret, params] }
              required: { type: boolean }
              help: { type: string }
    RemediationActionInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 100 }
        kind: { type: string, enum: [service.restart, container.restart, script.run, webhook] }
        params:
          type: object
          description: >-
            service.restart `{service}`, container.restart `{container}`, script.run
            `{script, params}`, webhook `{url}`.
        target_id: { type: [integer, "null"], format: int64 }
        secrets:
          type: object
          description: "webhook `{token}`. Omitted: kept; `{}`: cleared. Never returned."
          additionalProperties: { type: string }
    RemediationAction:
      type: object
      required: [id, name, kind, params, has_secret, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        params: { type: object }
        has_secret: { type: boolean }
        target_id: { type: [integer, "null"], format: int64 }
        created_at: { type: string }
        updated_at: { type: string }
    RemediationPolicyInput:
      type: object
      required: [action_id, rule_uid]
      properties:
        action_id: { type: integer, format: int64 }
        rule_uid: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        after_minutes: { type: integer, minimum: 1, maximum: 1440, default: 5 }
        max_attempts: { type: integer, minimum: 1, maximum: 10, default: 1 }
        window_minutes: { type: integer, minimum: 5, maximum: 10080, default: 60 }
    RemediationPolicy:
      type: object
      required: [id, action_id, action_name, action_kind, rule_uid, after_minutes, max_attempts, window_minutes, enabled]
      properties:
        id: { type: integer, format: int64 }
        action_id: { type: integer, format: int64 }
        action_name: { type: string }
        action_kind: { type: string }
        rule_uid: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        after_minutes: { type: integer }
        max_attempts: { type: integer }
        window_minutes: { type: integer }
        enabled: { type: boolean, description: "Armed (confirmed in two steps)." }
        armed_by: { type: [string, "null"] }
        armed_at: { type: [string, "null"] }
        halted_at: { type: [string, "null"], description: "Set after two failed runs in a row." }
        halt_reason: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    RemediationRun:
      type: object
      required: [id, action_name, kind, params, trigger, requested_by, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        action_id: { type: [integer, "null"], format: int64 }
        action_name: { type: string }
        kind: { type: string }
        params: { type: object, description: "Without secrets." }
        target_id: { type: [integer, "null"], format: int64 }
        target_name: { type: [string, "null"] }
        fingerprint: { type: [string, "null"] }
        rule_uid: { type: [string, "null"] }
        policy_id: { type: [integer, "null"], format: int64 }
        trigger: { type: string, enum: [manual, auto] }
        requested_by: { type: string }
        status: { type: string, enum: [queued, running, done, failed, cancelled, expired] }
        output: { type: [string, "null"], description: "Truncated to 4 KiB, end kept." }
        created_at: { type: string }
        finished_at: { type: [string, "null"] }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Human-readable message. }

    StatusMessage:
      type: object
      required: [status]
      properties:
        status: { type: string }
        message: { type: string }

    # ----------------------------------------------------------- santé
    Health:
      type: object
      required: [status, version, database, victoria]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        build: { type: string, description: 'Short commit the server was built from; absent from local builds.' }
        database: { $ref: "#/components/schemas/ComponentHealth" }
        victoria: { $ref: "#/components/schemas/ComponentHealth" }
        demo: { type: boolean, description: 'Demonstration mode, every write refused.' }
        data_disk:
          type: object
          description: Data volume (`/data`). Signed-in callers only; absent when the system cannot measure it.
          required: [free_bytes, total_bytes, database_bytes]
          properties:
            free_bytes: { type: integer, format: int64 }
            total_bytes: { type: integer, format: int64 }
            database_bytes: { type: integer, format: int64, description: SQLite database and its write-ahead log. }
    Ready:
      type: object
      required: [ready, database, victoria]
      properties:
        ready: { type: boolean }
        database: { type: boolean }
        victoria: { type: boolean }
    UpdateInfo:
      type: object
      required: [current, update_available, enabled, locked_by_env]
      properties:
        current: { type: string, description: Running version. }
        latest: { type: [string, "null"], description: Latest release known; null before the first successful check. }
        release_url: { type: [string, "null"], description: GitHub page of that release. }
        notes: { type: [string, "null"], description: Release notes, shortened. }
        update_available: { type: boolean }
        checked_at: { type: [string, "null"], description: "Last successful check, UTC without suffix." }
        enabled: { type: boolean, description: The check is active. }
        locked_by_env: { type: boolean, description: Turned off by DUMBMONIT_UPDATE_CHECK=off; the setting cannot override it. }
        error: { type: [string, "null"], description: Why the last check failed. }
    UpgradeNotes:
      type: object
      required: [current, announce, pending, notes]
      properties:
        current: { type: string, description: Running version. }
        upgraded_from: { type: [string, "null"], description: "Version the instance came from: the changes introduced after it apply." }
        announce: { type: boolean, description: The window should open by itself. }
        pending: { type: integer, description: Number of changes to apply. }
        notes:
          type: array
          description: Every known change, pending first, then closed, then the rest.
          items: { $ref: "#/components/schemas/UpgradeNote" }
    UpgradeNote:
      type: object
      required: [id, version, title, summary, compose, status]
      properties:
        id: { type: string, description: Stable identifier. }
        version: { type: string, description: Version that introduced the change. }
        title: { type: string }
        summary: { type: string, description: What changed and why. }
        compose: { type: string, description: "`docker-compose.yml` block to copy." }
        apply: { type: [string, "null"], description: Command to run afterwards. }
        docs_url: { type: [string, "null"] }
        status: { type: string, enum: [pending, closed, clear] }
        detection:
          description: Automatic check, for changes that have one and are not closed.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/UpgradeDetection"
        closed_at: { type: [string, "null"], description: "UTC without suffix." }
    UpgradeDetection:
      type: object
      required: [state, detail]
      properties:
        state: { type: string, enum: [ok, missing, unknown] }
        detail: { type: string }
    ComponentHealth:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        embedded: { type: boolean, description: "VictoriaMetrics only: `true` when the server runs its own." }

    # ----------------------------------------------------------- comptes
    Role:
      type: string
      enum: [admin, operator, viewer, wall]
      description: >-
        `admin` does everything; `operator` reads everything and handles
        alerts (operations marked `x-roles: [admin, operator]`); `viewer`
        reads; `wall` is a wall display that only reaches what the wall reads
        (operations marked `x-wall: true`).
    TeamLevel:
      type: string
      enum: [read, operate, manage]
    TeamGrant:
      type: object
      required: [folder, level]
      properties:
        folder:
          type: string
          description: "`*` for every target, empty for targets in no folder, otherwise a folder (its subfolders included)."
        level: { $ref: "#/components/schemas/TeamLevel" }
    TeamMember:
      type: object
      required: [user_id, username, display_name, role, source]
      properties:
        user_id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        source: { type: string, enum: [manual, idp, scim] }
    Team:
      type: object
      required: [id, name, description, idp_groups, members, grants, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        idp_groups: { type: array, items: { type: string } }
        members: { type: array, items: { $ref: "#/components/schemas/TeamMember" } }
        grants: { type: array, items: { $ref: "#/components/schemas/TeamGrant" } }
        created_at: { type: string }
    TeamInput:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        idp_groups: { type: array, items: { type: string } }
        members: { type: array, items: { type: integer, format: int64 } }
        grants: { type: array, items: { $ref: "#/components/schemas/TeamGrant" } }
    TeamSettings:
      type: object
      required: [unassigned_access]
      properties:
        unassigned_access:
          type: string
          enum: [all, none]
          description: What an account that belongs to no team can see.
    TeamsOverview:
      type: object
      required: [teams, folders, settings]
      properties:
        teams: { type: array, items: { $ref: "#/components/schemas/Team" } }
        folders: { type: array, items: { type: string } }
        settings: { $ref: "#/components/schemas/TeamSettings" }
    TeamAccess:
      type: object
      required: [scoped, teams, grants]
      properties:
        scoped: { type: boolean, description: "`true` when the account only sees what its teams open." }
        teams: { type: array, items: { type: string } }
        grants: { type: array, items: { $ref: "#/components/schemas/TeamGrant" } }
        ceiling:
          oneOf:
            - { $ref: "#/components/schemas/TeamLevel" }
            - { type: "null" }
    CurrentUser:
      allOf:
        - { $ref: "#/components/schemas/User" }
        - type: object
          required: [access, msp]
          properties:
            access: { $ref: "#/components/schemas/TeamAccess" }
            msp: { $ref: "#/components/schemas/MspAccess" }
    MspAccess:
      type: object
      required: [enabled, admin, clients]
      properties:
        enabled: { type: boolean, description: MSP mode is on. }
        admin: { type: boolean, description: "MSP administrator: sees and manages every client." }
        clients:
          type: array
          description: Clients the account can pick - all of them for the MSP administrator, its own otherwise. Empty when MSP mode is off.
          items: { $ref: "#/components/schemas/ClientRef" }
        current: { type: [integer, "null"], format: int64, description: "Client of the current view (header `X-DumbMonit-Client`, or the only client of the account)." }
    ClientRef:
      type: object
      required: [id, name, has_logo]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        has_logo: { type: boolean }
    Client:
      type: object
      required: [id, name, description, contacts, idp_groups, members, targets, has_logo, sla_report, report_timezone, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        contacts: { type: array, items: { type: string, format: email }, description: Recipients of the automatic monthly SLA report. }
        monitor_quota: { type: [integer, "null"], description: "Most targets the client may have; `null` for no limit." }
        idp_groups: { type: array, items: { type: string } }
        members: { type: array, items: { $ref: "#/components/schemas/TeamMember" } }
        targets: { type: integer }
        has_logo: { type: boolean }
        sla_report: { type: boolean, description: Send the SLA report of the past month to the contacts on the 1st. }
        sla_objective: { type: [number, "null"] }
        report_timezone: { type: string }
        report_last_period: { type: [string, "null"], description: "Last month sent, `YYYY-MM`." }
        report_last_error: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    ClientInput:
      type: object
      description: An omitted field keeps its value.
      properties:
        name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        contacts: { type: array, items: { type: string, format: email }, maxItems: 20 }
        monitor_quota: { type: [integer, "null"], minimum: 0 }
        idp_groups: { type: array, items: { type: string } }
        members: { type: array, items: { type: integer, format: int64 }, description: Accounts added by hand. }
        sla_report: { type: boolean }
        sla_objective: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        report_timezone: { type: string }
    MspSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean, description: "MSP mode on. Off, a single-client instance behaves as before." }
    ClientsOverview:
      type: object
      required: [settings, clients, unassigned_users]
      properties:
        settings: { $ref: "#/components/schemas/MspSettings" }
        clients: { type: array, items: { $ref: "#/components/schemas/Client" } }
        unassigned_users: { type: array, items: { type: integer, format: int64 }, description: Non-admin accounts in no client - with MSP mode on they see nothing. }
    ClientHealth:
      type: object
      required: [id, name, has_logo, targets, alerting_targets, critical, warning, info, paused]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        has_logo: { type: boolean }
        targets: { type: integer }
        monitor_quota: { type: [integer, "null"] }
        alerting_targets: { type: integer, description: Targets with at least one firing alert. }
        critical: { type: integer }
        warning: { type: integer }
        info: { type: integer }
        paused: { type: integer }
    ClientKind:
      type: string
      enum: [target, status_page, agent_token, channel, rule, silence, report, schedule, escalation_policy, runbook, remediation_action]
    ClientAssign:
      type: object
      required: [kind, ids]
      properties:
        kind: { $ref: "#/components/schemas/ClientKind" }
        ids: { type: array, items: { type: integer, format: int64 }, maxItems: 1000 }
        client_id: { type: [integer, "null"], format: int64, description: "`null`: shared by the instance (channels, rules, maintenance windows, reports, status pages)." }
    User:
      type: object
      required: [id, username, display_name, role, auth, disabled, totp_enabled, created_at]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        auth: { type: string, enum: [password, ldap, saml, oidc] }
        disabled: { type: boolean }
        totp_enabled: { type: boolean }
        created_at: { type: string }
        last_login_at: { type: [string, "null"] }
        email: { type: [string, "null"], description: Optional contact address; never used to sign in. }
        custom_role:
          description: Custom role of the account; its `role` is then `viewer`.
          oneOf:
            - type: "null"
            - type: object
              required: [id, name]
              properties:
                id: { type: integer, format: int64 }
                name: { type: string }
        permissions:
          type: array
          description: What the account may do, in the terms of the permission catalog.
          items: { $ref: "#/components/schemas/Permission" }
    AuthStatus:
      type: object
      required: [configured, authenticated, oidc, demo]
      properties:
        configured: { type: boolean, description: "`false` on a fresh instance." }
        authenticated: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
        oidc:
          type: object
          required: [enabled, provider_name, login_url]
          properties:
            enabled: { type: boolean }
            provider_name: { type: string }
            login_url: { type: string }
        ldap:
          type: object
          required: [enabled]
          properties:
            enabled: { type: boolean, description: Usernames without a local password are checked against the directory. }
        saml:
          type: object
          required: [enabled, label]
          properties:
            enabled: { type: boolean, description: "SAML sign-in is configured; the button leads to `/api/auth/saml/start`." }
            label: { type: string, description: Button label. }
        passkeys: { type: boolean, description: "At least one passkey is registered: the sign-in screen offers to use one." }
        demo: { type: boolean }
        totp_setup_required: { type: boolean, description: "The instance policy holds this session at two-factor enrolment until it is done." }
        password_reset: { type: boolean, description: '"Forgot password?" emails a reset link; otherwise the sign-in screen points to the documentation.' }
        https:
          type: object
          description: HTTPS of the web port, for the "session in clear" banner. Nothing secret.
          properties:
            available: { type: boolean, description: "The web port serves HTTPS (always: it only serves HTTPS)." }
            secure: { type: boolean, description: "This request came over HTTPS (always)." }
            fingerprint_sha256: { type: [string, "null"], description: SHA-256 of the served certificate, as browsers show it. }
            self_signed: { type: boolean }
    PortsView:
      type: object
      properties:
        ports:
          type: array
          items:
            type: object
            properties:
              id: { type: string, description: "Stable identifier (`web`, `agents`, `syslog_udp`, `syslog_tcp`, `traps`, `metrics_store`, `long_store`, `logs_store`, `relay_gateway`)." }
              port: { type: integer, description: Port the process listens on (inside the container or on the relay machine). }
              host_port: { type: integer, description: Port to open on the host (the published one). }
              protocol: { type: string, enum: [tcp, udp] }
              exposure: { type: string, enum: [lan, wan_conditional, never], description: Recommended exposure. }
              status: { type: string, enum: [listening, "off", local], description: "`off`: disabled, nothing to open. `local`: bound to the loopback interface." }
              bind: { type: string, description: Listen address; empty for a relay gateway. }
              subject: { type: [string, "null"], description: Name of the relay for a relay gateway. }
              on_this_host: { type: boolean, description: False when the port is on another machine (relay). }
        compose: { type: string, description: "`ports:` block for docker-compose." }
        ufw: { type: string, description: "`ufw allow` rules with a network to replace." }
    HttpsView:
      type: object
      properties:
        available: { type: boolean, description: A certificate is loaded and served (always, once started). }
        certificate:
          type: [object, "null"]
          properties:
            source: { type: string, enum: [provided, self_signed] }
            fingerprint_sha256: { type: string }
            public_key_pin: { type: [string, "null"], description: "`sha256//…`, the pin of `curl --pinnedpubkey` (self-signed only)." }
            subject: { type: string }
            issuer: { type: string }
            not_after: { type: [string, "null"] }
            names: { type: array, items: { type: string } }
        error: { type: [string, "null"], description: Last reload error of a provided certificate. }
        trusted_proxies: { type: integer }
        hsts: { type: string }
        findings:
          type: array
          items:
            type: object
            properties:
              area: { type: string, examples: [notifications] }
              code: { type: string, examples: [smtp_plain] }
              severity: { type: string, enum: [warning, info] }
              subject: { type: string, description: Name or address of the item; never a secret. }
              link: { type: [string, "null"] }
    SetupRequest:
      type: object
      required: [setup_code, password]
      properties:
        setup_code:
          type: string
          writeOnly: true
          description: One-time code printed in the server logs at startup (or `DUMBMONIT_SETUP_CODE`). Case, dashes and spaces are ignored.
        username: { type: string, default: admin }
        password: { type: string, minLength: 12, writeOnly: true }
    LoginRequest:
      type: object
      required: [password]
      properties:
        username: { type: string }
        password: { type: string, writeOnly: true }
    TotpChallenge:
      type: object
      required: [totp_required, pending]
      properties:
        totp_required: { type: boolean, const: true }
        pending: { type: string, description: 'Ticket valid five minutes, dead after five wrong codes.' }
    TotpLoginRequest:
      type: object
      required: [pending, code]
      properties:
        pending: { type: string }
        code: { type: string, description: A six-digit code or a recovery code. }
    PasswordChange:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, writeOnly: true }
        new_password: { type: string, writeOnly: true }
    PasswordConfirmation:
      type: object
      required: [password]
      properties:
        password: { type: string, writeOnly: true }
    TotpStatus:
      type: object
      required: [enabled, pending, recovery_codes_left]
      properties:
        enabled: { type: boolean }
        pending: { type: boolean }
        recovery_codes_left: { type: integer }
    TotpEnrolment:
      type: object
      required: [secret, otpauth_uri, issuer, account]
      properties:
        secret: { type: string, description: Base32. }
        otpauth_uri: { type: string }
        issuer: { type: string }
        account: { type: string }
    TotpCode:
      type: object
      required: [code]
      properties:
        code: { type: string }
    RecoveryCodesConfirm:
      type: object
      description: A current code from the authenticator app, or the account password.
      properties:
        code: { type: string, writeOnly: true }
        password: { type: string, writeOnly: true }
    Session:
      type: object
      required: [id, created_at, expires_at, current]
      properties:
        id: { type: string, description: Public part of the session cookie; it cannot open the session. }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time, description: Updated at most every five minutes. }
        expires_at: { type: string, format: date-time }
        ip: { type: [string, "null"], description: Last client address seen. }
        user_agent: { type: [string, "null"], description: "`User-Agent` at sign-in, truncated to 256 characters." }
        browser: { type: [string, "null"], examples: [Firefox] }
        os: { type: [string, "null"], examples: [Linux] }
        via: { type: [string, "null"], enum: [password, passkey, ldap, oidc, saml, null] }
        current: { type: boolean }
    SessionsClosed:
      type: object
      required: [closed]
      properties:
        closed: { type: integer }
    AuthPolicy:
      type: object
      properties:
        require_totp: { type: boolean, default: false, description: Require two-factor authentication from admins and operators who sign in with a local password. }
    LinkTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "The `token` parameter of the link." }
    AccountLinkSettings:
      type: object
      properties:
        self_service: { type: boolean, default: true, description: '"Forgot password?" emails a reset link.' }
        reset_minutes: { type: integer, minimum: 5, maximum: 1440, default: 30, description: Lifetime of a reset link. }
        invite_hours: { type: integer, minimum: 1, maximum: 720, default: 168, description: Lifetime of an invitation. }
    AccountLinkSettingsView:
      allOf:
        - $ref: "#/components/schemas/AccountLinkSettings"
        - type: object
          required: [mail_server, self_service_available]
          properties:
            mail_server: { type: boolean, description: The instance email server is configured. }
            link_base: { type: [string, "null"], description: Base of the links sent. }
            self_service_available: { type: boolean, description: '"Forgot password?" really sends a link.' }
    InvitationCheck:
      type: object
      required: [email, role, suggested_username, invited_by, expires_at, sso]
      properties:
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        suggested_username: { type: string }
        invited_by: { type: string }
        expires_at: { type: string, description: UTC, without suffix. }
        sso: { type: boolean, description: Single sign-on is enabled and can be used instead of a password. }
    Invitation:
      type: object
      required: [id, email, role, teams, invited_by, created_at, expires_at, expired]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        teams:
          type: array
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
        invited_by: { type: string }
        created_at: { type: string }
        expires_at: { type: string }
        last_sent_at: { type: [string, "null"] }
        expired: { type: boolean }
    InvitationSent:
      type: object
      required: [invitation, url, emailed]
      properties:
        invitation: { $ref: "#/components/schemas/Invitation" }
        url: { type: string, description: "`/invite?token=…`, shown once." }
        emailed: { type: boolean }
        email_error: { type: [string, "null"] }
    PersonalNotificationPrefs:
      type: object
      properties:
        email: { type: boolean, default: false }
        webpush: { type: boolean, default: false }
        min_severity: { $ref: "#/components/schemas/Severity" }
        notify_resolved: { type: boolean, default: true }
        scope:
          type: string
          enum: [all, teams, pick]
          default: all
          description: Everything the account sees, the folders of its teams, or the folders and tags picked.
        folders: { type: array, items: { type: string }, maxItems: 50 }
        tags: { type: array, items: { type: string, description: "`key=value`, or `key` alone." }, maxItems: 50 }
        min_interval_secs: { type: integer, minimum: 0, maximum: 86400, default: 0 }
        quiet_hours:
          description: A weekly window in the account's time zone; only critical alerts get through.
          oneOf:
            - { $ref: "#/components/schemas/Schedule" }
            - { type: "null" }
    MyNotificationsView:
      type: object
      required: [prefs, mail_server, push_devices, teams, folders, tags]
      properties:
        prefs: { $ref: "#/components/schemas/PersonalNotificationPrefs" }
        email: { type: [string, "null"], description: The account's address, set by an administrator. }
        mail_server: { type: boolean }
        push_devices: { type: integer }
        teams: { type: array, items: { type: string } }
        folders: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
    PersonalDelivery:
      type: [object, "null"]
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: [string, "null"] }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
    AuditEntry:
      type: object
      required: [id, at, action]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string }
        actor: { type: [string, "null"] }
        action: { type: string, examples: [login, login.failed, token.created, user.updated] }
        subject: { type: [string, "null"] }
        ip: { type: [string, "null"] }
    SamlConfigUpdate:
      type: object
      properties:
        enabled: { type: boolean }
        idp_entity_id: { type: string, description: "Identity provider entity ID: the expected `Issuer`." }
        idp_sso_url: { type: string, description: Identity provider sign-in endpoint (HTTP-Redirect binding). }
        idp_certificates:
          type: array
          items: { type: string }
          description: PEM signing certificates of the identity provider (several during a rollover). Only these keys verify assertions.
        sp_entity_id: { type: string, description: "DumbMonit's entity ID (the expected audience). Empty: `sp_metadata_url`." }
        allow_idp_initiated: { type: boolean, description: Accept responses the identity provider sends without a request. Off by default. }
        auto_create: { type: boolean, description: Create an account on first sign-in. Off by default. }
        button_label: { type: string, description: "Sign-in button label. Empty: `SAML`." }
        attr_email: { type: string, description: E-mail attribute name. Empty tries the usual names (Entra ID, Okta, Keycloak). }
        attr_name: { type: string, description: Display name attribute. Empty tries the usual names. }
        attr_groups: { type: string, description: Groups attribute. Empty tries the usual names. }
        admin_groups: { type: array, items: { type: string } }
        operator_groups: { type: array, items: { type: string } }
        wall_groups: { type: array, items: { type: string }, description: Members who are in no admin or operator group become wall displays. }
    SamlConfig:
      allOf:
        - $ref: "#/components/schemas/SamlConfigUpdate"
        - type: object
          properties:
            sp_metadata_url: { type: string, readOnly: true, description: Service provider metadata URL to give to the identity provider. }
            acs_url: { type: string, readOnly: true, description: Assertion consumer service (reply URL) to declare at the identity provider. }
    SamlMetadataImportRequest:
      type: object
      required: [xml]
      properties:
        xml: { type: string, description: The identity provider metadata document. }
    SamlMetadataImport:
      type: object
      required: [idp_entity_id, idp_sso_url, idp_certificates]
      properties:
        idp_entity_id: { type: string }
        idp_sso_url: { type: string }
        idp_certificates: { type: array, items: { type: string } }
    OidcConfig:
      type: object
      properties:
        source: { type: string, enum: [settings, env, none] }
        enabled: { type: boolean }
        env_available: { type: boolean }
        issuer: { type: string }
        client_id: { type: string }
        has_client_secret: { type: boolean }
        provider_name: { type: string }
        scopes: { type: string }
        auto_create: { type: boolean }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
          description: Members who are not in an admin group become operators.
        wall_groups:
          type: array
          items: { type: string }
          description: >-
            Members who are in no admin or operator group become wall displays
            (role `wall`). Alone, this list only decides the `wall` role.
        groups_claim: { type: string }
        public_url: { type: string }
        redirect_uri: { type: string }
    OidcConfigUpdate:
      type: object
      required: [issuer, client_id]
      properties:
        issuer: { type: string }
        client_id: { type: string }
        client_secret: { type: [string, "null"], writeOnly: true, description: Absent or empty keeps the stored one. }
        provider_name: { type: string }
        scopes: { type: string }
        auto_create: { type: boolean, default: true }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
          description: Members who are not in an admin group become operators.
        wall_groups:
          type: array
          items: { type: string }
          description: >-
            Members who are in no admin or operator group become wall displays
            (role `wall`). Alone, this list only decides the `wall` role.
        groups_claim: { type: string }
        public_url: { type: string }
    OidcTestRequest:
      type: object
      properties:
        issuer: { type: string, description: Defaults to the effective configuration's issuer. }
    OidcTestReport:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        error: { type: string }
        discovery: { type: object, additionalProperties: true }
    LdapGroupMode:
      type: string
      enum: [memberof, search]
      description: "`memberof`: the user's `memberOf` attribute. `search`: a group search with `group_filter`."
    LdapConfig:
      type: object
      properties:
        source: { type: string, enum: [settings, env, none] }
        enabled: { type: boolean }
        env_available: { type: boolean }
        allow_plain: { type: boolean, description: "`DUMBMONIT_LDAP_ALLOW_PLAIN` is set: `ldap://` without StartTLS is accepted." }
        url: { type: string, description: "`ldaps://host:636` or `ldap://host:389`." }
        starttls: { type: boolean }
        tls_verify: { type: boolean }
        ca_cert: { type: string, description: PEM of the authority that issued the server certificate. }
        bind_dn: { type: string }
        has_bind_password: { type: boolean }
        base_dn: { type: string }
        user_filter: { type: string, description: "Contains `{username}`, escaped per RFC 4515." }
        username_attribute: { type: string }
        display_name_attribute: { type: string }
        email_attribute: { type: string }
        group_mode: { $ref: "#/components/schemas/LdapGroupMode" }
        group_base_dn: { type: string }
        group_filter: { type: string, description: "Contains `{dn}` and/or `{username}`." }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
        viewer_groups:
          type: array
          items: { type: string }
          description: Once any group list is filled, only members of a listed group can sign in.
        wall_groups:
          type: array
          items: { type: string }
          description: Members of no other listed group become wall displays (role `wall`).
        timeout_seconds: { type: integer }
    LdapConfigUpdate:
      type: object
      properties:
        url: { type: string }
        starttls: { type: boolean }
        tls_verify: { type: boolean, default: true }
        ca_cert: { type: string }
        bind_dn: { type: string }
        bind_password: { type: [string, "null"], writeOnly: true, description: Absent or empty keeps the stored one. }
        base_dn: { type: string }
        user_filter: { type: string }
        username_attribute: { type: string }
        display_name_attribute: { type: string }
        email_attribute: { type: string }
        group_mode: { $ref: "#/components/schemas/LdapGroupMode" }
        group_base_dn: { type: string }
        group_filter: { type: string }
        admin_groups:
          type: array
          items: { type: string }
        operator_groups:
          type: array
          items: { type: string }
        viewer_groups:
          type: array
          items: { type: string }
        wall_groups:
          type: array
          items: { type: string }
        timeout_seconds: { type: integer, minimum: 1, maximum: 30, default: 5 }
    LdapTestRequest:
      type: object
      properties:
        config: { $ref: "#/components/schemas/LdapConfigUpdate" }
        username: { type: string, description: User to search; its password is never asked. }
    LdapTestReport:
      type: object
      required: [ok, steps]
      properties:
        ok: { type: boolean }
        steps:
          type: array
          items:
            type: object
            required: [step, ok, detail, elapsed_ms]
            properties:
              step: { type: string, enum: [connect, service_bind, user_search, groups] }
              ok: { type: boolean }
              detail: { type: string }
              elapsed_ms: { type: integer }
        user:
          type: object
          properties:
            dn: { type: string }
            username: { type: string }
            display_name: { type: string }
            email: { type: [string, "null"] }
            groups:
              type: array
              items: { type: string }
            role: { oneOf: [{ $ref: "#/components/schemas/Role" }, { type: "null" }] }
            allowed: { type: boolean }
    UserCreate:
      type: object
      required: [username, role]
      properties:
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        custom_role_id: { type: integer, format: int64, description: "A custom role; `role` must then be `viewer`." }
        password: { type: string, writeOnly: true }
        email: { type: string, maxLength: 254, description: Optional; blank means none. }
    UserUpdate:
      type: object
      properties:
        display_name: { type: string }
        email: { type: string, maxLength: 254, description: Blank clears it. }
        role: { $ref: "#/components/schemas/Role" }
        custom_role_id:
          type: integer
          format: int64
          description: Give a custom role (the built-in role becomes `viewer`). Sending `role` alone removes it.
        disabled: { type: boolean }
        password: { type: string, writeOnly: true }

    # ----------------------------------------------------------- rôles personnalisés
    Permission:
      type: string
      description: A permission of the catalog (`GET /api/roles/permissions`); new names may appear.
      examples: [view, alerts.operate, monitors.manage, notifications.manage, status_pages.manage, maintenance.manage, reports.view]
    PermissionInfo:
      type: object
      required: [id, label, description, implied, routes]
      properties:
        id: { $ref: "#/components/schemas/Permission" }
        label: { type: string, description: English name. }
        description: { type: string, description: English description. }
        implied: { type: boolean, description: Always part of a custom role (`view`). }
        routes:
          type: array
          items:
            type: object
            required: [method, path]
            properties:
              method: { type: string }
              path: { type: string, description: "Path template, `*` matches one segment." }
    CustomRole:
      type: object
      required: [id, name, description, permissions, users, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        users: { type: integer, description: Accounts that have the role. }
        created_at: { type: string }
        updated_at: { type: string }
    CustomRoleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 64, description: Not the name of a built-in role. }
        description: { type: string, maxLength: 500 }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }

    # ----------------------------------------------------------- jetons
    TokenScope:
      type: string
      enum: [read, write]
      description: "`read`: every `GET`. `write`: also `POST`, `PUT`, `DELETE`."
    ApiToken:
      type: object
      required: [id, name, prefix, scope, created_at, created_by, expires_at, expired, allowed_networks, last_used_at, last_used_ip, revoked_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        prefix: { type: string, description: "Start of the token (`dmt_` and a few characters), to recognise it.", examples: [dmt_3f9a1c2b] }
        scope: { $ref: "#/components/schemas/TokenScope" }
        created_at: { type: string, format: date-time }
        created_by: { type: [string, "null"], description: Account that created the token. }
        expires_at: { type: [string, "null"], format: date-time, description: "`null`: never expires." }
        expired: { type: boolean }
        allowed_networks:
          type: array
          description: Networks the token may be used from (normalised CIDR); empty means anywhere.
          items: { type: string, examples: ["192.168.1.0/24"] }
        last_used_at: { type: [string, "null"], format: date-time, description: Updated at most once a minute. }
        last_used_ip: { type: [string, "null"] }
        revoked_at: { type: [string, "null"], format: date-time }
    ApiTokenCreate:
      type: object
      properties:
        name: { type: string, maxLength: 80, description: 'Optional. Absent or blank, the server generates one ("API token · 2026-11-02").' }
        scope: { $ref: "#/components/schemas/TokenScope", default: read }
        expires_in_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
          description: 'Absent or `null`: never expires.'
        allowed_networks:
          type: array
          maxItems: 32
          description: CIDR networks or single addresses; absent or empty means anywhere.
          items: { type: string }
    ApiTokenUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        expires_in_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 3650
          description: 'New expiry counted from now; `null`: never expires.'
        allowed_networks:
          type: array
          maxItems: 32
          description: Replaces the list; empty means anywhere.
          items: { type: string }
    CreatedApiToken:
      allOf:
        - $ref: "#/components/schemas/ApiToken"
        - type: object
          required: [secret]
          properties:
            secret: { type: string, description: "The token in clear — shown once, never again.", examples: ["dmt_…"] }
    AgentToken:
      type: object
      required: [id, name, prefix, created_at, uses]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: "Opaque identifier generated by the server (`tok_` + 10 lowercase base32 characters). It cannot be chosen or changed." }
        prefix: { type: string }
        created_at: { type: string }
        last_used_at: { type: [string, "null"] }
        revoked_at: { type: [string, "null"] }
        max_uses: { type: [integer, "null"], description: "`null` for a fleet token." }
        uses: { type: integer }
        expires_at: { type: [string, "null"], description: Enrolments stop after it; enrolled machines keep reporting. }
        relay: { type: boolean, description: The machine it enrols becomes a relay for its site at its first report. }
        relay_site: { type: [string, "null"] }
        ad_domain: { type: [string, "null"], description: Active Directory fleet token - enrols only fully qualified names in this domain. }
        client_id: { type: integer, format: int64, description: "MSP mode: the client this token enrols into, and the only one its machines report to." }
        dormant_at: { type: [string, "null"], description: "Fleet token put to sleep after enrolling no machine for the configured days; `null` while in service." }
    AgentEnrolmentSettings:
      type: object
      properties:
        fleet_approval:
          type: string
          enum: [auto, manual, ad_domain]
          description: "Fleet tokens: accept automatically, require approval, or accept automatically when the full host name is in the AD domain of the token."
        single_use_approval: { type: string, enum: [auto, manual, ad_domain] }
        rate_per_hour: { type: integer, minimum: 0, maximum: 10000, description: Enrolments per token per hour; 0 for no limit. }
        dormant_days: { type: integer, minimum: 0, maximum: 3650, description: Days without enrolment before a fleet token is put to sleep; 0 for never. }
    AgentEnrolmentRequest:
      type: object
      required: [id, hostname, os, requested_at, last_seen_at]
      properties:
        id: { type: integer, format: int64 }
        hostname: { type: string }
        os: { type: string }
        source_ip: { type: [string, "null"] }
        token_id: { type: [integer, "null"], format: int64 }
        token_name: { type: [string, "null"], description: Identifier of the enrolment token used, never its secret. }
        requested_at: { type: string }
        last_seen_at: { type: string }
    AgentEnrolmentOverview:
      type: object
      required: [settings, pending, max_pending, reject_hold_hours]
      properties:
        settings: { $ref: "#/components/schemas/AgentEnrolmentSettings" }
        pending:
          type: array
          items: { $ref: "#/components/schemas/AgentEnrolmentRequest" }
        max_pending: { type: integer }
        reject_hold_hours: { type: integer }
    AgentInstallParams:
      type: object
      required: [base_url, checksums, linux_template, windows_template]
      properties:
        base_url: { type: string, description: "`https://` URL of the web port, of the agent port (`agent_port_only`), or of a relay's gateway (install scripts and binaries)." }
        agent_port_only: { type: boolean, description: "True when scripts, binaries and the encrypted channel all use the agent port: the only port a remote site needs." }
        agent_url: { type: [string, "null"], description: "URL of the encrypted agent channel, `https://host:8443`." }
        ca_pin: { type: [string, "null"], description: SHA-256 fingerprint of the agent certificate authority. }
        checksums:
          type: array
          items:
            type: object
            required: [platform, sha256]
            properties:
              platform: { type: string }
              sha256: { type: string }
        linux_template: { type: string, description: "Unix install command; replace `{TOKEN}`." }
        windows_template: { type: string, description: "PowerShell install command; replace `{TOKEN}`." }
        https_pin:
          type: [string, "null"]
          description: >-
            Public-key pin (`sha256//…`) of the certificate `base_url` presents when it
            is not from a trusted authority: the self-signed web certificate, or the agent
            port through a relay. Both commands check the server by it before reading
            anything (`curl --pinnedpubkey`, a PowerShell validation callback), and the
            agent keeps it (`server_pin`). `null`: a provided certificate, checked by the
            system's authorities.
        pin_source:
          type: [string, "null"]
          enum: [own, proxy, trusted, null]
          description: >-
            Set when the server probed the address the browser opened: `own` (DumbMonit's
            certificate), `proxy` (a reverse proxy presents another certificate, whose key
            is pinned) or `trusted` (a certificate from a trusted authority: no pin).
            `null`: no probe (relay, typed address, probe failed).
        via_relay:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/RelayRoute"
        open_gateway: { type: boolean, description: "The installed machine will be a relay: the commands carry `--open-gateway` / `-OpenGateway`, and the installer opens the gateway port on the local firewall, to the local subnet only." }
        transport:
          type: [string, "null"]
          enum: [websocket, null]
          description: "`websocket`: the commands carry `--transport=websocket` / `-Transport websocket`, and the agent reaches its encrypted channel through the web address (`GET /api/agent/ws`), its TLS session inside a WebSocket. `null`: nothing set; the agent tries the agent port first, then the WebSocket."
    RelayRoute:
      type: object
      required: [relay_id, relay_name, host, port, listening]
      description: The relay gateway the commands go through.
      properties:
        relay_id: { type: integer, format: int64 }
        relay_name: { type: string }
        site: { type: [string, "null"] }
        host: { type: string, description: Address of the relay as seen from its site. }
        port: { type: integer, description: Port of its gateway. }
        listening: { type: boolean, description: The relay reports its gateway open on that port. }
        self_check: { type: boolean, description: The relay tests its own gateway (up-to-date agent). }
        reachable: { type: [boolean, "null"], description: "Outcome of the relay's last test of its gateway at host:port: it connected to it as a machine of the site would and reached this server through it. null: not tested at this address yet." }
        check_error: { type: [string, "null"], description: What failed, as the relay reports it. }
    GatewayCheck:
      type: object
      required: [address, ok, checked_at_ms]
      description: A relay's test of its own gateway, at the address the site dials.
      properties:
        address: { type: string, description: "`host:port` tested." }
        ok: { type: boolean }
        error: { type: [string, "null"] }
        checked_at_ms: { type: integer, format: int64 }
    ServerLink:
      type: object
      required: [active, servers, url]
      description: "Address of the server an agent uses among those of its configuration (`server_url`, then `server_urls`), as its last batch reported it."
      properties:
        active: { type: integer, description: "Rank of the address in use: 0 for the primary, 1 or more for a backup server." }
        servers: { type: integer, description: "Number of addresses configured, the primary included." }
        url: { type: string, description: "Address in use (`https://host:port`)." }
        since_ms: { type: [integer, "null"], format: int64, description: When the agent moved to a backup server (Unix milliseconds); absent on the primary. }
        primary_error: { type: [string, "null"], description: Last error seen on the primary; absent on the primary. }
    AgentChannel:
      type: object
      required: [enabled, required, required_setting, protocol, key_exchange, agents]
      properties:
        enabled: { type: boolean, description: The agent port is open. }
        port: { type: [integer, "null"] }
        required: { type: boolean, description: The plain channel is refused right now. }
        required_setting: { type: boolean }
        legacy_until: { type: [string, "null"], description: End of the transition set by DUMBMONIT_AGENT_LEGACY_DAYS. }
        protocol: { type: string }
        key_exchange: { type: string }
        ca_pin: { type: [string, "null"] }
        rotation:
          type: [object, "null"]
          properties:
            started_at: { type: [string, "null"] }
            next_pin: { type: string }
            ready: { type: integer }
            total: { type: integer }
        agents:
          type: array
          items:
            type: object
            required: [id, channel]
            properties:
              id: { type: integer, format: int64 }
              channel: { type: string, enum: [mtls, legacy, none] }
              group: { type: [string, "null"] }
              tls_seen_at: { type: [string, "null"] }
              legacy_seen_at: { type: [string, "null"] }
    AgentUpdateSettings:
      type: object
      required: [enabled, window, canary_minutes, allow_unsigned]
      properties:
        enabled: { type: boolean, description: Agents update themselves (default true). }
        window: { type: string, enum: [any, maintenance, manual] }
        canary_minutes: { type: integer, minimum: 0, maximum: 10080, description: Minutes canary agents must run the new build before the others get it. }
        allow_unsigned: { type: boolean, description: Accept unsigned builds (development), over the encrypted agent channel only. }
    AgentUpdateSettingsChange:
      type: object
      properties:
        enabled: { type: boolean }
        window: { type: string, enum: [any, maintenance, manual] }
        canary_minutes: { type: integer, minimum: 0, maximum: 10080 }
        allow_unsigned: { type: boolean }
    AgentUpdateWave:
      description: >-
        One wave. `count`: that many more agents; `percent`: enough agents so that
        the waves so far cover that share of the fleet (1 to 100); `site`: the
        agents that declare this site; `group`: the agents whose device is in this
        folder; `tag`: the agents whose device carries this tag (with this value
        when given). Names compare without regard to case.
      oneOf:
        - type: object
          required: [by, value]
          properties:
            by: { const: count }
            value: { type: integer, minimum: 1, maximum: 100000 }
        - type: object
          required: [by, value]
          properties:
            by: { const: percent }
            value: { type: integer, minimum: 1, maximum: 100 }
        - type: object
          required: [by, value]
          properties:
            by: { const: site }
            value: { type: string, minLength: 1, maxLength: 80 }
        - type: object
          required: [by, value]
          properties:
            by: { const: group }
            value: { type: string, minLength: 1, maxLength: 80 }
        - type: object
          required: [by, key]
          properties:
            by: { const: tag }
            key: { type: string, minLength: 1, maxLength: 80 }
            value: { type: [string, "null"], maxLength: 80 }
    AgentUpdateRolloutChange:
      type: object
      properties:
        waves:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/AgentUpdateWave" }
        delay_minutes: { type: integer, minimum: 0, maximum: 10080, description: Minutes between the end of a wave and the opening of the next (default 60). }
        max_failure_percent: { type: integer, minimum: 0, maximum: 100, description: Share of failed agents in a wave that stops the propagation; 0 never stops (default 20). }
    AgentUpdates:
      type: object
      required: [settings, version, binaries, rollout, agents]
      properties:
        settings: { $ref: "#/components/schemas/AgentUpdateSettings" }
        version: { type: string, description: Version of this server and of the agent binaries it ships. }
        build: { type: [string, "null"], description: Commit of this build. }
        blocked_unsigned: { type: boolean, description: "Updates are held: a shipped build is unsigned and unsigned builds are not accepted." }
        binaries:
          type: array
          items:
            type: object
            required: [platform, sha256, signed]
            properties:
              platform: { type: string, examples: [linux-x86_64] }
              sha256: { type: string }
              signed: { type: boolean }
        rollout:
          type: object
          required: [canaries, canaries_updated, open, policy, paused, waves]
          properties:
            canaries: { type: integer }
            canaries_updated: { type: integer }
            open: { type: boolean, description: Agents that are not canaries may update (every wave is open, nothing is paused or stopped). }
            reason: { type: [string, "null"], description: Why the other agents wait, without waves. }
            policy:
              type: object
              required: [waves, delay_minutes, max_failure_percent]
              properties:
                waves:
                  type: array
                  items: { $ref: "#/components/schemas/AgentUpdateWave" }
                delay_minutes: { type: integer }
                max_failure_percent: { type: integer }
            paused: { type: boolean }
            halted:
              type: [object, "null"]
              description: The propagation stopped because too many agents failed in a wave.
              properties:
                wave: { type: integer, description: Rank of that wave, from 1. }
                failed: { type: integer }
                attempted: { type: integer }
            waves:
              type: array
              description: The waves in order, the implicit last one included (`select` is null). Empty without waves.
              items:
                type: object
                required: [members, updated, failed, state]
                properties:
                  select:
                    oneOf:
                      - { $ref: "#/components/schemas/AgentUpdateWave" }
                      - { type: "null" }
                  members: { type: integer }
                  updated: { type: integer }
                  failed: { type: integer }
                  state: { type: string, enum: [done, active, waiting, upcoming] }
            current_wave: { type: [integer, "null"], description: Rank, from 1, of the wave being updated. }
            next_wave_at: { type: [string, "null"], description: When the next wave opens, if only its delay holds it back (UTC, no suffix). }
        agents:
          type: array
          items:
            type: object
            required: [id, name, hostname, version, canary, requested, status]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              hostname: { type: string }
              version: { type: string }
              platform: { type: [string, "null"] }
              sha256: { type: [string, "null"] }
              enabled: { type: [boolean, "null"], description: Per-agent override; null follows the global setting. }
              canary: { type: boolean }
              requested: { type: boolean, description: Update now was asked and has not been answered yet. }
              wave: { type: [integer, "null"], description: "Rank, from 1, of the agent's wave; null without waves or when it is in none." }
              status:
                type: string
                enum: [up_to_date, pending, updating, failed, refused, disabled, manual, waiting_window, waiting_canary, waiting_wave, paused, halted, newer, legacy, container, read_only, disabled_locally, unsupported, no_binary, unsigned, reinstall, unknown_key]
              reason: { type: [string, "null"] }
              last:
                type: [object, "null"]
                properties:
                  outcome: { type: string, enum: [succeeded, failed, rolled_back, refused] }
                  version: { type: [string, "null"] }
                  reason: { type: [string, "null"] }
                  at: { type: [string, "null"] }
              last_seen_at: { type: [string, "null"] }
    AgentTokenCreate:
      type: object
      properties:
        name: { type: string, deprecated: true, description: "Accepted for compatibility and ignored: the stored name is always the opaque identifier the server generates (`tok_` followed by 10 lowercase base32 characters)." }
        base_url: { type: string, description: The URL agents will use; the listen address by default. }
        reusable: { type: boolean, default: false, description: 'Without it, the token enrols one machine.' }
        max_uses: { type: [integer, "null"], minimum: 1 }
        expires_in_days: { type: [integer, "null"], minimum: 1 }
        relay: { type: boolean, default: false, description: Make the enrolled machine a relay for a remote site. }
        site: { type: [string, "null"], maxLength: 80, description: Site of that relay. }
        client_id: { type: [integer, "null"], format: int64, description: "MSP mode: the client the token enrols into. Absent: the default client." }
        relay_id: { type: [integer, "null"], format: int64, description: "Install through this relay agent (a site behind a firewall): the commands point at its gateway, which the server asks the relay to open. The relay must belong to the same client." }
        relay_host: { type: [string, "null"], maxLength: 253, description: Address the site reaches the relay at (host name or IP, no scheme or port). }
        agent_port_only: { type: boolean, default: false, description: "Commands that use the agent port only (a remote site). Always on for a relay token." }
        transport:
          type: string
          enum: [auto, websocket, direct]
          default: auto
          description: "Transport of the encrypted channel in the commands. `websocket`: through the web address (Cloudflare Tunnel, a reverse proxy that terminates TLS), the agent's TLS inside a WebSocket. `auto`: `websocket` when the browser address is served by another certificate than DumbMonit's and no dedicated agent address is set."
    CreatedAgentToken:
      allOf:
        - $ref: "#/components/schemas/AgentToken"
        - type: object
          required: [secret, install_linux, install_windows]
          properties:
            secret: { type: string, description: Shown once. }
            install_linux: { type: string }
            install_windows: { type: string }
            pin_source:
              type: [string, "null"]
              enum: [own, proxy, trusted, null]
              description: Where the pin in the commands comes from; see `pin_source` of the install parameters.
            transport:
              type: [string, "null"]
              enum: [websocket, null]
              description: Transport the commands set; see `transport` of the install parameters.
    AgentAdKitCreate:
      type: object
      required: [domain]
      properties:
        domain: { type: string, description: 'DNS name of the domain, e.g. corp.example.com.' }
        base_url: { type: string, description: The URL servers will use; the listen address by default. }
        max_uses: { type: [integer, "null"], minimum: 1, description: Servers it may enrol; unlimited when absent. }
        expires_in_days: { type: [integer, "null"], minimum: 0, description: "Days the token may enrol servers. Absent, null or 0: never expires (the token stays limited to the domain, reusable and revocable in Settings > Agents)." }
        all_servers: { type: boolean, default: false, description: "Make -AllServers the default of the script: link the policy to the domain root, filtered on Windows Server (domain controllers included), so servers added later are covered. Not combinable with security_group." }
        target_ou: { type: [string, "null"], maxLength: 512, description: Distinguished name of the OU to link the group policy to. }
        include_domain_controllers: { type: boolean, default: false }
        security_group: { type: [string, "null"], maxLength: 512, description: Only members of this group apply the group policy. }
        sysvol_binary: { type: boolean, default: false, description: Also copy the agent binary to SYSVOL for servers without outbound access. }
        server_host: { type: [string, "null"], description: 'DNS name (FQDN) or IPv4 address of this server that agents contact, with an optional :port. Replaces the host of base_url.' }
        dns_server: { type: [string, "null"], description: IP address of a DNS server used to resolve server_host on machines that cannot. }
        relay_id: { type: [integer, "null"], format: int64, description: "Servers of a site behind a firewall install and report through this relay agent (its gateway). Replaces base_url and server_host." }
        relay_host: { type: [string, "null"], maxLength: 253, description: Address the servers reach the relay at. }
    CreatedAgentAdKit:
      type: object
      required: [token, secret, script, filename, folder, install_windows, server_url]
      properties:
        token: { $ref: "#/components/schemas/AgentToken" }
        secret: { type: string, description: Shown once. }
        script: { type: string, description: Content of Deploy-DumbMonit.ps1 (UTF-8 with a byte order mark). }
        filename: { type: string }
        folder: { type: string, description: Folder the enrolled servers are filed in. }
        install_windows: { type: string }
        server_url: { type: string, description: URL the agents contact, as written in the kit. }
        dns_server: { type: [string, "null"], description: DNS server written in the kit, if any. }

    # -------------------------------------------------- types d'équipement
    KindDescription:
      type: object
      required: [kind, label, summary, examples, credential_types, credentials, address_hint, default_port, setup, options]
      properties:
        kind: { type: string }
        label: { type: string }
        summary: { type: string }
        examples:
          type: array
          items: { type: string }
        credential_types:
          type: array
          description: The `type` values of `credentials`, in order of preference.
          items: { type: string }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/CredentialDescription" }
        address_hint: { type: string }
        default_port: { type: integer, description: "0 when there is none." }
        setup: { $ref: "#/components/schemas/SetupDescription" }
        options:
          type: array
          description: Settings read from the device's `tags`, in display order.
          items: { $ref: "#/components/schemas/OptionDescription" }
        metrics:
          type: array
          description: >-
            Metric families this type emits, with unit and kind. Omitted when the type declares
            none: the interface then guesses from the name suffixes.
          items: { $ref: "#/components/schemas/MetricDescription" }
        views:
          type: array
          description: >-
            Views recommended for the device page, in display order: a row of figures (`stat`)
            and up to four charts. Omitted when the type declares none: every family is charted.
          items: { $ref: "#/components/schemas/ViewDescription" }
        requirements:
          type: array
          description: >-
            What the server's deployment (not the device) must provide for this type to work fully,
            with whether the server found it in place. Omitted when the type needs nothing. The
            interface writes the sentences from `id` and shows the notice while `satisfied` is false.
          items: { $ref: "#/components/schemas/Requirement" }
        beta:
          type: boolean
          description: >-
            The integration is in beta: still being tested on real installations. Omitted when
            false. The interface shows a badge on its tile.
    MetricDescription:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, description: 'Name as the collector emits it, without the `dumbmonit_` prefix the server adds when storing it.' }
        label: { type: string }
        unit: { type: string, description: '`%`, `s`, `ms`, `B`, `B/s`, `°C`, `bool`, `days`, `timestamp`…; for a counter, the unit of the running total (charted as a rate). Omitted: a plain number.' }
        kind: { type: string, enum: [gauge, counter, info, state] }
        better: { type: string, enum: [higher, lower], description: Which way a good figure goes. Omitted when neither. }
        min: { type: number }
        max: { type: number }
        max_from: { type: string, description: Family giving the maximum of each series. }
        entity: { type: string, description: 'Label that names the measured object (`ifname`, `disk`, `pool`…).' }
        states:
          type: array
          description: For `kind = state`, what each code means.
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: number }
              label: { type: string }
              tone: { type: string, enum: [ok, warning, critical, neutral] }
    ViewDescription:
      type: object
      required: [view, metrics]
      properties:
        view: { type: string, description: '`stat`, `timeseries`, `topn`, `heatmap`, `gauge`, `table`; an unknown view is drawn as curves.' }
        title: { type: string }
        metrics:
          type: array
          description: Families shown, by `MetricDescription.name`.
          items: { type: string }
        group_by: { type: string, description: 'Label that tells entities apart (`topn`, `heatmap`); omitted: every series.' }
        options:
          type: object
          additionalProperties: { type: string }
          description: 'View settings, e.g. `limit`.'
    Requirement:
      type: object
      required: [id, satisfied, doc_url, compose_snippet]
      properties:
        id:
          type: string
          description: "Stable identifier: `icmp` (ICMP echo sockets for ping)."
        satisfied: { type: boolean, description: "True when the server found the requirement met (ICMP socket opened)." }
        doc_url: { type: string, description: Documentation section that explains it. }
        compose_snippet: { type: string, description: YAML to add to docker-compose.yml, as is. }
    SetupDescription:
      type: object
      properties:
        title: { type: string }
        steps:
          type: array
          items: { type: string }
        ports:
          type: array
          description: >-
            Network ports to open, one per entry. `direction` is `to_device` (from the DumbMonit
            server or its relay agent to the device) or `to_server` (from the agent to the
            server). `optional` ports are only used by an option or mode, named in `purpose`.
            Omitted when the type opens no connection to the device.
          items:
            type: object
            properties:
              port: { type: integer }
              protocol: { type: string, enum: [tcp, udp] }
              direction: { type: string, enum: [to_device, to_server] }
              purpose: { type: string }
              optional: { type: boolean }
        permissions:
          type: array
          description: >-
            Rights, roles or permissions to give the monitoring account, one per entry: the first
            line is the right as the product names it, the optional next line says what it is for.
            Omitted when the type needs none.
          items: { type: string }
        warning: { type: string }
        doc_url: { type: string, description: "The 'Full guide' page of the documentation, or a pack's link." }
    OptionDescription:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        placeholder: { type: string }
        default: { type: string }
        required: { type: boolean }
        input:
          type: string
          description: "`text`, `number`, `boolean`, `select`, `checklist`, `rows`, or `agent`: a choice among the agents known to the server, stored as the id of the agent's monitor (blank: none). Unknown values are shown as text."
        choices:
          type: array
          items: { type: string }
        group: { type: string, description: "Sub-heading under \"More options\"; empty: the UI falls back to a generic key-prefix heuristic." }
        items:
          type: array
          description: "Tick boxes of an `input: checklist` option. The tag holds the ticked `value`s separated by commas, `-` when none is ticked; absent means all are ticked. `default` is what a new monitor ticks."
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
              help: { type: string }
              badges: { type: array, items: { type: string } }
        columns:
          type: array
          description: "Columns of an `input: rows` option. The tag holds a JSON array of objects keyed by column `key`."
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              placeholder: { type: string }
              input: { type: string, enum: [text, select, boolean] }
              choices: { type: array, items: { type: string } }
              pattern: { type: string, description: "JavaScript regular expression the text must match; empty: none." }
              invalid: { type: string, description: Message shown when `pattern` does not match. }
              unique: { type: boolean }
    CredentialDescription:
      type: object
      properties:
        kind: { type: string }
        label: { type: string }
        help: { type: string }
        fields:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              help: { type: string }
              placeholder: { type: string }
              input: { type: string }
              choices:
                type: array
                items: { type: string }
              required: { type: boolean }

    DiscoveryRequest:
      type: object
      required: [cidr]
      properties:
        cidr: { type: string, examples: ["192.168.1.0/24"] }
        community: { type: string, default: public, writeOnly: true }
        port: { type: integer, default: 161 }
        timeout_ms: { type: integer, minimum: 100, maximum: 10000 }
    DiscoveryResult:
      type: object
      required: [devices, scanned]
      properties:
        scanned: { type: integer, description: Addresses probed. }
        devices:
          type: array
          items:
            type: object
            required: [address]
            properties:
              address: { type: string }
              sysdescr: { type: [string, "null"] }
              sysname: { type: [string, "null"] }
              sysobjectid: { type: [string, "null"] }
              suggested_profile: { type: [string, "null"] }

    DiscoveryJobRequest:
      type: object
      required: [cidr]
      properties:
        cidr: { type: string, examples: ["192.168.1.0/24"] }
        agent_id:
          type: [integer, "null"]
          format: int64
          description: Relay agent that runs the scan; null means the server itself.
        snmp_community: { type: string, default: public, writeOnly: true }
        depth: { type: string, enum: [standard, extended], default: standard }
    NetscanScheduleInput:
      type: object
      required: [cidr]
      properties:
        name: { type: string, maxLength: 80 }
        cidr: { type: string, examples: ["192.168.1.0/24"] }
        agent_id:
          type: [integer, "null"]
          format: int64
          description: Relay agent that runs the scan; null or absent means the server itself.
        interval_secs: { type: integer, minimum: 300, maximum: 2592000, default: 86400 }
        depth:
          type: string
          enum: [standard, extended]
          default: standard
          description: Port list of the discovery (`extended` tests more ports).
        enabled: { type: boolean, default: true }
    NetscanSchedule:
      type: object
      required: [id, name, cidr, agent_id, agent_name, interval_secs, depth, enabled, initialized, running, last_run_at, last_status, last_error, devices, unknown_devices, ignored_devices, mac_changes, unknown_ports]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        cidr: { type: string }
        agent_id: { type: [integer, "null"], format: int64 }
        agent_name: { type: [string, "null"] }
        interval_secs: { type: integer }
        depth: { type: string, enum: [standard, extended] }
        enabled: { type: boolean }
        initialized: { type: boolean, description: "The first scan has initialized the inventory (nothing was reported)." }
        running: { type: boolean }
        last_run_at: { type: [string, "null"], description: UTC, no suffix. }
        last_status: { type: [string, "null"], enum: [running, done, failed, cancelled, null] }
        last_error: { type: [string, "null"] }
        devices: { type: integer }
        unknown_devices: { type: integer }
        ignored_devices: { type: integer }
        mac_changes: { type: integer, description: New devices on the address of a known device under another MAC, not yet marked known or ignored. }
        unknown_ports: { type: integer, description: Unknown ports of known devices. }
    NetscanPort:
      type: object
      required: [id, port, protocol, product, kind, known, first_seen, last_seen]
      properties:
        id: { type: integer, format: int64 }
        port: { type: integer }
        protocol: { type: string, enum: [tcp, udp] }
        product: { type: string }
        kind: { type: [string, "null"], description: Monitor type the detection proposes for this service. }
        known: { type: boolean }
        first_seen: { type: string }
        last_seen: { type: string }
    NetscanDevice:
      type: object
      required: [id, schedule_id, ip, mac, hostname, vendor, known, ignored, mac_change_from, first_seen, last_seen, ports]
      properties:
        id: { type: integer, format: int64 }
        schedule_id: { type: integer, format: int64 }
        ip: { type: string, description: Last address seen; a device is identified by its MAC when visible. }
        mac: { type: [string, "null"] }
        hostname: { type: [string, "null"] }
        vendor: { type: [string, "null"], description: Manufacturer from the MAC prefix (OUI), when known. }
        known: { type: boolean, description: Also true for an ignored device. }
        ignored: { type: boolean }
        mac_change_from: { type: [string, "null"], description: MAC address the IP had before this new device took it. }
        first_seen: { type: string }
        last_seen: { type: string }
        ports:
          type: array
          items: { $ref: "#/components/schemas/NetscanPort" }
    DiscoveryJobSummary:
      type: object
      required: [id, cidr, agent_id, agent_name, status, started_at, finished_at, hosts_found]
      properties:
        id: { type: string }
        cidr: { type: string }
        agent_id: { type: [integer, "null"], format: int64 }
        agent_name: { type: [string, "null"] }
        status: { type: string, enum: [running, done, failed, cancelled] }
        started_at: { type: string }
        finished_at: { type: [string, "null"] }
        hosts_found: { type: integer }
    DiscoveryJob:
      allOf:
        - $ref: "#/components/schemas/DiscoveryJobSummary"
        - type: object
          required: [progress, error, hosts]
          properties:
            error: { type: [string, "null"] }
            progress:
              type: object
              required: [phase, probed, total]
              properties:
                phase: { type: string, enum: [sweep, fingerprint, done] }
                probed: { type: integer }
                total: { type: integer }
            hosts:
              type: array
              items: { $ref: "#/components/schemas/DiscoveredHost" }
    DiscoveredHost:
      type: object
      required: [ip, hostname, mac, vendor, services]
      properties:
        ip: { type: string }
        hostname: { type: [string, "null"], description: Reverse DNS. }
        mac: { type: [string, "null"], description: Only on the same L2 segment (host network). }
        vendor: { type: [string, "null"] }
        services:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredService" }
    DiscoveredService:
      type: object
      required: [port, protocol, product, kind, version, confidence, tls, detail, monitored_target_id, prefill]
      properties:
        port: { type: integer }
        protocol: { type: string, enum: [tcp, udp] }
        product: { type: string, description: Readable label, e.g. "Proxmox VE". }
        kind: { type: [string, "null"], description: Matching DumbMonit collector kind. }
        version: { type: [string, "null"] }
        confidence: { type: string, enum: [high, medium, low] }
        tls: { type: boolean }
        detail: { type: [string, "null"] }
        monitored_target_id: { type: [string, "null"], description: Existing target already pointing at this address. }
        prefill:
          type: [object, "null"]
          additionalProperties: true
          description: Fields to pre-fill in the target form for `kind`; never a secret.
    LocalSubnets:
      type: object
      required: [subnets]
      properties:
        subnets:
          type: array
          description: Suggested IPv4 networks, most reliable source first.
          items:
            type: object
            required: [cidr, source]
            properties:
              cidr: { type: string, example: 192.168.1.0/24 }
              source:
                type: string
                enum: [config, devices, server]
              interface: { type: string, description: Server interface; `server` source only. }
    TargetTestRequest:
      description: A `TargetPayload`, plus the id of the device being edited.
      allOf:
        - $ref: "#/components/schemas/TargetPayload"
        - type: object
          properties:
            id:
              type: integer
              format: int64
              description: >-
                When editing, reuses the stored credential if `credential` is
                omitted (refused if the address or connection settings changed).
    TargetTestReport:
      type: object
      required: [ok, unreachable]
      properties:
        ok: { type: boolean }
        error: { type: [string, "null"], description: The probe error message. }
        unreachable: { type: boolean, description: True when the failure means "device down". }
        sysname: { type: [string, "null"] }
        sysdescr: { type: [string, "null"] }
        profile_id: { type: [string, "null"], description: Profile auto-detection would pick. }
    Onboarding:
      type: object
      required: [skipped, complete, dismissed, has_target, has_channel, notification_confirmed]
      properties:
        skipped: { type: boolean }
        complete: { type: boolean, description: Latched; never goes back to false. }
        completed_at: { type: [string, "null"] }
        dismissed:
          type: array
          items: { type: string, enum: [device, channel, test] }
        has_target: { type: boolean }
        has_channel: { type: boolean }
        notification_confirmed: { type: boolean }
        first_run: { $ref: "#/components/schemas/FirstRunTimings" }
    FirstRunTimings:
      type: object
      description: >-
        When this instance first passed each step, UTC without suffix; `null` until it
        has. Recorded locally, never sent anywhere. Steps after the account are only
        recorded when the account creation was (instances set up by an older version
        stay empty).
      properties:
        first_boot_at: { type: [string, "null"], description: First start without an account. }
        setup_at: { type: [string, "null"], description: First administrator created. }
        first_target_at: { type: [string, "null"] }
        first_channel_at: { type: [string, "null"] }
        first_notification_at: { type: [string, "null"], description: First message that really left a channel, a test included. }
        first_alert_at: { type: [string, "null"], description: First real alert delivered by the engine. }
    OnboardingPatch:
      type: object
      properties:
        skipped: { type: boolean }
        dismissed:
          type: array
          items: { type: string, enum: [device, channel, test] }
    PublicInstance:
      type: object
      required: [setup_completed]
      properties:
        setup_completed: { type: boolean }
    InstanceSettings:
      type: object
      required: [setup_completed, name, language, timezone]
      properties:
        setup_completed: { type: boolean }
        setup_completed_at: { type: [string, "null"], description: UTC without suffix. }
        name: { type: string, maxLength: 80, description: Empty shows "DumbMonit". }
        language: { type: string, description: "Default interface language (`en`, `fr`, `de`, `es`, `it`, `pt`, `pt-BR`, `ru`, `zh-Hans`, `ja`, `ko`, `nl`, `pl`, `tr`); empty follows the browser." }
        timezone: { type: string, description: IANA time zone; empty means UTC. }
        accent: { type: string, pattern: '^(#[0-9a-fA-F]{6})?$', description: "Accent colour of the interface (solid buttons, focus ring) as `#rrggbb`, stored in lower case; empty is the default look. Status colours never change. Included in the backup." }
        oncall_enabled: { type: boolean, description: "On-call schedules are turned on. Off by default (`false` also when the field is missing); turned on at upgrade for an instance that already has a schedule, an escalation policy or an on-call channel. Off, the schedules, policies and channels are kept but inactive: the alerting engine no longer starts escalations through on-call channels and the interface hides the feature." }
    InstancePatch:
      type: object
      properties:
        setup_completed: { type: boolean }
        name: { type: string, maxLength: 80 }
        language: { type: string }
        timezone: { type: string }
        oncall_enabled: { type: boolean }
        accent: { type: string, pattern: '^(#[0-9a-fA-F]{6})?$', description: "`#rrggbb` or empty for the default look; anything else is refused with 400." }

    # ---------------------------------------------------------- équipements
    Target:
      type: object
      required: [id, name, address, kind, interval_secs, enabled, tags, credential_kind, has_secret, credential_public]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        address: { type: string }
        kind: { type: string, description: "A kind from `GET /api/collectors` (`snmp`, `proxmox`, `agent`, `http`, `pack.<id>`…)." }
        profile_id: { type: [string, "null"] }
        parent_id: { type: [integer, "null"], format: int64 }
        via_agent: { type: [integer, "null"], format: int64, description: Relay agent probing this device; `null` means the server. }
        client_id: { type: integer, format: int64, description: "MSP mode: the client of the target (`1`, the default client, otherwise)." }
        interval_secs: { type: integer }
        enabled: { type: boolean }
        cve_scan: { type: boolean, description: "Known-vulnerability (CVE) check is on for this device. `true` by default; `false` keeps it out of the scan and of `GET /api/security/cves*`." }
        tags:
          type: object
          additionalProperties: { type: string }
        credential_kind: { type: string, description: A label — the secret itself is never returned. }
        has_secret: { type: boolean, description: "A secret (community, passphrase, token, password) is stored. Leaving its field empty on `PUT` keeps it." }
        credential_public:
          type: object
          description: "Non-secret parts of the credential, under the form's field keys (`username`, `token_id` for a Proxmox `user@realm!name` token, `auth_protocol`, `privacy_protocol`, `context`), to pre-fill the edit form. Never a secret; empty for a reader."
          additionalProperties: { type: string }
        group_name: { type: string, description: "Flat folder shown on `/targets`; empty: no folder." }
        note: { type: string, description: "Free-text note for humans (owner, location, what to do when it is down). Empty: none." }
        channels:
          type: array
          description: "Notification channels of this device: an alert its rule sends to every channel goes to these only (a rule that names its own channels keeps them). Empty: every channel, as before."
          items: { type: integer, format: int64 }
        created_at: { type: [string, "null"], description: "Creation date, UTC without suffix." }
        position: { type: integer, format: int64, description: "Manual rank, tiebreaking only within the same state and folder." }
        location_id: { type: [integer, "null"], format: int64, description: "Location assigned on the world map; null: none (the device may still sit at one through its site, see `GET /api/locations`)." }
        multisite:
          description: "Probe locations of an uptime monitor (the server and/or relay agents) and the quorum; null: probed from one place."
          oneOf:
            - { $ref: "#/components/schemas/MultisiteConfig" }
            - { type: "null" }
        managed:
          oneOf:
            - { $ref: "#/components/schemas/TargetManaged" }
            - { type: "null" }
          description: Set when Docker labels manage this monitor.
        last_probe_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        last_error: { type: [string, "null"] }
        error_kind:
          type: [string, "null"]
          enum: [down, config, null]
          description: "`down`: the device did not answer; `config`: our side (credentials, address, option)."
    TargetBulkPatch:
      type: object
      description: What a bulk edit changes; a field left out stays as it is.
      properties:
        interval_secs: { type: integer, minimum: 10, maximum: 604800 }
        channels:
          description: "Notification channels of each device: replace the list, add to it or remove from it. An empty `set` goes back to the channels of the alert rules."
          oneOf:
            - type: object
              required: [set]
              properties: { set: { type: array, items: { type: integer, format: int64 } } }
            - type: object
              required: [add]
              properties: { add: { type: array, items: { type: integer, format: int64 } } }
            - type: object
              required: [remove]
              properties: { remove: { type: array, items: { type: integer, format: int64 } } }
        tags:
          type: object
          properties:
            add:
              type: object
              description: "Free tags to set (key: 1 to 64 characters without `=`; value: one line, at most 200 characters)."
              additionalProperties: { type: string }
            remove:
              type: array
              items: { type: string }
        group_name: { type: string, maxLength: 60, description: "Destination folder; empty: no folder." }
    TargetBulkReport:
      type: object
      required: [updated, failed, results]
      properties:
        updated: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items:
            type: object
            required: [id, ok]
            properties:
              id: { type: integer, format: int64 }
              ok: { type: boolean }
              error: { type: string, description: Why this device was left as it was. }
    MonitorTemplate:
      type: object
      required: [id, name, kind, interval_secs, tags, channels, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        interval_secs: { type: integer }
        tags:
          type: object
          description: Options of the type and free tags; never a secret.
          additionalProperties: { type: string }
        channels:
          type: array
          description: Notification channels of a device created from it; empty means the channels of its alert rules.
          items: { type: integer, format: int64 }
        created_at: { type: string, description: "UTC, without suffix." }
        updated_at: { type: string, description: "UTC, without suffix." }
    TargetManaged:
      type: object
      description: >-
        Present on a monitor created from `dumbmonit.*` Docker labels. It follows
        the labels (create, update, archive) and cannot be edited or deleted
        by hand until released (`POST /api/targets/{id}/release`).
      required: [by, key]
      properties:
        by: { type: string, enum: [docker-labels] }
        source: { type: [integer, "null"], format: int64, description: Agent whose containers declare it. }
        key: { type: string, description: "`project/service/http` for a Compose service, else `container/http`." }
        missing_since: { $ref: "#/components/schemas/NullableServerTimestamp" }
    OverviewWidgets:
      type: object
      required:
        [sites, top, backups, services, alert_stats, agents, events, availability, alerts_opened]
      properties:
        sites:
          type: array
          items:
            type: object
            required: [key, name, monitors, wan_latency_ms, next_maintenance, last_backup]
            properties:
              key: { type: string, description: "`local` or `relay:<site name>`." }
              name: { type: string }
              monitors:
                type: array
                items:
                  type: object
                  required: [id, name, kind, category, status]
                  properties:
                    id: { type: integer }
                    name: { type: string }
                    kind: { type: string, description: Short kind label. }
                    category:
                      type: string
                      enum: [servers, storage, network, services, backups, other]
                    status: { type: string, enum: [up, down, degraded, paused] }
              wan_latency_ms:
                type: [array, "null"]
                items: { type: number }
                description: Latency to the relay over the range; null when not measured.
              next_maintenance: { type: [string, "null"] }
              last_backup: { type: [string, "null"] }
        top:
          type: object
          required: [cpu, mem, disk, net]
          properties:
            cpu: { type: array, items: { $ref: "#/components/schemas/OverviewTopEntry" } }
            mem: { type: array, items: { $ref: "#/components/schemas/OverviewTopEntry" } }
            disk: { type: array, items: { $ref: "#/components/schemas/OverviewTopEntry" } }
            net: { type: array, items: { $ref: "#/components/schemas/OverviewTopEntry" } }
        backups:
          type: array
          items:
            type: object
            required:
              [job, engine, detail, site, target_id, last_success, duration_s, changed_bytes, runs, status]
            properties:
              job: { type: string }
              engine: { type: string, description: "PBS, Active Backup, Hyper Backup, restic…" }
              detail: { type: string }
              site: { type: string }
              target_id: { type: integer }
              last_success: { type: [string, "null"] }
              duration_s: { type: [number, "null"] }
              changed_bytes: { type: [number, "null"] }
              runs:
                type: array
                description: Last runs, oldest first (14 at most); empty without history.
                items:
                  type: object
                  required: [at, ok]
                  properties:
                    at: { type: string }
                    ok: { type: boolean }
              status: { type: string, enum: [ok, failed, running, stale] }
        services:
          type: array
          items:
            type: object
            required: [target_id, name, kind, status, checks, p95_ms, availability_30d]
            properties:
              target_id: { type: integer }
              name: { type: string }
              kind: { type: string, description: "HTTPS, HTTP, DNS, TLS, SMTP, Ping, TCP." }
              status: { type: string, enum: [up, down, degraded, paused] }
              checks:
                type: array
                description: Last 36 check slots, oldest first; null when nothing was measured.
                items: { type: [boolean, "null"] }
              p95_ms: { type: [number, "null"] }
              availability_30d: { type: [number, "null"] }
        alert_stats:
          type: object
          required:
            - days
            - total
            - previous_total
            - mtta_s
            - previous_mtta_s
            - mttr_s
            - previous_mttr_s
            - acked_within_15m_pct
            - noisiest
          properties:
            days:
              type: array
              items:
                type: object
                required: [day, critical, warning, info]
                properties:
                  day: { type: string, description: "`YYYY-MM-DD` (UTC)." }
                  critical: { type: integer }
                  warning: { type: integer }
                  info: { type: integer }
            total: { type: integer }
            previous_total: { type: integer }
            mtta_s: { type: [integer, "null"] }
            previous_mtta_s: { type: [integer, "null"] }
            mttr_s: { type: [integer, "null"] }
            previous_mttr_s: { type: [integer, "null"] }
            acked_within_15m_pct: { type: [number, "null"] }
            noisiest:
              type: [object, "null"]
              required: [rule, target, target_id, count]
              properties:
                rule: { type: string }
                target: { type: string }
                target_id: { type: [integer, "null"] }
                count: { type: integer }
        agents:
          type: object
          required: [total, versions, relays, server_update]
          properties:
            total: { type: integer }
            versions:
              type: array
              items:
                type: object
                required: [version, count, latest]
                properties:
                  version: { type: string }
                  count: { type: integer }
                  latest: { type: boolean, description: The version this server ships. }
            relays:
              type: array
              items:
                type: object
                required: [name, connected, last_seen]
                properties:
                  name: { type: string }
                  connected: { type: boolean }
                  last_seen: { type: [string, "null"] }
            server_update:
              type: [object, "null"]
              required: [version]
              properties:
                version: { type: string }
        events:
          type: array
          description: The 20 latest events, newest first.
          items:
            type: object
            required: [at, kind, text, target_id]
            properties:
              at: { type: string }
              kind: { type: string, enum: [crit, warn, ok, info, maint, ack] }
              text: { type: string }
              target_id: { type: [integer, "null"] }
        availability:
          type: object
          required: [days, avg_30d, previous_avg_30d, slo_target, budget_left_pct]
          properties:
            days:
              type: array
              items:
                type: object
                required: [day, pct]
                properties:
                  day: { type: string }
                  pct: { type: [number, "null"] }
            avg_30d: { type: [number, "null"] }
            previous_avg_30d: { type: [number, "null"] }
            slo_target: { type: number }
            budget_left_pct: { type: [number, "null"] }
        alerts_opened:
          type: object
          required: [days, this_week, last_week, last_resolved_at]
          properties:
            days:
              type: array
              items:
                type: object
                required: [day, count]
                properties:
                  day: { type: string }
                  count: { type: integer }
            this_week: { type: integer }
            last_week: { type: integer }
            last_resolved_at: { type: [string, "null"] }
    OverviewTopEntry:
      type: object
      required: [target_id, label, site, value, unit, series, forecast_days]
      properties:
        target_id: { type: integer }
        label: { type: string, description: "Monitor name, or \"<monitor> <volume>\" for disks and interfaces." }
        site: { type: string }
        value: { type: number }
        unit: { type: string, description: "`%` for cpu, mem and disk; `Mb/s` for net." }
        series:
          type: array
          items: { type: number }
          description: Values over the range, oldest first (48 at most).
        forecast_days:
          type: [number, "null"]
          description: Disk only, days until full at the current growth.
    StatusSummary:
      type: object
      required: [status, devices, alerts]
      properties:
        status:
          type: string
          enum: [ok, warning, critical]
          description: "`critical` when an alert is critical or a device is unreachable, `warning` for any other firing alert."
        sentence: { type: [string, "null"], description: The one-line summary shown by the interface. }
        devices:
          type: object
          required: [total, up, down, waiting, disabled]
          properties:
            total: { type: integer }
            up: { type: integer }
            down: { type: integer, description: Unreachable or down. }
            waiting: { type: integer }
            disabled: { type: integer }
        alerts:
          type: object
          required: [firing, critical, warning, info, building_up, suppressed]
          properties:
            firing: { type: integer }
            critical: { type: integer }
            warning: { type: integer }
            info: { type: integer }
            building_up: { type: integer }
            suppressed: { type: integer }
    Passkey:
      type: object
      required: [id, name, created_at, synced]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        last_used_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        synced: { type: boolean, description: The passkey is copied to a synced keychain. }
    PasskeyCeremony:
      type: object
      required: [challenge_id, options]
      properties:
        challenge_id: { type: string, description: "Single-use, valid five minutes." }
        options:
          type: object
          description: WebAuthn `publicKey` options with binary values encoded as base64url.
          additionalProperties: true
    NullableServerTimestamp:
      type: [string, "null"]
      description: UTC timestamp without suffix (`2026-08-31 20:15:00`), or `null`.
    KumaImportReport:
      type: object
      required: [dry_run, total, created, skipped, errors, notifications_ignored, rows]
      properties:
        dry_run: { type: boolean }
        total: { type: integer }
        created: { type: integer, description: Devices created (or that would be, in a dry run). }
        skipped: { type: integer, description: Monitors ignored or already monitored. }
        errors: { type: integer }
        notifications_ignored: { type: integer, description: Notifications in the file, never imported. }
        rows:
          type: array
          items:
            type: object
            required: [row, name, source_type, address, folder, tags, status]
            properties:
              row: { type: integer, description: Position of the monitor in the file, from 1. }
              name: { type: string }
              source_type: { type: string, description: Uptime Kuma monitor type. }
              kind: { type: [string, "null"], description: Device type created; null when skipped. }
              address: { type: string }
              folder: { type: string }
              interval_secs: { type: [integer, "null"] }
              tags: { type: array, items: { type: string }, description: Uptime Kuma tags as `key=value`. }
              status: { type: string, enum: [ok, created, skipped, error] }
              message: { type: [string, "null"], description: Why it was skipped, or what is not imported. }
              id: { type: [integer, "null"], format: int64 }
    TargetImportReport:
      type: object
      required: [dry_run, total, created, skipped, errors, rows]
      properties:
        dry_run: { type: boolean }
        total: { type: integer }
        created: { type: integer, description: Devices created (or that would be, in a dry run). }
        skipped: { type: integer }
        errors: { type: integer }
        rows:
          type: array
          items:
            type: object
            required: [row, url, name, folder, status]
            properties:
              row: { type: integer, description: Line number in the file (header is 1). }
              url: { type: string }
              name: { type: string }
              folder: { type: string }
              platform: { type: [string, "null"] }
              category: { type: [string, "null"], description: "Category from the CSV column, else guessed from the page." }
              status: { type: string, enum: [ok, created, skipped, error] }
              message: { type: [string, "null"] }
              id: { type: [integer, "null"], format: int64 }
    TargetPayload:
      type: object
      required: [name, address, kind]
      properties:
        name: { type: string, maxLength: 200 }
        address: { type: string, maxLength: 253 }
        kind: { type: string }
        profile_id: { type: [string, "null"], description: "Absent on `PUT` keeps the detected profile; `\"\"` clears it." }
        parent_id: { type: [integer, "null"], format: int64 }
        via_agent: { type: [integer, "null"], format: int64, description: "Absent on `PUT` keeps the relay; `null` means direct probing." }
        client_id: { type: integer, format: int64, description: "MSP mode: the client of the target. Absent on `POST`: the client chosen in the header, the only client of the account, or the default client. Only an MSP administrator changes it on `PUT`; the targets depending on it move along." }
        interval_secs: { type: integer, minimum: 10, maximum: 604800, default: 60 }
        enabled: { type: boolean, default: true }
        note: { type: string, maxLength: 2000, description: "Free-text note. Absent on `PUT` keeps it; empty clears it." }
        cve_scan: { type: boolean, default: true, description: "Known-vulnerability (CVE) check of this device. Absent on `PUT` keeps the setting. For several devices at once, see `POST /api/security/cves/targets`." }
        tags:
          type: object
          description: Type options go here under their key.
          additionalProperties: { type: string }
        group_name: { type: [string, "null"], description: "Flat folder shown on `/targets`. Empty or `null`: no folder. Absent on `PUT` keeps the folder." }
        location_id: { type: [integer, "null"], format: int64, description: "Location on the world map; `null`: none. Absent on `PUT` keeps the assignment." }
        channels:
          type: array
          description: "Notification channels of this device (see `Target.channels`). Absent on `PUT` keeps them; `[]` goes back to the channels of the alert rules. A channel of another MSP client is refused."
          items: { type: integer, format: int64 }
        multisite:
          description: "Probe from several locations (uptime monitors only, at least two locations, not combined with `via_agent`); `null`: one place. Absent on `PUT` keeps the setting."
          oneOf:
            - { $ref: "#/components/schemas/MultisiteConfig" }
            - { type: "null" }
        credential:
          $ref: "#/components/schemas/CredentialInput"
          description: 'Absent on `PUT` keeps the stored secret; `{"type": "none"}` clears it. Sent with a secret field absent or empty (community, passphrase, token `secret`, `password`), that secret is kept as long as the identity it belongs to (`username`, `token_id`) is unchanged; otherwise the request is refused with "Enter the … again".'
    CredentialInput:
      description: A device credential. Accepted on input only — never returned.
      writeOnly: true
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { const: none }
        - type: object
          required: [type]
          properties:
            type: { const: snmp_community }
            community: { type: string }
        - type: object
          required: [type, username]
          properties:
            type: { const: snmp_v3 }
            username: { type: string }
            auth:
              type: [object, "null"]
              required: [protocol]
              properties:
                protocol: { type: string, enum: [md5, sha1, sha224, sha256, sha384, sha512] }
                passphrase: { type: string }
            privacy:
              type: [object, "null"]
              required: [protocol]
              properties:
                protocol: { type: string, enum: [des, aes128, aes192, aes256] }
                passphrase: { type: string }
            context: { type: [string, "null"] }
        - type: object
          required: [type]
          description: "`token`, or the two halves `token_id` and `secret` that the server joins into `user@realm!name=secret` for Proxmox VE and PBS."
          properties:
            type: { const: api_token }
            token: { type: string }
            token_id: { type: string }
            secret: { type: string }
        - type: object
          required: [type, username]
          properties:
            type: { const: username_password }
            username: { type: string }
            password: { type: string }
        - type: object
          required: [type, username]
          description: SSH login of a network configuration backup; `enable_secret` is the optional privileged-mode password.
          properties:
            type: { const: ssh_login }
            username: { type: string }
            password: { type: string }
            enable_secret: { type: string }
    MultisiteConfig:
      type: object
      required: [server]
      properties:
        server: { type: boolean, description: The DumbMonit server probes too. }
        agents:
          type: array
          description: Relay agents (ids of `agent` monitors) that probe too.
          items: { type: integer, format: int64 }
        quorum: { type: [integer, "null"], minimum: 1, description: "Failing locations needed to declare the monitor down; null: majority." }
    ProbeLocationsReport:
      type: object
      required: [decision, quorum, counted, failing, confirming, locations]
      properties:
        decision: { type: string, enum: [up, degraded, down, unknown], description: Last published quorum decision. }
        quorum: { type: integer, description: "Failing locations needed for `down`, after exclusions." }
        counted: { type: integer, description: Locations counted in the last decision (excluded ones left out). }
        failing: { type: integer }
        confirming: { type: boolean, description: A confirmation round is re-checking a first failure from every location. }
        decided_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
        locations:
          type: array
          items:
            type: object
            required: [location, name, state]
            properties:
              location: { type: string, description: "Value of the `location` metric label: `server` or `agent-<id>`." }
              agent_id: { type: [integer, "null"], format: int64 }
              name: { type: string, description: Agent name; empty for the server. }
              site: { type: [string, "null"] }
              latitude: { type: [number, "null"] }
              longitude: { type: [number, "null"] }
              state: { type: string, enum: [up, down, excluded, pending] }
              latency_ms: { type: [integer, "null"] }
              error: { type: [string, "null"] }
              excluded_reason: { type: [string, "null"], enum: [silent, not_relay, busy, error, null] }
              checked_at: { $ref: "#/components/schemas/NullableServerTimestamp" }
    ProbeReport:
      type: object
      required: [sample_count, series]
      properties:
        sample_count: { type: integer }
        series:
          type: array
          description: Series keys as the collector produced them, without the `dumbmonit_` prefix.
          items: { type: string }
    DiscoveryReport:
      type: object
      required: [profile_id]
      properties:
        profile_id: { type: [string, "null"] }

    Series:
      type: object
      required: [metric, values]
      properties:
        metric:
          type: object
          additionalProperties: { type: string }
        values:
          type: array
          description: "`[timestamp_seconds, \"value\"]` pairs."
          items:
            type: array
            prefixItems:
              - { type: number }
              - { type: string }
            minItems: 2
            maxItems: 2

    # -------------------------------------------------------------- alertes
    Severity:
      type: string
      enum: [info, warning, critical]
      description: Internal severity. The UI words are info, advisory (warning) and warning (critical).
    Phase:
      type: string
      enum: [ok, pending, firing, resolved]
    EffectivePhase:
      type: string
      enum: [ok, pending, firing, resolved, suppressed]
    ActiveAlert:
      type: object
      required: [fingerprint, rule_uid, rule_name, severity, series_key, labels, phase, effective_phase, suppressed, silenced, learning, acked, dismissed, notify_count]
      properties:
        fingerprint: { type: string }
        rule_uid: { type: string }
        rule_name: { type: string, description: Empty if the rule was deleted meanwhile. }
        severity: { $ref: "#/components/schemas/Severity" }
        target_id: { type: [integer, "null"], format: int64 }
        series_key: { type: string }
        labels:
          type: object
          additionalProperties: { type: string }
        phase: { $ref: "#/components/schemas/Phase" }
        effective_phase: { $ref: "#/components/schemas/EffectivePhase" }
        suppressed: { type: boolean }
        suppressed_by: { type: [integer, "null"], format: int64, description: The unreachable parent device. }
        silenced: { type: boolean }
        learning: { type: boolean, description: Baseline rules stay silent for 14 days. }
        acked: { type: boolean }
        acked_until: { type: [string, "null"], format: date-time }
        acked_by: { type: [string, "null"], description: "An account, or `token:<name>`." }
        ack_note: { type: [string, "null"] }
        dismissed: { type: boolean, description: "Dismissed (\"Got it\"): hidden from the active views, silent until it resolves." }
        dismissed_at: { type: [string, "null"], format: date-time }
        dismissed_by: { type: [string, "null"], description: "An account, or `token:<name>`." }
        value: { type: [number, "null"] }
        score: { type: [number, "null"] }
        condition_since: { type: [string, "null"], format: date-time }
        firing_since: { type: [string, "null"], format: date-time }
        last_eval_at: { type: [string, "null"], format: date-time }
        last_notified_at: { type: [string, "null"], format: date-time }
        notify_count: { type: integer }
        tickets:
          type: array
          description: Tickets opened for this alert by the Jira, GLPI, Zammad, GitHub Issues and GitLab Issues channels.
          items: { $ref: "#/components/schemas/AlertTicket" }
        after_change:
          oneOf:
            - { $ref: "#/components/schemas/AlertAfterChange" }
            - { type: "null" }
          description: The change marker that preceded this alert by less than 30 minutes, if any.
    AlertTicket:
      type: object
      required: [channel_id, channel_name, kind, label, url, state]
      properties:
        channel_id: { type: integer, format: int64 }
        channel_name: { type: string }
        kind: { type: string, description: "Channel kind: `jira`, `glpi`, `zammad`, `github_issues` or `gitlab_issues`." }
        label: { type: string, description: "Ticket reference, such as `OPS-12` or `#34`." }
        url: { type: string, description: Address of the ticket in the service. }
        state: { type: string, enum: [open, closed] }
    AckRequest:
      type: object
      description: "`until` or `duration_secs` (not both); neither means 4 hours; `{\"until\": null}` lifts it."
      properties:
        until: { type: [string, "null"], description: "RFC 3339, or `YYYY-MM-DD HH:MM:SS` in UTC; at most 30 days ahead." }
        duration_secs: { type: integer, minimum: 1 }
        note: { type: string }
    AlertHistoryEntry:
      type: object
      required: [id, fingerprint, rule_uid, from_phase, to_phase, severity, notified, reason, at, dismissed]
      properties:
        id: { type: integer, format: int64 }
        fingerprint: { type: string }
        rule_uid: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        from_phase: { $ref: "#/components/schemas/Phase" }
        to_phase: { $ref: "#/components/schemas/Phase" }
        severity: { $ref: "#/components/schemas/Severity" }
        value: { type: [number, "null"] }
        notified: { type: boolean }
        reason: { type: string, description: "Empty, or why nothing was sent (`learning: would have fired`, `maintenance window`…)." }
        at: { type: string, format: date-time }
        dismissed: { type: boolean, description: "Cleared from the active view by the user; the row is kept." }

    TargetSelector:
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { const: all }
        - type: object
          required: [kind, ids]
          properties:
            kind: { const: ids }
            ids:
              type: array
              items: { type: integer, format: int64 }
        - type: object
          required: [kind, labels]
          properties:
            kind: { const: labels }
            labels:
              type: object
              additionalProperties: { type: string }
    AnomalyParams:
      type: object
      properties:
        k: { type: number, default: 3.5 }
        alpha: { type: number, default: 0.05 }
        mad_floor_abs: { type: number, default: 0.000001 }
        mad_floor_rel: { type: number, default: 0.01 }
        min_samples: { type: integer, default: 3 }
        log_window_secs: { type: integer, minimum: 60, maximum: 86400, default: 300, description: "`log_pattern` rules: counting window. Accepted on write as `window_secs` too." }
        log_per_target: { type: boolean, default: true, description: "`log_pattern` rules: one alert per device (the `target` field of the lines), or a single one. Accepted on write as `per_target` too." }
        forecast_window_days: { type: integer, minimum: 2, maximum: 90, default: 7, description: "`forecast` rules: days of history fitted." }
        forecast_warning_days: { type: number, default: 14, description: "`forecast` rules: at least warning below this many days." }
        forecast_critical_days: { type: number, default: 7, description: "`forecast` rules: critical below this many days." }
        forecast_min_confidence: { type: number, minimum: 0, maximum: 1, default: 0.5, description: "`forecast` rules: forecasts less sure than this never fire." }
        forecast_limit: { type: number, default: 100, description: "`forecast` rules on a custom expression: the value at which it is full." }
        drift_window_secs: { type: integer, minimum: 60, maximum: 86400, default: 900, description: "`drift` rules: window of the current measurement." }
        drift_weeks: { type: integer, minimum: 0, maximum: 8, default: 4, description: "`drift` rules: previous weeks compared at the same hour; 0 uses the 7-day median only." }
        drift_min_samples: { type: integer, default: 5, description: "`drift` rules: minimum points in the window." }
        drift_min_value: { type: number, minimum: 0, default: 0, description: "`drift` rules: smaller values never count (the measurement going up, the usual value going down)." }
        drift_min_delta: { type: number, minimum: 0, default: 0, description: "`drift` rules: minimum absolute gap to the usual value." }
        drift_direction: { type: string, enum: [up, down, both], default: up }
    Operator:
      type: string
      enum: [">", ">=", "<", "<="]
    Rule:
      type: object
      required: [id, uid, name, description, kind, query, operator, threshold, for_secs, severity, selector, channels, params, unit, enabled, builtin, overrides, last_fired_at]
      properties:
        id: { type: integer, format: int64 }
        uid: { type: string }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [threshold, anomaly, predict, log_pattern, forecast, drift, slo_burn], description: "`log_pattern` counts the log lines that match `query` (a LogsQL filter, no pipes) over `params.log_window_secs` and compares the count to `threshold`. `forecast` compares the days before full to `threshold` (`query`: `*`, comma-separated capacity families, or a custom expression full at `params.forecast_limit`); the severity rises to warning and critical below `params.forecast_warning_days` and `params.forecast_critical_days`. `drift` compares how many times the usual value (same hour over the previous weeks, or the 7-day median) the measurement of `query` is to `threshold`, once its robust score reaches `params.k`. `slo_burn` ignores `query`: it reads every enabled SLO and is worth 1 on a slow burn (6× over 6 h and 30 min) and 2 on a fast burn (14.4× over 1 h and 5 min), the severity rising to at least `critical` on a fast burn." }
        query: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }
        threshold: { type: number }
        clear_threshold: { type: [number, "null"], description: Hysteresis; `null` without. }
        for_secs: { type: integer }
        severity: { $ref: "#/components/schemas/Severity" }
        selector: { $ref: "#/components/schemas/TargetSelector" }
        channels:
          type: array
          description: Channel ids; empty means every enabled channel.
          items: { type: integer, format: int64 }
        params: { $ref: "#/components/schemas/AnomalyParams" }
        unit: { type: string, description: "Display unit of `threshold`. `s`, `min`, `h` and `d` mark a duration stored in that unit (the UI types it in minutes, hours or days); `bool` marks an on/off signal with nothing to set; anything else (`%`, `°C`, `GiB`…) is a suffix." }
        repeat_secs: { type: [integer, "null"] }
        escalate_after_secs: { type: [integer, "null"] }
        enabled: { type: boolean }
        builtin: { type: boolean }
        overrides:
          type: array
          items: { $ref: "#/components/schemas/RuleOverride" }
        last_fired_at: { type: [string, "null"], description: "Last time the rule went to firing according to the alert history (RFC 3339, UTC); `null` when it never fired within the retained history." }
    RuleBacktestRequest:
      type: object
      required: [rule]
      properties:
        rule: { $ref: "#/components/schemas/RulePayload" }
        rule_id:
          type: [integer, "null"]
          format: int64
          description: >-
            The saved rule being edited: its identifier and per-device
            overrides apply. Omitted for a rule not saved yet.
        days: { type: integer, enum: [1, 7, 30], default: 7 }
    RuleBacktestPeriod:
      type: object
      required: [start, end, peak]
      properties:
        start: { type: integer, format: int64, description: Unix seconds. }
        end:
          type: [integer, "null"]
          format: int64
          description: Unix seconds; null while still firing at the end of the window.
        peak:
          type: number
          description: The worst value of the period (highest for > and >=, lowest for < and <=).
    RuleBacktestSeries:
      type: object
      required: [series_key, target_id, target_name, threshold, clear_threshold, periods, notifications, absorbed, firing_secs, spark]
      properties:
        series_key: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        target_name: { type: string }
        threshold: { type: number, description: Per-device override included. }
        clear_threshold: { type: [number, "null"] }
        periods:
          type: array
          items: { $ref: "#/components/schemas/RuleBacktestPeriod" }
        notifications: { type: integer }
        absorbed: { type: integer, description: Breaches that cleared before the hold duration. }
        firing_secs: { type: integer, format: int64 }
        spark:
          type: array
          description: The window summed up in at most 96 values (worst of each slice).
          items: { type: number }
    RuleBacktest:
      type: object
      required: [replayable, not_replayable, days, start, end, step_secs, interval_secs, coarsened, series_total, truncated, fired, notifications, absorbed, quiet_series, series]
      properties:
        replayable: { type: boolean }
        not_replayable:
          type: [object, "null"]
          required: [code, reason]
          properties:
            code: { type: string, enum: [anomaly, log_pattern, forecast, drift, slo_burn] }
            reason: { type: string }
        days: { type: integer }
        start: { type: integer, format: int64, description: Unix seconds. }
        end: { type: integer, format: int64, description: Unix seconds. }
        step_secs: { type: integer, description: Step of the replay. }
        interval_secs: { type: integer, description: Evaluation interval of the engine. }
        coarsened: { type: boolean, description: The step was widened to bound the cost. }
        series_total: { type: integer, description: Series returned by the query after selector and overrides. }
        truncated: { type: boolean, description: Not every series was replayed. }
        fired: { type: integer, description: "Firing periods, all replayed series together." }
        notifications: { type: integer }
        absorbed: { type: integer }
        quiet_series: { type: integer, description: Replayed series that would never have fired. }
        series:
          type: array
          description: Series that would have fired, noisiest first.
          items: { $ref: "#/components/schemas/RuleBacktestSeries" }
    AlertNoiseStats:
      type: object
      required: [fired, notifications, acknowledged, resolved, mtta_secs, mttr_secs]
      properties:
        fired: { type: integer, description: Firing episodes in the window. }
        notifications: { type: integer }
        acknowledged: { type: integer, description: Episodes acknowledged or dismissed. }
        resolved: { type: integer }
        mtta_secs: { type: [integer, "null"], description: Mean time to acknowledge. }
        mttr_secs: { type: [integer, "null"], description: Mean time to resolve. }
    AlertNoise:
      type: object
      required: [days, since, truncated, overall, rules, flapping, teams]
      properties:
        days: { type: integer }
        since: { type: string, description: "Start of the window, UTC without suffix." }
        truncated:
          type: boolean
          description: More than 100,000 episodes in the window; the report covers the most recent.
        overall: { $ref: "#/components/schemas/AlertNoiseStats" }
        rules:
          type: array
          description: The 20 noisiest rules (notifications, then episodes).
          items:
            allOf:
              - $ref: "#/components/schemas/AlertNoiseStats"
              - type: object
                required: [rule_uid, rule_id, rule_name, replayable]
                properties:
                  rule_uid: { type: string }
                  rule_id: { type: [integer, "null"], format: int64, description: Null once the rule is deleted. }
                  rule_name: { type: string }
                  replayable: { type: boolean, description: The rule can be tested on history. }
        flapping:
          type: array
          description: Alerts that fired at least 3 times, most state changes first (10 at most).
          items:
            type: object
            required: [fingerprint, rule_uid, rule_id, rule_name, target_id, target_name, changes, firings]
            properties:
              fingerprint: { type: string }
              rule_uid: { type: string }
              rule_id: { type: [integer, "null"], format: int64 }
              rule_name: { type: string }
              target_id: { type: [integer, "null"], format: int64 }
              target_name: { type: [string, "null"] }
              changes: { type: integer, description: Transitions to firing or resolved. }
              firings: { type: integer }
        teams:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/AlertNoiseStats"
              - type: object
                required: [team_id, team_name]
                properties:
                  team_id: { type: integer, format: int64 }
                  team_name: { type: string }
    RulePayload:
      type: object
      required: [name, query]
      properties:
        uid: { type: string, description: Derived from the name when absent. }
        name: { type: string }
        description: { type: string }
        kind: { type: string, enum: [threshold, anomaly, predict, log_pattern, forecast, drift, slo_burn], description: "`log_pattern` counts the log lines that match `query` (a LogsQL filter, no pipes) over `params.log_window_secs` and compares the count to `threshold`. `forecast` compares the days before full to `threshold` (`query`: `*`, comma-separated capacity families, or a custom expression full at `params.forecast_limit`); the severity rises to warning and critical below `params.forecast_warning_days` and `params.forecast_critical_days`. `drift` compares how many times the usual value (same hour over the previous weeks, or the 7-day median) the measurement of `query` is to `threshold`, once its robust score reaches `params.k`. `slo_burn` ignores `query`: it reads every enabled SLO and is worth 1 on a slow burn (6× over 6 h and 30 min) and 2 on a fast burn (14.4× over 1 h and 5 min), the severity rising to at least `critical` on a fast burn." }
        query: { type: string }
        operator: { $ref: "#/components/schemas/Operator" }
        threshold: { type: number }
        clear_threshold: { type: [number, "null"] }
        for_secs: { type: integer, minimum: 0 }
        severity: { $ref: "#/components/schemas/Severity" }
        selector: { $ref: "#/components/schemas/TargetSelector" }
        channels:
          type: array
          items: { type: integer, format: int64 }
        params: { $ref: "#/components/schemas/AnomalyParams" }
        unit: { type: string }
        repeat_secs: { type: [integer, "null"] }
        escalate_after_secs: { type: [integer, "null"] }
        enabled: { type: boolean }
    EnableRequest:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    RuleOverride:
      type: object
      required: [rule_uid, target_id]
      properties:
        rule_uid: { type: string }
        target_id: { type: integer, format: int64 }
        threshold: { type: [number, "null"] }
        clear_threshold: { type: [number, "null"] }
        enabled: { type: [boolean, "null"], description: "`false` removes the device from the rule." }
    OverridePayload:
      type: object
      properties:
        threshold: { type: [number, "null"] }
        clear_threshold: { type: [number, "null"] }
        enabled: { type: [boolean, "null"] }

    Schedule:
      description: >-
        Days are 0 = Monday … 6 = Sunday (1–31 for a monthly `days`); minutes are
        since local midnight (0–1439). On a recurring schedule, `timezone` (IANA)
        wins over `utc_offset_minutes`.
      oneOf:
        - type: object
          required: [kind, starts_at, ends_at]
          properties:
            kind: { const: once }
            starts_at: { type: string, format: date-time }
            ends_at: { type: string, format: date-time }
        - type: object
          description: >-
            Silence with no end of its own ("seen, I am on it"): open from `starts_at`, lifted by
            the server when the monitor answers again. Requires `target_id`.
          required: [kind, starts_at]
          properties:
            kind: { const: recovery }
            starts_at: { type: string, format: date-time }
        - type: object
          required: [kind, days, start_minute, end_minute]
          properties:
            kind: { const: weekly }
            days:
              type: array
              items: { type: integer, minimum: 0, maximum: 6 }
            start_minute: { type: integer, minimum: 0, maximum: 1439 }
            end_minute: { type: integer, minimum: 0, maximum: 1440 }
            utc_offset_minutes: { type: integer, default: 0 }
            timezone: { type: string, examples: [Europe/Paris] }
        - type: object
          required: [kind, start_minute, duration_minutes]
          properties:
            kind: { const: monthly }
            days:
              type: array
              items: { type: integer, minimum: 1, maximum: 31 }
            nth_weekdays:
              type: array
              items:
                type: object
                required: [nth, weekday]
                properties:
                  nth: { type: integer, description: "1 to 5, or -1 for the last one of the month." }
                  weekday: { type: integer, minimum: 0, maximum: 6 }
            start_minute: { type: integer, minimum: 0, maximum: 1439 }
            duration_minutes: { type: integer, minimum: 1 }
            utc_offset_minutes: { type: integer, default: 0 }
            timezone: { type: string }
    Silence:
      type: object
      required: [id, name, comment, matchers, schedule, enabled, active_now]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        comment: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        matchers:
          type: object
          additionalProperties: { type: string }
        schedule: { $ref: "#/components/schemas/Schedule" }
        enabled: { type: boolean }
        active_now: { type: boolean }
        active_until: { type: [string, "null"], format: date-time }
        next_start_at: { type: [string, "null"], format: date-time }
    SilencePayload:
      type: object
      required: [name, schedule]
      properties:
        name: { type: string }
        comment: { type: string }
        target_id: { type: [integer, "null"], format: int64, description: "`null` with no matchers: the whole instance." }
        matchers:
          type: object
          additionalProperties: { type: string }
        schedule: { $ref: "#/components/schemas/Schedule" }
        enabled: { type: boolean, default: true }

    # -------------------------------------------------------- notifications
    MatchCondition:
      oneOf:
        - type: object
          required: [field, key, value]
          properties:
            field: { const: tag }
            key: { type: string }
            value: { type: string }
        - type: object
          required: [field, value]
          properties:
            field: { const: kind }
            value: { type: string }
        - type: object
          required: [field, value]
          properties:
            field: { const: rule }
            value: { type: string }
    ChannelMatcher:
      type: object
      description: Routing filter (12 conditions at most). Empty means the channel receives everything.
      properties:
        include:
          type: array
          items: { $ref: "#/components/schemas/MatchCondition" }
        exclude:
          type: array
          items: { $ref: "#/components/schemas/MatchCondition" }
    ChannelPolicy:
      type: object
      properties:
        min_severity: { $ref: "#/components/schemas/Severity" }
        notify_resolved: { type: boolean }
        min_interval_secs: { type: integer, minimum: 0 }
        quiet_hours:
          description: A weekly schedule, or `null`.
          oneOf:
            - $ref: "#/components/schemas/Schedule"
            - type: "null"
        matcher: { $ref: "#/components/schemas/ChannelMatcher" }
    ChannelKind:
      type: object
      required: [kind, label, summary, doc_url, settings, secrets, actions]
      properties:
        kind: { type: string }
        label: { type: string }
        summary: { type: string }
        doc_url: { type: string }
        actions:
          type: string
          enum: [buttons, links, none]
          description: "How the channel shows the Acknowledge / Snooze action links: native buttons, links in the message, or not at all."
        template_format:
          type: string
          enum: ["", plain, slack_mrkdwn, html, telegram_markdown_v2]
          description: "Format of the channel's message templates, which decides how values are escaped; empty when the type takes no message template."
        settings:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
        secrets:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
    ChannelField:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        required: { type: boolean }
        input: { type: string, enum: [text, url, number, boolean, select, textarea, password] }
        help: { type: string }
        placeholder: { type: string }
        options:
          type: array
          items: { type: string }
        shape: { type: string, enum: [scalar, list, object] }
        default: { type: string }
        destination:
          type: boolean
          description: The field says where the secrets go; changing it on update requires `secrets` in the same request.
        lookup:
          type: string
          description: Empty, or a list the UI loads itself (`oncall_policies`, the escalation policies) to offer as choices.
    Channel:
      type: object
      required: [id, name, kind, enabled, settings, has_secret, policy]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true }
        has_secret: { type: boolean, description: Secrets are never returned. }
        last_error: { type: [string, "null"] }
        last_sent_at: { type: [string, "null"] }
        policy: { $ref: "#/components/schemas/ChannelPolicy" }
        callback_url:
          type: string
          description: "With interactive buttons on Slack or Telegram and a public URL: where the platform sends button presses (paste it as the Slack app's Interactivity Request URL; DumbMonit registers it as the Telegram webhook). Absent otherwise."
    ChannelPayload:
      type: object
      required: [name, kind]
      properties:
        name: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true, description: Non-secret settings; secret keys are refused here. }
        secrets:
          type: [object, "null"]
          additionalProperties: true
          writeOnly: true
          description: "Absent or `null` on `PUT` keeps the stored secrets; `{}` clears them. Otherwise merged by key: a key sent replaces its value, a key left out is kept, `null` or `\"\"` clears it; a new kind or destination replaces the whole set."
        policy:
          type: [object, "null"]
          description: Each field optional; absent keeps the stored policy.
          properties:
            min_severity: { $ref: "#/components/schemas/Severity" }
            notify_resolved: { type: boolean }
            min_interval_secs: { type: integer, minimum: 0 }
            quiet_hours: { description: "A weekly schedule; `null` clears it." }
            matcher: { description: "A `ChannelMatcher`; `null` or `{}` clears it." }
    ChannelTestReport:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message: { type: string }
        filters:
          type: array
          description: >-
            Channel settings that would hold back a real alert: `disabled`,
            `min_severity_warning`, `min_severity_critical`, `quiet_hours`, `matcher`.
            Only present on channel tests.
          items: { type: string }
    MailServer:
      type: object
      required: [host, port, effective_port, security, username, has_password, from_address, from_name, configured, locked_by_env]
      properties:
        host: { type: string }
        port: { type: [integer, "null"], minimum: 1, maximum: 65535, description: "`null`: the usual port of `security`." }
        effective_port: { type: integer, description: "`port`, or 587 (STARTTLS), 465 (TLS), 25 (none)." }
        security: { type: string, enum: [starttls, tls, none] }
        username: { type: string, description: Empty for no authentication. }
        has_password: { type: boolean, description: A password is stored (it is never returned). }
        from_address: { type: string }
        from_name: { type: string, description: Display name of the sender; empty for the address alone. }
        configured: { type: boolean, description: A host and a sender are set. }
        locked_by_env: { type: boolean, description: "Set by the `DUMBMONIT_SMTP_*` environment variables: read-only." }
    MailServerUpdate:
      type: object
      properties:
        host: { type: string, maxLength: 253, description: Host name or address, without scheme. }
        port: { type: [integer, "null"], minimum: 1, maximum: 65535 }
        security: { type: string, enum: [starttls, tls, none], default: starttls }
        username: { type: string }
        from_address: { type: string, format: email }
        from_name: { type: string, maxLength: 120 }
        secrets:
          type: object
          description: "Omitted: the stored password is kept. `{}`: cleared."
          properties:
            password: { type: string }
    MailServerTest:
      type: object
      required: [to]
      properties:
        to: { type: string, format: email }
        server: { $ref: "#/components/schemas/MailServerUpdate" }
    WebPushDevice:
      type: object
      required: [id, device, push_service, fingerprint, created_at, last_success_at, last_error]
      properties:
        id: { type: integer }
        device: { type: string, description: "Readable label from the User-Agent, e.g. \"Firefox on Android\"." }
        push_service: { type: string, description: "Host of the browser's push service." }
        fingerprint: { type: string, description: "First 16 hex characters of SHA-256(endpoint)." }
        created_at: { type: string }
        last_success_at: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
    WebPushOverview:
      type: object
      required: [public_key, devices]
      properties:
        public_key: { type: string, description: "VAPID public key, base64url (uncompressed P-256 point)." }
        devices:
          type: array
          items: { $ref: "#/components/schemas/WebPushDevice" }
    WebPushSubscription:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, description: "base64url, 65 bytes." }
            auth: { type: string, description: "base64url, 16 bytes." }
    WebPushTestReport:
      type: object
      required: [ok, delivered, failed, removed, message]
      properties:
        ok: { type: boolean }
        delivered: { type: integer }
        failed: { type: integer }
        removed: { type: integer, description: "Expired subscriptions removed." }
        message: { type: string }
    NotifyPolicy:
      type: object
      required: [batch_window_secs, max_per_hour, flap_events, flap_window_secs, flap_hold_secs, public_url, escalate_after_secs, escalate_channel, action_links, resolutions_during_silence]
      properties:
        batch_window_secs: { type: integer, description: "0: send at once." }
        max_per_hour: { type: integer, description: "Per channel; 0: unlimited." }
        flap_events: { type: integer }
        flap_window_secs: { type: integer }
        flap_hold_secs: { type: integer, description: "0: no flap detection." }
        public_url: { type: string, description: "Links in messages; empty: `DUMBMONIT_PUBLIC_URL`." }
        escalate_after_secs: { type: integer, description: "0: no escalation." }
        escalate_channel: { type: [integer, "null"], format: int64 }
        action_links: { type: boolean, description: "Acknowledge / Snooze links in notifications; only effective with a public URL. Off also revokes links already sent." }
        resolutions_during_silence: { type: string, enum: [suppress, send], description: "Recovery message for an announced alert that resolves while a silence or maintenance window covers it. `suppress` (default): none is sent; the resolution stays in the alert history. `send`: it is sent anyway." }
    NotifyPolicyUpdate:
      type: object
      properties:
        batch_window_secs: { type: integer }
        max_per_hour: { type: integer }
        flap_events: { type: integer }
        flap_window_secs: { type: integer }
        flap_hold_secs: { type: integer }
        public_url: { type: string }
        escalate_after_secs: { type: integer }
        escalate_channel: { type: [integer, "null"], format: int64 }
        action_links: { type: boolean }
        resolutions_during_silence: { type: string, enum: [suppress, send] }
    TemplatePreviewRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, description: The channel type. }
        title_template: { type: [string, "null"], description: "Empty or absent: the default, `{{title}}`." }
        body_template: { type: [string, "null"], description: "Empty or absent: the default, `{{summary}}` then `{{url}}`." }
    TemplatePreview:
      type: object
      required: [format, title, body, default_title, default_body]
      properties:
        format: { type: string, enum: [plain, slack_mrkdwn, html, telegram_markdown_v2] }
        title: { type: string }
        body: { type: string, description: In the service's format (escaped values). }
        default_title: { type: string }
        default_body: { type: string }
    AlertActionToken:
      type: object
      required: [token]
      properties:
        token: { type: string, description: "The part after `#` in the link." }
    AlertActionLinked:
      type: object
      required: [rule_name, target_name, severity, acked, acked_until, dismissed]
      properties:
        rule_name: { type: string }
        target_name: { type: [string, "null"] }
        severity: { $ref: "#/components/schemas/Severity" }
        acked: { type: boolean }
        acked_until: { type: [string, "null"], format: date-time }
        dismissed: { type: boolean }
    AlertActionView:
      type: object
      required: [action, expires_at, used, alerts]
      properties:
        action: { type: string, enum: [ack, snooze, dismiss] }
        expires_at: { type: string, format: date-time }
        used: { type: boolean, description: "The link has already been used." }
        alerts:
          type: array
          description: The link's alerts that are still active.
          items: { $ref: "#/components/schemas/AlertActionLinked" }
    AlertActionResult:
      type: object
      required: [action, until, acked, dismissed, alerts]
      properties:
        action: { type: string, enum: [ack, snooze, dismiss] }
        until: { type: string, format: date-time, description: "End of the acknowledgement; for `dismiss`, when it was done." }
        acked: { type: integer, description: "Alerts acknowledged by this action." }
        dismissed: { type: integer, description: "Alerts dismissed by this action." }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/AlertActionLinked" }
    MatchPreviewRequest:
      type: object
      required: [matcher]
      properties:
        matcher: { $ref: "#/components/schemas/ChannelMatcher" }
    MatchPreview:
      type: object
      required: [devices, matched, total, rules, excluded_rules]
      properties:
        devices:
          type: array
          items:
            type: object
            required: [id, name, kind, tags, matched]
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              kind: { type: string }
              tags:
                type: object
                additionalProperties: { type: string }
              matched: { type: boolean }
        matched: { type: integer }
        total: { type: integer }
        rules:
          type: array
          items: { type: string }
        excluded_rules:
          type: array
          items: { type: string }

    # ----------------------------------------------------- pages de statut
    ReportSchedule:
      type: object
      required: [id, name, enabled, frequency, weekday, day_of_month, hour, timezone, recipients]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        enabled: { type: boolean }
        frequency: { type: string, enum: [daily, weekly, monthly] }
        weekday: { type: integer, minimum: 0, maximum: 6, description: 0 is Monday. }
        day_of_month: { type: integer, minimum: 1, maximum: 28 }
        hour: { type: integer, minimum: 0, maximum: 23 }
        timezone: { type: string, description: IANA name, example: Europe/Paris }
        recipients: { type: array, items: { type: string, format: email } }
        channel_id:
          type: [integer, "null"]
          format: int64
          description: Email (SMTP) channel used to send; null means the first enabled one.
        last_sent_at: { type: [string, "null"], format: date-time }
        last_error: { type: [string, "null"] }
        next_run_at: { type: [string, "null"], format: date-time }
        kind: { type: string, enum: [digest, sla], description: "`digest`: the rolling summary; `sla`: the previous calendar month with a PDF and CSV files." }
        attach_pdf: { type: boolean }
        attach_csv: { type: boolean }
        page_id: { type: [integer, "null"], format: int64, description: Status page whose title heads the SLA report. }
        objective: { type: [number, "null"], description: Availability objective in percent (SLA report). }
        layout: { $ref: "#/components/schemas/ReportLayout" }
        scope: { $ref: "#/components/schemas/ReportScope" }
    ReportSchedulePayload:
      type: object
      properties:
        name: { type: string, maxLength: 80, default: Team report }
        enabled: { type: boolean, default: true }
        frequency: { type: string, enum: [daily, weekly, monthly], default: weekly }
        weekday: { type: integer, minimum: 0, maximum: 6, default: 0 }
        day_of_month: { type: integer, minimum: 1, maximum: 28, default: 1 }
        hour: { type: integer, minimum: 0, maximum: 23, default: 8 }
        timezone: { type: string, default: UTC }
        recipients:
          type: array
          maxItems: 20
          items: { type: string, format: email }
        channel_id: { type: [integer, "null"], format: int64 }
        kind: { type: string, enum: [digest, sla], default: digest, description: "`sla` requires `frequency: monthly`." }
        attach_pdf: { type: boolean, default: true, description: SLA report only. }
        attach_csv: { type: boolean, default: true, description: "SLA report only: the monitors file and the incidents file." }
        page_id: { type: [integer, "null"], format: int64 }
        objective: { type: [number, "null"], exclusiveMinimum: 0, maximum: 100 }
        layout: { $ref: "#/components/schemas/ReportLayout" }
        scope: { $ref: "#/components/schemas/ReportScope" }
    ReportLayout:
      type: object
      description: How the SLA PDF is laid out. Every field is optional; the default is the detailed report on A4 with every section.
      properties:
        template: { type: string, enum: [detailed, summary], default: detailed }
        paper: { type: string, enum: [a4, letter], default: a4 }
        sections:
          type: object
          description: Sections to include; an omitted one is included.
          properties:
            summary: { type: boolean, default: true, description: Key figures and the objective. }
            chart: { type: boolean, default: true, description: Availability bars by group or monitor. }
            monitors: { type: boolean, default: true, description: Table by monitor (by group in the summary). }
            incidents: { type: boolean, default: true, description: Every incident (the major ones in the summary). }
            maintenance: { type: boolean, default: true }
            response_times: { type: boolean, default: true }
            notes: { type: boolean, default: true }
        title: { type: [string, "null"], maxLength: 120, description: Heading under the brand; null is "Availability report". }
        notes: { type: string, maxLength: 2000, default: "" }
        show_logo: { type: boolean, default: true, description: "Kept for layouts saved before `logo`; always `logo != none` once saved. `false` wins over `logo`." }
        logo: { type: string, enum: [auto, client, page, custom, none], default: auto, description: "Where the logo comes from: `auto` (the client's, else the status page's), `client`, `page`, `custom` (`/api/reports/logo`) or `none`." }
        objectives: { $ref: "#/components/schemas/ReportObjectives" }
    ReportObjectives:
      type: object
      description: Availability objectives of single groups or monitors, in percent, which replace the report's objective for those rows. A monitor's own objective wins over its group's. Keys are names.
      properties:
        groups: { type: object, additionalProperties: { type: number, exclusiveMinimum: 0, maximum: 100 }, description: By group name; "Ungrouped" for the monitors without a group. }
        monitors: { type: object, additionalProperties: { type: number, exclusiveMinimum: 0, maximum: 100 }, description: By monitor name. }
    ReportScope:
      type: object
      description: The monitors listed and those of the groups listed (union). Empty is every monitor the report can see.
      properties:
        targets: { type: array, maxItems: 1000, items: { type: integer, format: int64 } }
        groups: { type: array, maxItems: 200, items: { type: string }, description: Group names; "Ungrouped" selects the monitors without a group. }
    SlaReport:
      type: object
      required: [brand, title, period_label, period_start, period_end, timezone, generated_at, layout, availability_known, fleet_status, downtime_secs, incident_count, previous_incident_count, grouped, groups, monitors, incidents, maintenance]
      properties:
        brand: { type: string }
        title: { type: string }
        period_label: { type: string, example: "2026-10-01 to 2026-10-31 (UTC)" }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }
        timezone: { type: string }
        generated_at: { type: string, format: date-time }
        objective: { type: [number, "null"] }
        layout: { $ref: "#/components/schemas/ReportLayout" }
        logo_url: { type: [string, "null"], description: "Address of the logo at the top, relative to `/api`; null without a logo." }
        availability_known: { type: boolean }
        fleet_uptime: { type: [number, "null"] }
        fleet_previous_uptime: { type: [number, "null"] }
        fleet_status: { type: string, enum: [Met, Missed, Healthy, Degraded, Poor, No data] }
        downtime_secs: { type: integer }
        incident_count: { type: integer }
        previous_incident_count: { type: integer }
        grouped: { type: boolean }
        groups:
          type: array
          items:
            type: object
            required: [name, monitors, status]
            properties:
              name: { type: string }
              monitors: { type: integer }
              uptime: { type: [number, "null"] }
              previous_uptime: { type: [number, "null"] }
              objective: { type: [number, "null"], description: The objective that applies to the group; its own or the report's. }
              own_objective: { type: boolean, description: True when the objective is the group's own. }
              status: { type: string }
        monitors:
          type: array
          items:
            type: object
            required: [name, group, status, incidents, downtime_secs]
            properties:
              name: { type: string }
              group: { type: string }
              uptime: { type: [number, "null"] }
              previous_uptime: { type: [number, "null"] }
              objective: { type: [number, "null"], description: The objective that applies to the monitor; its own (or its group's) or the report's. }
              own_objective: { type: boolean, description: True when the objective is the monitor's or its group's own. }
              status: { type: string }
              incidents: { type: integer }
              downtime_secs: { type: integer }
              latency_avg_ms: { type: [number, "null"] }
              latency_p95_ms: { type: [number, "null"] }
        incidents:
          type: array
          items:
            type: object
            required: [monitor, rule, severity, started_at, duration_secs, began_before_period, major]
            properties:
              monitor: { type: string }
              rule: { type: string }
              severity: { type: string }
              started_at: { type: string, format: date-time }
              ended_at: { type: [string, "null"], format: date-time }
              duration_secs: { type: integer }
              began_before_period: { type: boolean }
              major: { type: boolean, description: Among the major incidents of the summary template. }
        maintenance:
          type: array
          items:
            type: object
            required: [name, starts_at, ends_at, recurring]
            properties:
              name: { type: string }
              monitor: { type: [string, "null"] }
              starts_at: { type: string, format: date-time }
              ends_at: { type: string, format: date-time }
              recurring: { type: boolean }
    MaintenanceCalendar:
      type: object
      required: [token, path]
      properties:
        token: { type: string }
        path: { type: string, description: "`/api/calendar/maintenance.ics?token=…`: add the server's origin to subscribe." }
    ReportPreviewResult:
      type: object
      required: [sent, failed]
      properties:
        sent: { type: integer }
        failed: { type: integer }
    StatusPageView:
      type: object
      required: [id, slug, title, description, published, theme, show_uptime_days, created_at, updated_at, accent, footer_text, homepage_url, items]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        published: { type: boolean }
        theme: { type: string, enum: [auto, light, dark] }
        show_uptime_days: { type: integer, minimum: 1, maximum: 90 }
        created_at: { type: string }
        updated_at: { type: string }
        accent: { type: string, enum: [default, blue, teal, violet, rose, amber] }
        footer_text: { type: string }
        homepage_url: { type: string }
        show_calendar: { type: boolean }
        show_latency: { type: boolean }
        logo_type: { type: [string, "null"], enum: [image/png, image/jpeg, image/webp, null] }
        subscribe_channel_id: { type: [integer, "null"], format: int64, description: "SMTP channel chosen for subscriber emails; `null`: the email server of the instance." }
        subscribe_email: { type: boolean, description: Visitors may subscribe by email. }
        domain: { type: [string, "null"], description: "Public host name serving this page at `/`; `null` for none." }
        seo: { $ref: "#/components/schemas/StatusPageSeo" }
        access_mode: { type: string, enum: [public, password, users], description: "Who can read the page; set through `PUT /api/status-pages/{id}/access`." }
        has_password: { type: boolean, description: A page password is stored (the hash is never returned). }
        hide_branding: { type: boolean, description: "White label: the public page shows no DumbMonit name, icon or app name; its browser-tab icon is the page logo, or none." }
        listed: { type: boolean, description: "Shown in the public directory (GET /api/public/status) when the page is also published and public." }
        group_labels:
          type: array
          items: { $ref: "#/components/schemas/StatusPageGroupLabel" }
          description: Public names of the monitors that come in through a checked group. None set for a monitor means its own name is published.
        groups:
          type: array
          items: { type: string }
          description: Checked groups (monitor folders), in order. Their current members are shown, so a monitor added to or removed from the folder appears or disappears by itself.
        items:
          type: array
          items: { $ref: "#/components/schemas/StatusPageItem" }
    StatusPageGroupLabel:
      type: object
      required: [target_id, label]
      properties:
        target_id: { type: integer, format: int64 }
        label: { type: string, maxLength: 80, description: Public name shown to visitors. The monitor's private name is never published when this is set. }
    StatusPageSeo:
      type: object
      description: >-
        Search-engine settings. An empty text field means "generated default"
        (built from the page name). The page is indexable only when it is
        published and `index` is true; otherwise it answers `noindex, nofollow`.
      properties:
        index: { type: boolean, default: false, description: "`true`: `index, follow`; `false`: `noindex, nofollow`." }
        title: { type: string, maxLength: 120, description: About 60 characters is displayed. }
        description: { type: string, maxLength: 320, description: About 155 characters is displayed. }
        keywords: { type: string, maxLength: 300 }
        canonical: { type: string, description: "Absolute `http(s)://` URL, or empty." }
        image: { type: string, description: "Absolute `http(s)://` share image (Open Graph / Twitter), or empty." }
        lang: { type: string, description: "Language tag such as `en`, `fr`, `pt-BR`; empty: `en`." }
        site_name: { type: string, maxLength: 100 }
    StatusPageItem:
      type: object
      required: [id, page_id, target_id, label, group_name, position]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        label: { type: string }
        group_name: { type: string }
        position: { type: integer }
    StatusPageItemInput:
      type: object
      required: [target_id]
      properties:
        target_id: { type: integer, format: int64 }
        label: { type: string, maxLength: 80 }
        group_name: { type: string, maxLength: 60 }
    StatusPagePayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 120 }
        slug: { type: string, pattern: "^[a-z0-9-]{2,40}$", description: Derived from the title when omitted. }
        description: { type: string, maxLength: 1000 }
        published: { type: boolean, default: false }
        theme: { type: string, enum: [auto, light, dark], default: auto }
        show_uptime_days: { type: integer, minimum: 1, maximum: 90, default: 90, description: "Period shown by the history bars: 1 (24 hours), 7, 30, 60 or 90 days. The bars adapt to younger data." }
        accent: { type: string, enum: [default, blue, teal, violet, rose, amber] }
        footer_text: { type: string, maxLength: 280 }
        homepage_url: { type: string, maxLength: 300, description: "`http(s)://` or empty." }
        scenes:
          type: array
          items: { type: string }
          description: >-
            Decorative scene ids: `paris`, `tokyo`, `newyork`, `dubai`. A retired id (for
            example `venice`, or `matterhorn`, replaced by `dubai`) is folded onto the nearest
            of the four. Omitted keeps the saved list; `[]` means no scene.
        scene_rotation: { type: string, description: Omitted keeps the saved value (`visit` on creation). }
        simple: { type: boolean, default: false, description: Omitted keeps the saved value. }
        show_calendar: { type: boolean, default: false, description: Public 90-day calendar. Omitted keeps the saved value. }
        show_latency: { type: boolean, default: false, description: Public response-time graph per service. Omitted keeps the saved value. }
        hide_branding: { type: boolean, default: false, description: "White label: nothing of DumbMonit on the public page (tab title, icon, app name). The tab icon becomes the page logo, or none. Omitted keeps the saved value." }
        listed: { type: boolean, default: true, description: "List the page in the public directory (GET /api/public/status); only published, public pages are ever listed. Omitted keeps the saved value." }
        subscribe_email: { type: boolean, description: "Lets visitors subscribe by email. The emails go through `subscribe_channel_id` when set, otherwise through the email server of the instance (`/api/notify/mail-server`). Omitted keeps the saved value, unless `subscribe_channel_id` is given: a channel opens it, `null` closes it (as before this field)." }
        subscribe_channel_id: { type: [integer, "null"], format: int64, description: "An `smtp` channel that sends the subscriber emails instead of the email server; `null`: the email server. Omitted keeps the saved channel." }
        seo:
          $ref: "#/components/schemas/StatusPageSeo"
        groups:
          type: array
          maxItems: 50
          items: { type: string, maxLength: 200 }
          description: Monitor folders shown as a whole (dynamic). Omitted keeps the saved list; `[]` unchecks all.
        group_labels:
          type: array
          items: { $ref: "#/components/schemas/StatusPageGroupLabel" }
          description: Public names of group members. Omitted keeps the saved ones; `[]` clears them.
        domain:
          type: [string, "null"]
          description: >-
            Public host name (`status.example.com`), lowercased; a scheme or trailing
            slash is stripped, a port or path is refused. Unique across pages and
            never the address of DumbMonit itself (409 / 400). `null` or `""`
            removes it. Requests whose `Host` is this name only reach this page.
    LogoUpload:
      type: object
      required: [data]
      properties:
        data: { type: string, description: "Base64, or a `data:` URL." }
    StatusSubscriptionSettings:
      type: object
      properties:
        sms_channel_id: { type: [integer, "null"], format: int64, description: "Vonage, Telnyx or ASPSMS channel that texts the subscribers; `null`: no SMS." }
        webhook: { type: boolean }
        slack: { type: boolean }
    Subscriber:
      type: object
      required: [id, page_id, kind, destination, created_at]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: integer, format: int64 }
        kind: { type: string, enum: [email, sms, webhook, slack] }
        destination: { type: string, description: "Address for email; masked number or URL host otherwise." }
        email: { type: [string, "null"], description: "Address, email subscribers only." }
        components: { type: [array, "null"], items: { type: integer, format: int64 }, description: "Followed devices; `null`: all." }
        confirmed_at: { type: [string, "null"], description: "`null` while pending." }
        created_at: { type: string }
    Incident:
      type: object
      required: [id, title, kind, status, severity, starts_at, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        page_id: { type: [integer, "null"], format: int64 }
        title: { type: string }
        kind: { type: string, enum: [incident, maintenance] }
        status:
          type: string
          description: "Incident: investigating, identified, monitoring, resolved. Maintenance: scheduled, in_progress, completed."
        severity: { type: string, enum: [minor, major] }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        created_at: { type: string }
        updated_at: { type: string }
    IncidentUpdate:
      type: object
      required: [id, incident_id, status, body, created_at]
      properties:
        id: { type: integer, format: int64 }
        incident_id: { type: integer, format: int64 }
        status: { type: string }
        body: { type: string }
        created_at: { type: string }
    IncidentView:
      allOf:
        - $ref: "#/components/schemas/Incident"
        - type: object
          required: [updates, components]
          properties:
            updates:
              type: array
              items: { $ref: "#/components/schemas/IncidentUpdate" }
            components:
              type: array
              items: { type: integer, format: int64 }
              description: Devices the announcement concerns; empty means the whole page.
            postmortem:
              description: The post-mortem, draft or published; null until one is written.
              oneOf:
                - $ref: "#/components/schemas/Postmortem"
                - type: "null"
    PostmortemTimelineEntry:
      type: object
      required: [at, text]
      properties:
        at: { type: string, description: "UTC, `YYYY-MM-DDTHH:MM:SSZ`." }
        text: { type: string, maxLength: 2000 }
    PostmortemAction:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 500 }
        done: { type: boolean, default: false }
    Postmortem:
      type: object
      required: [incident_id, summary, impact, root_cause, timeline, actions, published, created_at, updated_at]
      properties:
        incident_id: { type: integer, format: int64 }
        summary: { type: string }
        impact: { type: string }
        root_cause: { type: string }
        timeline:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/PostmortemTimelineEntry" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/PostmortemAction" }
        published: { type: boolean }
        published_at: { type: [string, "null"], description: "First publication; null while a draft." }
        created_at: { type: string }
        updated_at: { type: string }
    PostmortemPayload:
      type: object
      properties:
        summary: { type: string, maxLength: 20000, description: Required to publish. }
        impact: { type: string, maxLength: 20000 }
        root_cause: { type: string, maxLength: 20000 }
        timeline:
          type: array
          maxItems: 100
          description: "Any order: stored sorted by time. `at` accepts RFC 3339 or `YYYY-MM-DDTHH:MM` (UTC)."
          items: { $ref: "#/components/schemas/PostmortemTimelineEntry" }
        actions:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/PostmortemAction" }
        published: { type: boolean, default: false, description: Only once the incident is resolved. }
    PublicPostmortem:
      type: object
      required: [summary, impact, root_cause, timeline, actions]
      properties:
        summary: { type: string }
        impact: { type: string }
        root_cause: { type: string }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/PostmortemTimelineEntry" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/PostmortemAction" }
        published_at: { type: [string, "null"] }
    SloPayload:
      type: object
      required: [name, objective, window_days]
      properties:
        name: { type: string, maxLength: 80, description: Unique. }
        description: { type: string, maxLength: 500, default: "" }
        objective: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 100, example: 99.9, description: Availability target in percent. }
        window_days: { type: integer, enum: [7, 28, 30, 90], description: Rolling window. }
        scope: { $ref: "#/components/schemas/ReportScope" }
        enabled: { type: boolean, default: true, description: "A disabled SLO is still shown but raises no burn-rate alert." }
    SloBudget:
      type: object
      required: [total_minutes, consumed_minutes, remaining_minutes, remaining_percent]
      properties:
        total_minutes: { type: number, description: Downtime the target allows over the window. }
        consumed_minutes: { type: number }
        remaining_minutes: { type: number, description: Negative once the target is missed. }
        remaining_percent: { type: number, description: Negative once the target is missed. }
    SloStatus:
      type: object
      required: [measured, monitors, burn, verdict]
      properties:
        measured: { type: boolean, description: False when VictoriaMetrics did not answer. }
        monitors: { type: integer, description: Enabled monitors the SLO covers. }
        attained: { type: [number, "null"], description: Availability over the window, in percent. }
        budget:
          oneOf:
            - $ref: "#/components/schemas/SloBudget"
            - type: "null"
        burn:
          type: object
          description: "Burn rates: downtime over the window divided by the downtime the target allows. 1 spends the budget exactly by the end of the window."
          properties:
            m5: { type: [number, "null"] }
            m30: { type: [number, "null"] }
            h1: { type: [number, "null"] }
            h6: { type: [number, "null"] }
        verdict:
          type: string
          enum: [none, slow, fast]
          description: "`fast`: at least 14.4× over 1 h and 5 min. `slow`: at least 6× over 6 h and 30 min."
    Slo:
      type: object
      required: [id, name, description, objective, window_days, scope, enabled, created_at, updated_at, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        objective: { type: number }
        window_days: { type: integer }
        scope: { $ref: "#/components/schemas/ReportScope" }
        enabled: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
        status: { $ref: "#/components/schemas/SloStatus" }
    SloDetail:
      allOf:
        - $ref: "#/components/schemas/Slo"
        - type: object
          required: [members, burndown]
          properties:
            members: { type: array, items: { type: integer, format: int64 } }
            burndown:
              type: array
              description: "`[unix seconds, % of the budget left]` over the window, starting at 100; empty without measurements."
              items:
                type: array
                minItems: 2
                maxItems: 2
                items: { type: number }
    AnnotationScope:
      description: >-
        Where a marker applies: the whole instance (`global`), these monitors, a
        folder with its subfolders, or the monitors carrying one of these tags
        (`key` or `key=value`).
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [global] }
        - type: object
          required: [kind, targets]
          properties:
            kind: { type: string, enum: [monitors] }
            targets: { type: array, items: { type: integer, format: int64 } }
        - type: object
          required: [kind, folder]
          properties:
            kind: { type: string, enum: [folder] }
            folder: { type: string }
        - type: object
          required: [kind, tags]
          properties:
            kind: { type: string, enum: [tags] }
            tags: { type: array, items: { type: string } }
    Annotation:
      type: object
      required: [id, at, until, title, text, link, tags, scope, source, author, created_at]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, description: "UTC without suffix, `2026-11-22 10:00:00`." }
        until: { type: [string, "null"], description: End of the window; null for a single instant. }
        title: { type: string }
        text: { type: string }
        link: { type: string, description: An http(s) address, or empty. }
        tags: { type: array, items: { type: string } }
        scope: { $ref: "#/components/schemas/AnnotationScope" }
        source: { type: string, enum: [api, ui, ci] }
        author: { type: string, description: "Account, or `token:name` for an API token." }
        created_at: { type: string }
    AnnotationPayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 200 }
        text: { type: string, maxLength: 4000 }
        at: { type: string, description: RFC 3339; now when omitted. }
        until: { type: [string, "null"], description: RFC 3339; makes the marker a window. }
        link: { type: string, description: An http(s) address. }
        tags: { type: array, maxItems: 10, items: { type: string } }
        scope: { $ref: "#/components/schemas/AnnotationScope" }
        source: { type: string, enum: [api, ui, ci], description: "`api` for a token, `ui` for a session by default." }
    AnnotationUpdate:
      type: object
      properties:
        title: { type: string }
        text: { type: string }
        at: { type: string }
        until: { type: [string, "null"] }
        link: { type: string }
        tags: { type: array, items: { type: string } }
        scope: { $ref: "#/components/schemas/AnnotationScope" }
    AlertAfterChange:
      type: object
      required: [id, title, at]
      description: The marker of the same monitor that precedes the alert by less than 30 minutes.
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        at: { type: string }
    IncidentPayload:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 160 }
        kind: { type: string, enum: [incident, maintenance] }
        status: { type: string }
        severity: { type: string, enum: [minor, major] }
        page_id: { type: [integer, "null"], format: int64 }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        body: { type: string, maxLength: 4000, description: 'First update, at creation only.' }
        components:
          type: array
          items: { type: integer, format: int64 }
          description: Devices the announcement concerns. Subscribers who follow only other services are not notified; omitted keeps the stored value (the whole page at creation).
    IncidentUpdatePayload:
      type: object
      required: [body]
      properties:
        status: { type: string, description: Defaults to the incident's current status. }
        body: { type: string, maxLength: 4000 }
        at: { type: string, description: Date of the message to complete a history; such a message notifies nobody. }
        notify:
          type: boolean
          default: true
          description: "`false` publishes the message without notifying subscribers."
    StatusPageLanguages:
      type: object
      properties:
        default_lang:
          type: string
          description: Default interface language of the page ("" means English).
          enum: ["", en, de, es, fr, it, pt, pt-BR, ru, zh-Hans, ja, ko, nl, pl, tr]
        translations:
          type: array
          items:
            type: object
            required: [lang]
            properties:
              lang: { type: string, enum: [en, de, es, fr, it, pt, pt-BR, ru, zh-Hans, ja, ko, nl, pl, tr] }
              title: { type: string }
              description: { type: string }
              footer_text: { type: string }
              labels:
                type: object
                additionalProperties: { type: string }
                description: Written service or group name to its translation.

    PublicStatusDirectory:
      type: object
      required: [pages]
      properties:
        pages:
          type: array
          items:
            type: object
            required: [slug, title, url, default_lang, languages]
            properties:
              slug: { type: string, description: "Address of the page: its document is /api/public/status/{slug}." }
              title: { type: string }
              url: { type: string, description: "The public page: absolute when the server knows its address (the page's domain, or the address it is managed from), else /s/{slug}, relative to the server." }
              default_lang: { type: string, description: "Default interface language of the page (en when the admin set none)." }
              languages: { type: array, items: { type: string }, description: "Languages the page's texts can be read in: the default one first, then those translated by the admin. Pass one as ?lang= to the page's document." }

    PublicStatus:
      type: object
      required: [page, overall, generated_at, groups, incidents, maintenance]
      properties:
        page:
          type: object
          properties:
            slug: { type: string }
            title: { type: string }
            description: { type: string }
            theme: { type: string }
            show_uptime_days: { type: integer }
            window_secs: { type: integer, description: "Duration the history bars really cover: the chosen period, or less when the data is younger." }
            step_secs: { type: integer, description: "Duration of one bar; 86400 means one bar per day." }
            updated_at: { type: string }
            accent: { type: string }
            footer_text: { type: string }
            homepage_url: { type: string }
            logo_url: { type: [string, "null"], description: "The page logo, or in MSP mode the logo of the page's client." }
            brand_name: { type: string, description: "MSP mode: name of the page's client. Absent otherwise." }
            subscribe: { type: boolean, description: The page offers at least one subscription. }
            subscribe_kinds:
              type: array
              items: { type: string, enum: [email, sms, webhook, slack] }
            show_calendar: { type: boolean, description: Present (true) only when the page shows the calendar. }
            show_latency: { type: boolean, description: Present (true) only when the page shows response times. }
            hide_branding: { type: boolean, description: "White label: the page names nothing of DumbMonit; the tab icon is the logo, or none." }
            default_lang: { type: string, description: "Default interface language of the page (en when the admin set none)." }
            lang: { type: string, description: "Language the page's own texts were served in." }
            languages: { type: array, items: { type: string }, description: "Languages the admin translated the page's texts into." }
            seo:
              type: object
              description: Effective search-engine values (settings, or defaults built from the page name).
              properties:
                indexable: { type: boolean }
                title: { type: string }
                description: { type: string }
                keywords: { type: string }
                canonical: { type: string }
                image: { type: string }
                lang: { type: string }
                site_name: { type: string }
        calendar:
          type: array
          description: One entry per day, oldest first (90 days). Present only when the calendar is enabled.
          items:
            type: object
            properties:
              date: { type: string }
              state: { type: string, enum: [operational, degraded, outage, nodata] }
              uptime_pct: { type: [number, "null"] }
              incidents: { type: integer }
        overall: { type: string }
        generated_at: { type: string }
        groups:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              items:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    target_id: { type: integer, format: int64, description: "Editor preview (`GET /api/status-pages/{id}/preview`) only: the monitor of the service." }
                    label: { type: string }
                    state: { type: string }
                    uptime_24h: { type: [number, "null"] }
                    uptime_7d: { type: [number, "null"] }
                    uptime_30d: { type: [number, "null"] }
                    uptime_90d: { type: [number, "null"] }
                    uptime_history:
                      type: [number, "null"]
                      description: Uptime over the page's history_days, the days the bar shows.
                    latency_ms: { type: [number, "null"] }
                    latency_series:
                      type: object
                      description: Present only when response times are enabled and the service has latency data.
                      properties:
                        h24: { type: array, items: { type: array, items: { type: number }, description: "[unix seconds, milliseconds]" } }
                        d7: { type: array, items: { type: array, items: { type: number } } }
                    history:
                      type: array
                      items:
                        type: object
                        properties:
                          date: { type: string }
                          uptime_pct: { type: [number, "null"] }
                          down_minutes: { type: [integer, "null"] }
                          incidents: { type: integer }
                    external:
                      type: boolean
                      description: Present and true for a third-party provider (a `provider` monitor), shown as an external component.
        incidents:
          type: array
          items: { $ref: "#/components/schemas/PublicIncident" }
        maintenance:
          type: array
          items: { $ref: "#/components/schemas/PublicIncident" }
    PublicIncident:
      type: object
      properties:
        anchor: { type: string, description: "Anchor and permalink (`#incident-<anchor>`): the start (`YYYYMMDD-HHMM`) and the title as a slug, never the internal id." }
        components:
          type: array
          items: { type: string }
          description: Keys of the services touched; absent for the whole page.
        title: { type: string }
        kind: { type: string }
        status: { type: string }
        severity: { type: string }
        starts_at: { type: string }
        ends_at: { type: [string, "null"] }
        updates:
          type: array
          items:
            type: object
            properties:
              status: { type: string }
              body: { type: string }
              created_at: { type: string }
        postmortem:
          $ref: "#/components/schemas/PublicPostmortem"
          description: The published post-mortem of a resolved incident; absent otherwise.

    # ------------------------------------------------------- agents, conteneurs
    Relay:
      type: object
      required: [id, name, relay, relayed]
      properties:
        id: { type: integer, format: int64, description: Id of the `agent` device. }
        name: { type: string }
        site: { type: [string, "null"] }
        relay: { type: boolean, description: The agent declared `relay true` in its last batch. }
        last_seen_at: { type: [string, "null"] }
        relayed: { type: integer, description: Devices reached through this agent. }
        gateway_wanted: { type: [integer, "null"], description: Gateway port asked from the UI; null when closed. }
        gateway_port: { type: [integer, "null"], description: Port the relay reports its gateway listening on. }
        gateway_host: { type: [string, "null"], description: Address the site reaches the relay at. }
        client_id: { type: [integer, "null"], format: int64, description: Client of the agent; a relay only carries machines of its own client. }
    MetricsCatalog:
      type: object
      required: [metrics, truncated]
      properties:
        truncated: { type: boolean }
        metrics:
          type: array
          items:
            type: object
            required: [name, series, labels]
            properties:
              name: { type: string }
              series: { type: integer }
              labels:
                type: array
                items:
                  type: object
                  required: [name, values, more]
                  properties:
                    name: { type: string }
                    values: { type: array, items: { type: string } }
                    more: { type: boolean }
    Locations:
      type: object
      required: [locations, sites, unplaced]
      properties:
        locations:
          type: array
          items: { $ref: "#/components/schemas/Location" }
        sites:
          type: array
          items: { type: string }
          description: Remote sites the topology map knows, sorted.
        unplaced:
          type: array
          items: { type: integer, format: int64 }
          description: Devices no location gathers.
    Location:
      type: object
      required: [id, name, address, latitude, longitude, site, code, members]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string, maxLength: 2, description: "Two-character badge code, upper case (e.g. `CR`); never empty." }
        address: { type: string, description: Free text, shown only. }
        latitude: { type: number }
        longitude: { type: number }
        site: { type: string, description: "Topology site this location stands for (case-insensitive); empty: none." }
        members:
          type: array
          items:
            type: object
            required: [target_id, source]
            properties:
              target_id: { type: integer, format: int64 }
              source:
                type: string
                enum: [assigned, site]
    LocationInput:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 200 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        site: { type: string, maxLength: 80 }
        code: { type: string, maxLength: 2, description: "Badge code; normalised to at most two upper-case letters or digits, accents removed. Empty or omitted: the first two letters of the name." }
    Basemap:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [offline, osm, custom] }
        url: { type: string, description: "Tile address with `{z}`, `{x}`, `{y}`; set by the server for `osm`, empty for `offline`." }
        attribution: { type: string, maxLength: 200 }
    GeoipStatus:
      type: object
      required: [enabled, state, ranges, source, source_url]
      properties:
        enabled: { type: boolean }
        state: { type: string, enum: [ready, loading, missing, failed, disabled] }
        month: { type: [string, "null"], description: "Month of the loaded database (`2026-10`)." }
        ranges: { type: integer }
        error: { type: [string, "null"] }
        source: { type: string }
        source_url: { type: string, description: Link the attribution must carry (CC BY 4.0). }
    OpnsenseLiveTally:
      type: object
      required: [blocked, passed, other]
      properties:
        blocked: { type: integer }
        passed: { type: integer }
        other: { type: integer }
    OpnsenseLive:
      type: object
      required: [enabled, relayed, window_secs, totals, countries, rules, ports, recent, seq, geoip]
      properties:
        enabled: { type: boolean, description: False while the `live_map` option is off. }
        relayed: { type: boolean, description: Polled through a relay agent; the server cannot read the log. }
        window_secs: { type: integer }
        polled_at: { type: [integer, "null"], description: Unix seconds. }
        error: { type: [string, "null"], description: Why the last read of the log failed. }
        totals: { $ref: "#/components/schemas/OpnsenseLiveTally" }
        countries:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/OpnsenseLiveTally"
              - type: object
                required: [code]
                properties:
                  code: { type: string, description: "ISO 3166-1 alpha-2, `local` or `unknown`." }
        rules:
          type: array
          items:
            type: object
            required: [rule, action, count]
            properties:
              rule: { type: string }
              action: { type: string, enum: [block, pass, other] }
              count: { type: integer }
        ports:
          type: array
          items:
            type: object
            required: [proto, port, count]
            properties:
              proto: { type: string }
              port: { type: integer }
              count: { type: integer }
        recent:
          type: array
          items:
            type: object
            required: [seq, at, action, outbound, country, proto, rule]
            properties:
              seq: { type: integer }
              at: { type: integer }
              action: { type: string, enum: [block, pass, other] }
              outbound: { type: boolean }
              country: { type: string }
              proto: { type: string }
              port: { type: [integer, "null"] }
              rule: { type: string }
        seq: { type: integer }
        firewall:
          type: [object, "null"]
          properties:
            name: { type: string }
            latitude: { type: number }
            longitude: { type: number }
        geoip: { $ref: "#/components/schemas/GeoipStatus" }
    Topology:
      type: object
      required: [nodes, edges, metrics_available]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TopologyNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/TopologyEdge" }
        metrics_available:
          type: boolean
          description: False when VictoriaMetrics did not answer; `hypervisor` and `lldp` links are then missing.
        corrections:
          type: array
          items: { $ref: "#/components/schemas/TopologyCorrection" }
          description: Corrections made by hand, already applied to `nodes` and `edges`.
        rules:
          type: array
          items: { $ref: "#/components/schemas/TopologyRule" }
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/TopologySuggestion" }
    TopologyCorrection:
      type: object
      required: [id, kind, to, use_for_alerts, author, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [forbid, link, parent, site, group] }
        from: { type: [string, "null"], description: "Upstream node: the new parent, or one end of the link." }
        to: { type: string, description: "The node corrected (`t<id>`, `g<host>:<name>`, `n<host>:<node>`)." }
        source: { type: [string, "null"], description: Type of the link forbidden or drawn. }
        value: { type: [string, "null"], description: "Site (empty: the main site) or grouping." }
        use_for_alerts: { type: boolean, description: "`parent` only: also the device's declared parent." }
        author: { type: string }
        created_at: { type: string, description: UTC, without suffix. }
    TopologyCorrectionInput:
      type: object
      required: [kind, to]
      properties:
        kind: { type: string, enum: [forbid, link, parent, site, group] }
        from: { type: [string, "null"] }
        to: { type: string }
        source:
          type: [string, "null"]
          description: "`forbid`: any deduced type; `link`: manual, hypervisor, hosted, relay, lldp, l2, samehost, backup or firewall."
        value: { type: [string, "null"], maxLength: 80 }
        use_for_alerts: { type: boolean, default: true }
    TopologyRuleSpec:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [forbid, parent] }
        subnet: { type: [string, "null"], description: "Scope: an IPv4 subnet (CIDR)." }
        address: { type: [string, "null"], description: "Scope: the address (host) of the devices." }
        target_kind: { type: [string, "null"], description: Scope limited to one device type. }
        source: { type: [string, "null"], description: "`forbid`: the type of link never deduced in the scope." }
        parent: { type: [string, "null"], description: "`parent`: the node the scope depends on." }
    TopologyRuleInput:
      allOf:
        - { $ref: "#/components/schemas/TopologyRuleSpec" }
        - type: object
          required: [status]
          properties:
            status: { type: string, enum: [active, dismissed] }
            evidence: { type: integer, description: Corrections it comes from. }
    TopologyRule:
      allOf:
        - { $ref: "#/components/schemas/TopologyRuleSpec" }
        - type: object
          required: [id, status, evidence, author, created_at, matches]
          properties:
            id: { type: integer, format: int64 }
            status: { type: string, enum: [active, dismissed] }
            evidence: { type: integer }
            author: { type: string }
            created_at: { type: string }
            matches: { type: integer, description: Links it sets or removes on today's map. }
    TopologySuggestion:
      allOf:
        - { $ref: "#/components/schemas/TopologyRuleSpec" }
        - type: object
          required: [key, evidence, corrections, matches]
          properties:
            key: { type: string }
            evidence: { type: integer, description: Number of corrections it comes from. }
            corrections:
              type: array
              items: { type: integer, format: int64 }
            matches: { type: integer, description: Other links it would change on today's map. }
    TopologyNode:
      type: object
      required: [id, name, kind, group_name, ips]
      properties:
        id: { type: string, description: "`t<id>` for a device, `g<host>:<name>` for an unmonitored guest." }
        target_id: { type: [integer, "null"], format: int64, description: The device; null for a guest. }
        name: { type: string }
        kind: { type: string, description: "The device type; `vm` or `container` for a guest, `pve_node` for a node of a Proxmox cluster." }
        subnet: { type: [string, "null"], description: "Subnet of the device (CIDR), none for a guest, a node, a public address or a host name." }
        vlan: { type: [integer, "null"], description: "VLAN of that subnet, when a firewall reports it." }
        vlan_name: { type: [string, "null"], description: "Name of that network (the firewall interface description)." }
        group_name: { type: string, description: Folder; a guest takes its hypervisor's. }
        site: { type: [string, "null"], description: "Remote site the node belongs to; null for the main site." }
        site_source:
          type: [string, "null"]
          enum: [tag, agent, relay, location, manual, null]
          description: "Where `site` comes from: the `site` tag, the site an agent declares, the relay agent that polls the device (its name), the location the device is placed at, or a correction on the map."
        group_source:
          type: [string, "null"]
          enum: [manual, null]
          description: "`manual` when `group_name` was corrected on the map."
        host_id: { type: [integer, "null"], format: int64, description: Guest only, the hypervisor device. }
        running: { type: [boolean, "null"], description: Guest only, running at the last measurement; for a `pve_node`, online. }
        ips:
          type: array
          items: { type: string }
          description: "Guest (its own node, or the device that stands for it): the IP addresses its hypervisor reports. Empty otherwise."
    TopologyEdge:
      type: object
      required: [from, to, source, origin]
      properties:
        from: { type: string, description: Upstream node (parent, relay, hypervisor, switch). }
        to: { type: string }
        source:
          type: string
          enum: [parent, service, relay, hypervisor, hosted, lldp, l2, samehost, backup, firewall, manual]
          description: "`manual`: attached by hand or by a learned rule, on the map only."
        origin:
          type: string
          enum: [deduced, manual, rule]
          description: Deduced by the server, corrected by hand, or set by a learned rule.
        correction_id: { type: [integer, "null"], format: int64, description: The correction that drew it. }
        rule_id: { type: [integer, "null"], format: int64, description: The learned rule that drew it. }
        from_port: { type: [string, "null"], description: "Switch port at the `from` end (`lldp` and `l2` links)." }
        to_port: { type: [string, "null"], description: "Switch port at the `to` end." }
        traffic:
          oneOf:
            - $ref: "#/components/schemas/TopologyEdgeTraffic"
            - type: "null"
          description: |
            Weathermap: traffic of the port this link goes through. Absent when no port of the
            link has interface counters (`if_octets_*`) in the metrics store.
    TopologyEdgeTraffic:
      type: object
      required: [measured_on, ports, bps_in, bps_out, errors_per_sec]
      description: |
        Rates over the last few minutes, read from the interface counters the SNMP IF-MIB
        profile and the agent already collect. The measured side is the first of `from`, `to`
        whose port has counters; several ports of one link (a LAG) are added up.
      properties:
        measured_on: { type: string, description: "Node (`t<id>`) whose counters were read." }
        ports: { type: array, items: { type: string }, description: "Interface names measured (`ifname`)." }
        bps_in: { type: number, description: "Bits per second received by `measured_on`." }
        bps_out: { type: number, description: "Bits per second sent by `measured_on`." }
        speed_bps: { type: [number, "null"], description: "Negotiated speed (sum of the ports), bits per second; null when a port does not report it." }
        utilization_in: { type: [number, "null"], minimum: 0, maximum: 1, description: "`bps_in / speed_bps`; null without a speed." }
        utilization_out: { type: [number, "null"], minimum: 0, maximum: 1, description: "`bps_out / speed_bps`; null without a speed." }
        errors_per_sec: { type: number, description: "Errors and discards per second, both directions." }
    PortTraffic:
      type: object
      required: [step_secs, points]
      properties:
        step_secs: { type: integer }
        points:
          type: array
          items:
            type: object
            required: [t, bps_in, bps_out]
            properties:
              t: { type: integer, description: Unix time in seconds. }
              bps_in: { type: number }
              bps_out: { type: number }
    AgentHost:
      type: object
      required: [hostname, os, agent_version, commands_supported, relay, relayed, binding, bound]
      properties:
        hostname: { type: string }
        os: { type: string }
        os_version: { type: [string, "null"] }
        arch: { type: [string, "null"] }
        agent_version: { type: string }
        commands_supported: { type: boolean }
        relay: { type: boolean }
        site: { type: [string, "null"] }
        relay_wanted: { type: boolean, description: Relay mode asked from the UI (or by the enrolment token). }
        relay_wanted_site: { type: [string, "null"] }
        relay_control: { type: boolean, description: "False: the agent is too old to follow `relay_wanted`." }
        relay_local: { type: boolean, description: "`relay: true` is set in the agent's own configuration, which wins." }
        relayed: { type: integer }
        last_seen_at: { type: [string, "null"] }
        binding: { type: string, enum: [bound, pending, unsupported] }
        bound: { type: boolean }
        bound_at: { type: [string, "null"] }
        rebind_until: { type: [string, "null"] }
        gateway_wanted: { type: [integer, "null"], description: Gateway port asked from the UI; null when closed. }
        gateway_port: { type: [integer, "null"], description: Port the relay reports its gateway listening on. }
        gateway_host: { type: [string, "null"], description: Address the agents of its site reach it at. }
        gateway_tunnels: { type: integer, description: Agents of its site connected through it right now. }
        gateway_check:
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/GatewayCheck"
        gateway_state:
          description: "The gateway as the relay really opened it: requested and bound address, or why it could not listen. Null: no gateway asked, or an older relay."
          type: [object, "null"]
          properties:
            wanted: { type: string, description: "Address asked (host:port)." }
            listen: { type: [string, "null"], description: "Address really bound; null when opening failed." }
            error: { type: [string, "null"], description: Why the port could not be opened. }
            local: { type: boolean, description: "The address comes from `gateway_listen` in the relay's agent.yaml, which wins." }
            encrypted: { type: boolean, description: The relay talks to the server on the encrypted channel (needed for tunnels). }
        gateway_problem:
          type: [string, "null"]
          description: What keeps the gateway from accepting the site's machines, when known (an offline relay is shown elsewhere).
          enum: [closed, too_old, offline, bind_failed, loopback, no_tunnel, null]
        server_link:
          description: "Server the agent uses when its configuration lists several (`server_urls`); null with a single address."
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/ServerLink"
        via_websocket: { type: boolean, description: "Its last encrypted batch came through the agent WebSocket of the web address (`/api/agent/ws`, behind Cloudflare Tunnel or a proxy) rather than straight to the agent port. Seen by the server, not declared by the agent." }
    RebindWindow:
      type: object
      required: [rebind_until, minutes]
      properties:
        rebind_until: { type: string }
        minutes: { type: integer }
    AgentModule:
      type: object
      required: [id, label, detected, enabled, automatic, target_id, last_seen_at]
      properties:
        id: { type: string, description: "`docker`, `plakar`, `backup_repos`, `databases`, `zfs`, `libvirt`, `wireguard`, `ipsec`, `speedtest`." }
        label: { type: string }
        detected: { type: boolean, description: The agent has reported this service on this machine. }
        enabled: { type: boolean, description: "Ticked: a device exists (or will) for this service." }
        automatic: { type: boolean, description: Nobody ticked or unticked it; the device follows detection. }
        target_id: { type: [integer, "null"], description: The service's device. }
        last_seen_at: { type: [string, "null"], description: Last batch with readings of this service (UTC). }
    AgentEventLevel:
      type: string
      enum: [critical, error, warning, information]
      description: "Event Viewer level. `information` also covers level 0 (LogAlways), the level of Security audit events."
    AgentEventRuleInput:
      type: object
      required: [name, channel]
      properties:
        name: { type: string, maxLength: 256 }
        channel: { type: string, maxLength: 256, description: "`System`, `Application`, `Security` or a channel such as `Microsoft-Windows-TaskScheduler/Operational`." }
        provider: { type: [string, "null"], description: "Event source (provider), such as `Microsoft-Windows-Kernel-Power`; empty for any." }
        event_ids: { type: string, description: "Comma-separated IDs and ranges, such as `4625, 7000-7099` (20 at most); empty for any." }
        levels: { type: array, items: { $ref: "#/components/schemas/AgentEventLevel" }, description: Empty for any level. }
        pattern: { type: [string, "null"], description: Text the message must contain (case-insensitive), or a regular expression when `pattern_regex`. }
        pattern_regex: { type: boolean, default: false }
        severity: { $ref: "#/components/schemas/Severity" }
        enabled: { type: boolean, default: true }
    AgentEventRule:
      type: object
      required: [id, target_id, name, channel, provider, event_ids, levels, pattern, pattern_regex, severity, enabled, matches_total, dropped_total, last_match_at]
      properties:
        id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        name: { type: string }
        channel: { type: string }
        provider: { type: [string, "null"] }
        event_ids: { type: string, description: Canonical form; empty for any. }
        levels: { type: array, items: { $ref: "#/components/schemas/AgentEventLevel" } }
        pattern: { type: [string, "null"] }
        pattern_regex: { type: boolean }
        severity: { $ref: "#/components/schemas/Severity" }
        enabled: { type: boolean }
        matches_total: { type: integer, format: int64, description: Events received for this rule. }
        dropped_total: { type: integer, format: int64, description: Events the agent skipped because of the rate limit. }
        last_match_at: { type: [string, "null"], description: Last event received (UTC). }
    AgentEventRulePreset:
      type: object
      required: [id, name, channel, provider, event_ids, levels, severity]
      properties:
        id: { type: string, description: "Stable key: `failed_logon`, `account_locked`, `unexpected_reboot`, `service_crashed`, `disk_errors`, `log_cleared`, `application_errors`." }
        name: { type: string }
        channel: { type: string }
        provider: { type: [string, "null"] }
        event_ids: { type: string }
        levels: { type: array, items: { $ref: "#/components/schemas/AgentEventLevel" } }
        severity: { $ref: "#/components/schemas/Severity" }
    AgentEventRules:
      type: object
      required: [supported, max_per_minute, rules, presets]
      properties:
        supported: { type: boolean, description: The machine runs Windows; elsewhere the rules are kept but never sent. }
        max_per_minute: { type: integer, description: Events kept per rule and per minute; the rest is counted in `dropped_total`. }
        rules: { type: array, items: { $ref: "#/components/schemas/AgentEventRule" } }
        presets: { type: array, items: { $ref: "#/components/schemas/AgentEventRulePreset" } }
    AgentEvent:
      type: object
      required: [id, rule_id, rule_name, severity, channel, provider, event_id, level, record_id, computer, message, occurred_at, received_at]
      properties:
        id: { type: integer, format: int64 }
        rule_id: { type: [integer, "null"], description: Null once the rule is deleted. }
        rule_name: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        channel: { type: string }
        provider: { type: string }
        event_id: { type: integer }
        level: { oneOf: [{ $ref: "#/components/schemas/AgentEventLevel" }, { type: "null" }] }
        record_id: { type: integer, format: int64 }
        computer: { type: string }
        message: { type: string, description: Formatted message, 2000 characters at most. }
        occurred_at: { type: [string, "null"], description: When Windows logged the event (UTC). }
        received_at: { type: [string, "null"], description: When the server received it (UTC). }
    ContainerPolicy:
      type: object
      required: [auto_restart, auto_update, prune_old_image, only_in_maintenance]
      properties:
        auto_restart: { type: boolean }
        auto_update: { type: boolean }
        prune_old_image: { type: boolean }
        only_in_maintenance: { type: boolean }
    ContainerPolicyPatch:
      type: object
      properties:
        auto_restart: { type: boolean }
        auto_update: { type: boolean }
        prune_old_image: { type: boolean }
        only_in_maintenance: { type: boolean }
    ContainerPolicyBulkPatch:
      type: object
      required: [containers]
      properties:
        containers:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string }
        auto_restart: { type: boolean }
        auto_update: { type: boolean }
        prune_old_image: { type: boolean }
        only_in_maintenance: { type: boolean }
    ContainerPolicyBulkReply:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [name, ok]
            properties:
              name: { type: string }
              ok: { type: boolean }
              policy: { $ref: "#/components/schemas/ContainerPolicy" }
              error: { type: string }
    Command:
      type: object
      required: [id, target_id, kind, args, status, created_at]
      properties:
        id: { type: integer, format: int64 }
        target_id: { type: integer, format: int64 }
        kind: { type: string, enum: [container.restart, container.update] }
        args: { type: object, additionalProperties: true }
        status: { type: string, enum: [queued, running, done, failed, cancelled, expired] }
        requested_by: { type: [string, "null"], description: "An account, `token:<name>`, or `policy`." }
        created_at: { type: string }
        started_at: { type: [string, "null"] }
        finished_at: { type: [string, "null"] }
        result: { type: [string, "null"], description: Truncated to the last 4 KB. }
    Container:
      type: object
      required: [name, image, up, health, restart_count, policy]
      properties:
        name: { type: string }
        image: { type: string }
        up: { type: boolean }
        health: { type: string }
        restart_count: { type: integer }
        uptime_seconds: { type: [integer, "null"] }
        image_age_seconds: { type: [integer, "null"] }
        update_available: { type: [boolean, "null"] }
        cpu_percent: { type: [number, "null"], description: "CPU as a percentage of one core (100 = one full core). Null: no statistics, stopped, or first reading." }
        memory_bytes: { type: [integer, "null"], description: Memory in use, page cache excluded. }
        memory_limit_bytes: { type: [integer, "null"], description: Memory limit of the container; null when it has none. }
        restarts_15m: { type: [integer, "null"], description: Restarts over the last fifteen minutes; three or more is a restart loop. }
        policy: { $ref: "#/components/schemas/ContainerPolicy" }
        last_command:
          oneOf:
            - $ref: "#/components/schemas/Command"
            - type: "null"

    PushMonitor:
      type: object
      required: [target_id, token, path, last_status, last_message, received_total, created_at, verdict]
      properties:
        target_id: { type: integer, format: int64 }
        token: { type: [string, "null"], description: "The secret of the heartbeat URL; `null` unless the caller is an admin (or holds a `write` token)." }
        path: { type: [string, "null"], description: "`/api/push/<token>`, relative to the server's address; `null` like `token`." }
        last_seen_at: { type: [string, "null"] }
        last_seen_age_secs: { type: [integer, "null"] }
        last_status: { type: string, enum: [up, down] }
        last_message: { type: string }
        received_total: { type: integer }
        created_at: { type: string }
        expected_interval_secs: { type: [integer, "null"] }
        grace_secs: { type: [integer, "null"] }
        settings_error: { type: [string, "null"] }
        verdict: { type: string, enum: [waiting, on_time, missed, reported_down] }
        schedule: { type: [string, "null"], description: "Cron expression replacing the interval, when set." }
        timezone: { type: [string, "null"], description: "IANA time zone in which `schedule` is read." }
        next_expected_at: { type: [string, "null"], description: "Next scheduled run of a cron schedule. UTC, without suffix." }
        max_duration_secs: { type: [integer, "null"] }
        last_run:
          oneOf:
            - $ref: "#/components/schemas/PushRun"
            - type: "null"

    PushRun:
      type: object
      required: [id, status, output]
      properties:
        id: { type: integer, format: int64 }
        started_at: { type: [string, "null"], description: "UTC, without suffix. `null` when no `/start` preceded the end." }
        finished_at: { type: [string, "null"], description: "UTC, without suffix. `null` while the run is open." }
        duration_secs: { type: [number, "null"], description: "`null` when the duration is unknown." }
        status: { type: string, enum: [running, success, failed, lost], description: "`lost`: started, then replaced by a new start without ever finishing." }
        exit_code: { type: [integer, "null"] }
        output: { type: string, description: "Output of the job, truncated to its last 10 KiB." }

    PushRunsPage:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items: { $ref: "#/components/schemas/PushRun" }
        next_before: { type: [integer, "null"], format: int64, description: "Pass as `before` for the next page; `null` on the last one." }

    WebsiteOverview:
      type: object
      required: [checked_at, error, probe, platform_label, fields, changes_checked_at, robots_checked_at, robots_blocks_all, sitemap_ok]
      properties:
        checked_at: { type: [string, "null"], description: "Last reading, successful or not. UTC, without suffix." }
        error: { type: [string, "null"], description: "Why the last reading failed (unreachable, certificate refused, redirect loop…); `probe` then stays the last successful one." }
        probe:
          oneOf:
            - { $ref: "#/components/schemas/WebsiteProbe" }
            - { type: "null" }
        platform_label: { type: [string, "null"], description: "Display name of `probe.platform`, e.g. Next.js." }
        fields:
          type: array
          items: { $ref: "#/components/schemas/WebsiteField" }
        changes_checked_at: { type: [string, "null"], description: "Last comparison of the metadata with the reference. It only happens every change_check_minutes (6 hours by default); a pending value is checked again at the next probe. UTC, without suffix." }
        robots_checked_at: { type: [string, "null"], description: "robots.txt and the sitemap are read at change checks, at most once an hour. UTC, without suffix." }
        robots_blocks_all: { type: [boolean, "null"], description: "robots.txt forbids Googlebot (or *) to crawl /." }
        sitemap_ok: { type: [boolean, "null"], description: "The sitemap announced by robots.txt, or /sitemap.xml, answers 200 and reads as a sitemap." }

    WebsiteProbe:
      type: object
      required: [requested_url, final_url, status, response_ms, redirects, platform, category, content_type, text_chars, blank, expect_text_found, metadata]
      properties:
        requested_url: { type: string }
        final_url: { type: string, description: "Where the redirects lead." }
        status: { type: integer, description: "HTTP status of the final answer." }
        response_ms: { type: integer, description: "Total time, redirects included." }
        redirects:
          type: array
          description: "Redirects followed, in order; the last one leads to `final_url`. Empty without redirect."
          items:
            type: object
            required: [url, status]
            properties:
              url: { type: string }
              status: { type: integer }
        platform: { $ref: "#/components/schemas/WebsitePlatform" }
        category: { type: [string, "null"], description: "The `category` option, else a guess (`ecommerce`, `blog`, `app`, `showcase`); null when unclear." }
        content_type: { type: string }
        text_chars: { type: [integer, "null"], description: "Characters of visible text; null unless the final answer is 2xx." }
        blank: { type: [boolean, "null"], description: "Visible text below `min_text_chars`." }
        expect_text_found: { type: [boolean, "null"], description: "Null without the `expect_text` option." }
        metadata:
          oneOf:
            - { $ref: "#/components/schemas/WebsiteMetadata" }
            - { type: "null" }

    WebsiteMetadata:
      type: object
      required: [title, description, canonical, robots, og_title, og_description, lang, h1_count, hreflang_count, hreflang, google_verification, og_type, noindex, nofollow]
      properties:
        title: { type: [string, "null"] }
        description: { type: [string, "null"] }
        canonical: { type: [string, "null"], description: "Resolved against the final address." }
        robots: { type: [string, "null"], description: "Robots meta tags and X-Robots-Tag headers, joined." }
        og_title: { type: [string, "null"] }
        og_description: { type: [string, "null"] }
        lang: { type: [string, "null"], description: "`<html lang>`." }
        h1_count: { type: integer }
        hreflang_count: { type: integer }
        hreflang: { type: array, items: { type: string }, description: Languages of the hreflang alternates, sorted. }
        google_verification: { type: array, items: { type: string }, description: "`google-site-verification` tokens, sorted." }
        og_type: { type: [string, "null"] }
        noindex: { type: boolean }
        nofollow: { type: boolean }

    WebsitePlatform:
      type: string
      description: "Platform guessed from the generator meta tag, headers and markup; also the `platform` label of `dumbmonit_website_info`."
      enum: [wordpress, shopify, wix, squarespace, webflow, ghost, drupal, joomla, prestashop, magento, nextjs, nuxt, gatsby, hugo, jekyll, other]

    WebsiteField:
      type: object
      required: [field, value, pending, changed_at, recently_changed]
      properties:
        field: { type: string, enum: [final_url, title, description, canonical, robots, og_title, og_description, lang, h1_count, hreflang_count, hreflang, google_verification] }
        value: { type: [string, "null"], description: "Confirmed value; empty string when the page has none." }
        pending: { type: [string, "null"], description: "A different value seen once, confirmed if the next check sees it again." }
        changed_at: { type: [string, "null"], description: "Last confirmed change. UTC, without suffix." }
        recently_changed: { type: boolean, description: "Changed less than 24 hours ago." }

    WebsiteChange:
      type: object
      required: [id, detected_at, field, before, after]
      properties:
        id: { type: integer, format: int64 }
        detected_at: { type: string, description: "UTC, without suffix." }
        field: { type: string }
        before: { type: string }
        after: { type: string }

    WebchangePages:
      type: object
      required: [found, pages]
      properties:
        found:
          type: [integer, "null"]
          description: "Pages found (read and still queued) when **Max pages** stopped the last crawl; null when the crawl was not stopped by it, or when the last check failed."
        pages:
          type: array
          items: { $ref: "#/components/schemas/WebchangePage" }

    WebchangePage:
      type: object
      required: [url, title, status, error, last_checked, last_changed, changes, latest_snapshot]
      properties:
        url: { type: string }
        title: { type: [string, "null"] }
        status: { type: [integer, "null"], description: "HTTP status of the last read; always 404 for a removed page, 410 or no longer linked included." }
        error: { type: [string, "null"], description: "Why the last read failed, or why the page counts as removed." }
        last_checked: { type: [string, "null"], description: "UTC, without suffix." }
        last_changed: { type: [string, "null"], description: "UTC, without suffix." }
        changes: { type: integer, description: Changes kept for this page. }
        latest_snapshot: { type: [integer, "null"], format: int64 }

    WebchangeChange:
      type: object
      required: [id, url, kind, detected_at, added, removed, before, after, signature]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
        kind: { type: string, enum: [changed, new_page, removed_page] }
        detected_at: { type: string, description: "UTC, without suffix." }
        added: { type: integer, description: Lines added. }
        removed: { type: integer, description: Lines removed. }
        before: { type: [integer, "null"], format: int64, description: Snapshot before the change. }
        after: { type: [integer, "null"], format: int64, description: Snapshot after the change. }
        signature:
          type: [string, "null"]
          description: "Same value for the same edit (the same lines removed and added) made on several pages, so that it can be shown once; null for a new or removed page."

    WebchangeSnapshot:
      type: object
      required: [id, fetched_at, title]
      properties:
        id: { type: integer, format: int64 }
        fetched_at: { type: string, description: "UTC, without suffix." }
        title: { type: [string, "null"] }

    WebchangeDiffLine:
      type: object
      required: [op, text, count]
      properties:
        op: { type: string, enum: [equal, insert, delete, skip] }
        text: { type: string, description: "Empty for `skip`." }
        count: { type: [integer, "null"], description: "Unchanged lines hidden by a `skip` line." }

    NetconfigVersion:
      type: object
      required: [id, fetched_at, last_seen_at, profile, size_bytes, lines, added, removed]
      properties:
        id: { type: integer, format: int64 }
        fetched_at: { type: string, description: "UTC, `YYYY-MM-DD HH:MM:SS`." }
        last_seen_at: { type: string, description: Last backup that found this same configuration. }
        profile: { type: string }
        size_bytes: { type: integer }
        lines: { type: integer }
        added: { type: integer, description: Lines added since the previous version, volatile lines aside. }
        removed: { type: integer }
    NetconfigOverview:
      type: object
      required: [running, host_key, can_read, can_reveal, versions]
      properties:
        profile: { type: [string, "null"] }
        profile_label: { type: [string, "null"] }
        transport: { type: [string, "null"], enum: [ssh_shell, ssh_exec, http, null] }
        running: { type: boolean }
        last_attempt_at: { type: [string, "null"] }
        last_success_at: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
        last_error_kind: { type: [string, "null"], enum: [down, auth, config, host_key, null] }
        host_key:
          type: object
          properties:
            pinned: { type: [string, "null"], description: "Remembered SHA-256 fingerprint (`SHA256:…`)." }
            pinned_at: { type: [string, "null"] }
            changed_to: { type: [string, "null"], description: A different key the device presented and that was refused. }
            changed_at: { type: [string, "null"] }
        can_read: { type: boolean, description: The caller may read version contents, secrets masked. }
        can_reveal: { type: boolean, description: The caller may reveal secrets and download. }
        versions:
          type: array
          items: { $ref: "#/components/schemas/NetconfigVersion" }
    NetconfigVersionContent:
      type: object
      required: [version, masked, masked_values, content]
      properties:
        version: { $ref: "#/components/schemas/NetconfigVersion" }
        masked: { type: boolean }
        masked_values: { type: integer }
        content: { type: string }
    NetconfigCompare:
      type: object
      required: [to, masked, added, removed, diff]
      properties:
        from:
          oneOf:
            - $ref: "#/components/schemas/NetconfigVersion"
            - type: "null"
        to: { $ref: "#/components/schemas/NetconfigVersion" }
        masked: { type: boolean }
        added: { type: integer }
        removed: { type: integer }
        diff:
          type: array
          items: { $ref: "#/components/schemas/WebchangeDiffLine" }

    WebchangeChangeDetail:
      allOf:
        - $ref: "#/components/schemas/WebchangeChange"
        - type: object
          required: [before_snapshot, after_snapshot, diff]
          properties:
            before_snapshot:
              oneOf:
                - $ref: "#/components/schemas/WebchangeSnapshot"
                - type: "null"
            after_snapshot:
              oneOf:
                - $ref: "#/components/schemas/WebchangeSnapshot"
                - type: "null"
            diff:
              type: array
              items: { $ref: "#/components/schemas/WebchangeDiffLine" }

    Pack:
      type: object
      required: [id, version, label, summary, enabled, installed_at, sha256, metrics, rules, snmp_profiles, targets, warnings]
      properties:
        id: { type: string }
        version: { type: string }
        label: { type: string }
        summary: { type: string }
        kind: { type: [string, "null"], description: "`pack.<id>`; `null` for a pack with SNMP profiles only." }
        enabled: { type: boolean }
        installed_at: { type: string }
        sha256: { type: string }
        metrics:
          type: array
          items: { type: string }
        rules:
          type: array
          description: Uids of the rules it ships.
          items: { type: string }
        snmp_profiles:
          type: array
          items: { type: string }
        targets: { type: integer, description: Devices using it. }
        warnings:
          type: array
          items: { type: string }
        error: { type: [string, "null"], description: Set when the stored pack no longer passes validation. }
    PackInstallReport:
      type: object
      required: [outcome, pack, rules_added, restart_required]
      properties:
        outcome: { type: string, enum: [created, updated, unchanged] }
        pack: { $ref: "#/components/schemas/Pack" }
        rules_added: { type: integer }
        restart_required: { type: boolean, description: SNMP profiles take effect after a restart. }

    # ------------------------------------------------------------- sauvegarde
    LogsOverview:
      type: object
      required: [directory, retention_days, max_total_mb, total_bytes, days_available, files, writer]
      properties:
        directory: { type: string, examples: ["/data/logs"] }
        retention_days: { type: integer, minimum: 1, maximum: 365 }
        max_total_mb: { type: integer, minimum: 16, maximum: 102400 }
        total_bytes: { type: integer }
        oldest_day: { type: [string, "null"], format: date }
        days_available: { type: integer }
        files:
          type: array
          description: Newest first.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              bytes: { type: integer }
              compressed: { type: boolean }
        writer:
          type: object
          properties:
            active: { type: boolean }
            dropped:
              type: integer
              description: Records lost before reaching the disk (writer lagging, or the size cap reached).
    StorageUpdate:
      type: object
      additionalProperties: false
      properties:
        metrics_retention_days: { type: integer, minimum: 7, maximum: 3650 }
        rollup_enabled: { type: boolean }
        rollup_retention_days: { type: integer, minimum: 30, maximum: 3650 }
        logs_store_enabled: { type: boolean }
        logs_store_retention_days: { type: integer, minimum: 1, maximum: 3650 }
    StorageView:
      type: object
      required: [metrics, rollup, logs_store, disk, growth, limits, restarted]
      properties:
        metrics:
          type: object
          required: [embedded, retention_days, retention_source, running]
          properties:
            embedded: { type: boolean }
            retention_days: { type: integer }
            retention_source: { type: string, enum: [settings, environment, default] }
            running: { type: boolean }
        rollup:
          type: object
          required: [available, embedded, enabled, running, retention_days, step_seconds, backfill_done]
          properties:
            available: { type: boolean }
            embedded: { type: boolean }
            enabled: { type: boolean }
            running: { type: boolean }
            retention_days: { type: integer }
            step_seconds: { type: integer }
            last_window: { type: [string, "null"], description: UTC, without suffix }
            backfilled_until: { type: [string, "null"], description: UTC, without suffix }
            backfill_done: { type: boolean }
            series: { type: [integer, "null"] }
            last_error: { type: [string, "null"] }
        logs_store:
          type: object
          required: [available, enabled, running, retention_days]
          properties:
            available: { type: boolean }
            enabled: { type: boolean }
            running: { type: boolean }
            retention_days: { type: integer }
            last_error: { type: [string, "null"] }
        disk:
          type: object
          required: [usage]
          properties:
            usage:
              type: array
              items:
                type: object
                required: [key, path]
                properties:
                  key: { type: string, enum: [metrics, rollup, logs_store, database, logs, backups] }
                  path: { type: string }
                  bytes: { type: [integer, "null"] }
            free_bytes: { type: [integer, "null"] }
            total_bytes: { type: [integer, "null"] }
        growth:
          type: object
          required: [sampled_days]
          properties:
            bytes_per_day: { type: [number, "null"] }
            days_until_full: { type: [number, "null"] }
            sampled_days: { type: integer }
        limits:
          type: object
          properties:
            min_retention_days: { type: integer }
            max_retention_days: { type: integer }
            min_rollup_retention_days: { type: integer }
            max_rollup_retention_days: { type: integer }
            min_logs_retention_days: { type: integer }
            max_logs_retention_days: { type: integer }
        restarted:
          type: array
          items: { type: string, enum: [metrics, rollup, logs_store] }
    LogSearchResult:
      type: object
      required: [entries, truncated]
      properties:
        truncated: { type: boolean }
        entries:
          type: array
          items:
            type: object
            required: [time, level, message, source, fields]
            properties:
              time: { type: string, description: UTC, without suffix }
              level: { type: string }
              message: { type: string }
              source: { type: string, enum: [dumbmonit, agent, syslog, trap], description: Stream the line belongs to. }
              host: { type: [string, "null"] }
              origin: { type: [string, "null"], description: "Unit, file, channel or sender address." }
              target_name: { type: [string, "null"], description: Device the sender is attached to. }
              fields: { type: object, additionalProperties: { type: string } }
    SentinelChannel:
      oneOf:
        - type: object
          required: [kind, url]
          properties:
            kind: { type: string, enum: [webhook] }
            url: { type: string, description: "Plain `https://` address; receives a JSON POST." }
        - type: object
          required: [kind, server, topic]
          properties:
            kind: { type: string, enum: [ntfy] }
            server: { type: string, description: "Plain `https://` address of the ntfy server." }
            topic: { type: string, description: "1 to 64 letters, digits, dashes or underscores." }
    AgentSentinelInput:
      type: object
      required: [enabled, interval_secs, threshold]
      properties:
        enabled: { type: boolean }
        urls:
          type: array
          maxItems: 5
          items: { type: string, description: "Plain `https://` address; any HTTP answer below 500 counts as alive." }
        interval_secs: { type: integer, minimum: 15, maximum: 3600 }
        threshold: { type: integer, minimum: 1, maximum: 20, description: Consecutive failures of an address before the alert. }
        channel: { $ref: "#/components/schemas/SentinelChannel" }
        clear_channel: { type: boolean, default: false }
    AgentSentinel:
      type: object
      required: [enabled, urls, interval_secs, threshold, has_secret, channel_kind]
      properties:
        enabled: { type: boolean }
        urls: { type: array, items: { type: string } }
        interval_secs: { type: integer }
        threshold: { type: integer }
        has_secret: { type: boolean, description: A notification channel is stored. }
        channel_kind: { type: [string, "null"], enum: [webhook, ntfy, null] }
    AgentLogsSetting:
      type: object
      properties:
        enabled: { type: boolean, default: false }
        min_level: { type: string, enum: [error, warn, info, debug], default: warn }
        journald: { type: boolean, default: true, description: Read the systemd journal (Linux). }
        files:
          type: array
          maxItems: 20
          items: { type: string, description: "Absolute path; `*` and `?` work in each component." }
        eventlog:
          type: array
          maxItems: 10
          items: { type: string, description: Windows event log channel. }
    AgentLogs:
      allOf:
        - $ref: "#/components/schemas/AgentLogsSetting"
        - type: object
          required: [last_received_at, received_total, store_running]
          properties:
            last_received_at: { type: [string, "null"], description: UTC, without suffix }
            received_total: { type: integer }
            store_running: { type: boolean, description: False when the embedded log store is off, lines would be dropped. }
    LogInput:
      type: object
      required: [enabled, listening, received, rejected, unmatched, last_at, error]
      properties:
        enabled: { type: boolean }
        listening: { type: array, items: { type: string, description: "`udp/5514`, `tcp/5514`" } }
        received: { type: integer }
        rejected: { type: integer }
        unmatched: { type: integer, description: Messages from a sender no device carries. }
        last_at: { type: [string, "null"] }
        error: { type: [string, "null"] }
    LogInputs:
      type: object
      required: [store_running, syslog, traps, written, dropped]
      properties:
        store_running: { type: boolean }
        syslog: { $ref: "#/components/schemas/LogInput" }
        traps: { $ref: "#/components/schemas/LogInput" }
        written: { type: integer, description: Central log entries written to the store since the server started. }
        dropped: { type: integer }
    LogsSettingsRequest:
      type: object
      properties:
        retention_days: { type: integer, minimum: 1, maximum: 365 }
        max_total_mb: { type: integer, minimum: 16, maximum: 102400 }
    LogsEstimate:
      type: object
      required: [days, from, to, files, bytes]
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        files: { type: integer }
        bytes: { type: integer, description: Estimated size of the .tar.gz archive. }
    LogDestinationKind:
      type: object
      required: [kind, label, summary, doc_url, settings, secrets]
      properties:
        kind: { type: string, examples: [gelf, victorialogs, loki, elasticsearch, syslog] }
        label: { type: string }
        summary: { type: string }
        doc_url: { type: string, format: uri }
        settings:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
        secrets:
          type: array
          items: { $ref: "#/components/schemas/ChannelField" }
    LogDestinationRequest:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, maxLength: 100 }
        kind: { type: string }
        enabled: { type: boolean, default: true }
        min_level: { type: string, enum: [error, warn, info, debug], default: info }
        settings: { type: object, additionalProperties: true }
        secrets:
          type: [object, "null"]
          additionalProperties: { type: string }
          description: Omitted or null keeps the stored secrets; `{}` clears them.
    LogDestination:
      type: object
      required: [id, name, kind, enabled, min_level, settings, has_secret, stats]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { type: string }
        enabled: { type: boolean }
        min_level: { type: string, enum: [error, warn, info, debug] }
        settings: { type: object, additionalProperties: true }
        has_secret: { type: boolean }
        stats:
          type: object
          description: Counters since the server started.
          properties:
            sent: { type: integer }
            dropped: { type: integer, description: Records lost (queue full or batch refused). }
            failed_batches: { type: integer }
            queued: { type: integer }
            last_error: { type: [string, "null"] }
            last_error_at: { type: [string, "null"], description: UTC, without suffix. }
            last_success_at: { type: [string, "null"], description: UTC, without suffix. }
    BackupStatus:
      type: object
      required: [bundle_version, min_passphrase_length, contents, secret_source, secret_path, schedule]
      properties:
        bundle_version: { type: integer }
        min_passphrase_length: { type: integer }
        contents:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              description: { type: string }
              count: { type: integer }
        secret_source: { type: string, enum: [file, environment] }
        secret_path: { type: string }
        schedule: { $ref: "#/components/schemas/LocalBackupStatus" }
    LocalBackupStatus:
      type: object
      properties:
        enabled: { type: boolean }
        directory: { type: string }
        interval_hours: { type: integer }
        keep: { type: integer }
        includes_secret_key: { type: boolean }
        last_run:
          type: [object, "null"]
          properties:
            at: { type: string }
            ok: { type: boolean }
            file: { type: string }
            bytes: { type: integer }
            duration_ms: { type: integer }
            with_secret: { type: boolean }
            error: { type: [string, "null"] }
        files:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              bytes: { type: integer }
              at: { type: string }
              with_secret: { type: boolean }
        total_bytes: { type: integer }
        directory_error: { type: [string, "null"] }
        env_managed:
          type: object
          description: Settings an environment variable fixes; the interface cannot change them.
          properties:
            enabled: { type: boolean }
            interval_hours: { type: boolean }
            keep: { type: boolean }
    BackupDestinationRequest:
      type: object
      required: [name, kind, settings]
      properties:
        name: { type: string, maxLength: 64 }
        kind: { type: string, enum: [s3, webdav, sftp] }
        enabled: { type: boolean, default: true }
        keep: { type: integer, minimum: 1, maximum: 365, default: 7 }
        include_key:
          type: boolean
          default: false
          description: Upload `secret.key` with the database. Whoever reads the destination can then decrypt every stored credential.
        settings:
          type: object
          description: >-
            s3: `endpoint` (empty = AWS), `region`, `bucket`, `prefix`, `access_key_id`,
            `path_style`. webdav: `url` (an existing folder), `username`. sftp: `host`, `port`,
            `username`, `directory`, `host_key` (`SHA256:…`). Unknown fields are refused.
          additionalProperties: true
        secrets:
          type: [object, "null"]
          description: >-
            s3: `secret_access_key`. webdav: `password`. sftp: `password` and/or `private_key`
            (Ed25519 or ECDSA, OpenSSH format) with `key_passphrase`.
          additionalProperties: { type: string }
    BackupDestinationResult:
      type: object
      properties:
        at: { type: string, description: UTC, no suffix. }
        ok: { type: boolean }
        file: { type: string }
        bytes: { type: integer }
        duration_ms: { type: integer }
        error:
          type: [string, "null"]
          description: The failure, or on a success a remark (old copies not pruned).
    BackupDestination:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, enum: [s3, webdav, sftp] }
        enabled: { type: boolean }
        keep: { type: integer }
        include_key: { type: boolean }
        settings: { type: object, additionalProperties: true }
        has_secret: { type: boolean }
        saved_secrets:
          type: array
          items: { type: string }
          description: Names of the stored secret fields, never their values.
        last:
          oneOf:
            - { $ref: "#/components/schemas/BackupDestinationResult" }
            - { type: "null" }
        last_success_at: { type: [string, "null"] }
    BackupDestinationList:
      type: object
      properties:
        destinations:
          type: array
          items: { $ref: "#/components/schemas/BackupDestination" }
        uploading: { type: boolean }
    BackupDestinationTest:
      type: object
      properties:
        ok: { type: boolean }
        message: { type: string }
        duration_ms: { type: integer }
        host_key:
          type: [string, "null"]
          description: SFTP fingerprint presented by the server when it is not the confirmed one.
        host_key_changed:
          type: boolean
          description: True when another fingerprint was confirmed (reinstalled server, or impostor).
    ConfigRequest:
      type: object
      description: Either `yaml` or `config`.
      properties:
        yaml: { type: string, description: The file, as text. }
        config: { type: object, additionalProperties: true, description: The same document as JSON. }
        prune: { type: boolean, default: false, description: Delete managed objects that are no longer declared. }
    ConfigChange:
      type: object
      required: [section, key, action, fields]
      properties:
        section: { type: string, enum: [targets, channels, rules, rule_overrides, silences, status_pages] }
        key: { type: string }
        action: { type: string, enum: [create, update, delete] }
        fields:
          type: array
          items: { type: string }
          description: Names of the fields that differ (never their values).
    ConfigPlan:
      type: object
      required: [changes, create, update, delete, unchanged, warnings, applied, unresolved]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/ConfigChange" }
        create: { type: integer }
        update: { type: integer }
        delete: { type: integer }
        unchanged: { type: integer }
        warnings:
          type: array
          items: { type: string }
        applied: { type: boolean }
        unresolved:
          type: array
          items: { type: string }
    ConfigExport:
      type: object
      required: [version, yaml, config, variables]
      properties:
        version: { type: integer }
        yaml: { type: string }
        config: { type: object, additionalProperties: true }
        variables:
          type: array
          items: { type: string }
    ConfigStatus:
      type: object
      required: [schema_version, watch, managed, keys]
      properties:
        schema_version: { type: integer }
        watch:
          type: object
          properties:
            directory: { type: [string, "null"] }
            files:
              type: array
              items: { type: string }
            last_applied_at: { type: [string, "null"] }
            last_error: { type: [string, "null"] }
            last_changes:
              type: [array, "null"]
              items: { type: integer }
              description: "[created, updated, deleted] of the last application."
        managed:
          type: object
          additionalProperties: { type: integer }
        keys:
          type: object
          description: Keys of the managed objects by kind (rule, channel, silence, status_page, override).
          additionalProperties:
            type: array
            items: { type: string }
    BackupExportRequest:
      type: object
      required: [passphrase]
      properties:
        passphrase: { type: string, minLength: 16, writeOnly: true }
        include_account_secrets: { type: boolean, default: false }
        include_netconfig_versions:
          type: boolean
          default: false
          description: Also carry the stored network configuration versions, which hold device secrets.
    BackupRestoreRequest:
      type: object
      required: [bundle, passphrase]
      properties:
        bundle: { type: object, additionalProperties: true }
        passphrase: { type: string, writeOnly: true }
        apply: { type: boolean, default: false, description: "`false`: dry run inside a transaction rolled back." }
    RestoreReport:
      type: object
      properties:
        applied: { type: boolean }
        created_at: { type: string }
        source_version: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              section: { type: string }
              created: { type: integer }
              updated: { type: integer }
              skipped: { type: integer }
              notes:
                type: array
                items: { type: string }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        warnings:
          type: array
          items: { type: string }

    # ------------------------------------------ panneaux (premier niveau seulement)
    PanelObject:
      type: object
      description: >-
        A panel read from the device's last probe. Only the top-level properties
        are described here; see the HTTP API reference for the full shape.
      additionalProperties: true
    ProxmoxGuest:
      type: object
      additionalProperties: true
      properties:
        vmid: { type: integer }
        name: { type: string }
        node: { type: string }
        kind: { type: string, enum: [qemu, lxc] }
        status: { type: string }
        cpu_percent: { type: [number, "null"] }
        cpu_count: { type: [number, "null"] }
        memory_used_bytes: { type: [number, "null"] }
        memory_total_bytes: { type: [number, "null"] }
        memory_percent: { type: [number, "null"] }
        disk_used_bytes: { type: [number, "null"] }
        disk_total_bytes: { type: [number, "null"] }
        disk_percent: { type: [number, "null"] }
        uptime_seconds: { type: [number, "null"] }
        last_backup_age_seconds: { type: [number, "null"] }
        os: { type: [string, "null"] }
        ip: { type: [string, "null"] }
    ProxmoxNodes:
      type: object
      additionalProperties: true
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        fencing_state: { type: [string, "null"] }
        fencing_armed: { type: [boolean, "null"] }
    ProxmoxCeph:
      type: object
      additionalProperties: true
      properties:
        available: { type: boolean }
        health: { type: [number, "null"], description: "0 OK, 1 WARN, 2 ERR, 3 unknown." }
        health_status: { type: [string, "null"] }
        used_percent: { type: [number, "null"] }
        osds:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        pools:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
        filesystems:
          type: array
          items: { type: string }
    PbsCalendar:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        days: { type: integer }
        offset_minutes: { type: integer }
        groups:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    PbsJobs:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    PbsHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        datastores: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        disks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        zpools: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        certificates: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    PbsTaskLog:
      type: object
      additionalProperties: true
      properties:
        upid: { type: string }
        lines:
          type: array
          items: { type: string }
    PbsTaskFailure:
      type: object
      additionalProperties: true
      properties:
        upid: { type: string }
        worker_type: { type: string }
        kind: { type: string }
        worker_id: { type: string }
        datastore: { type: [string, "null"] }
        object: { type: [string, "null"] }
        user: { type: [string, "null"] }
        start: { type: [integer, "null"] }
        end: { type: [integer, "null"] }
        error: { type: [string, "null"] }
    PdmTaskFailure:
      type: object
      additionalProperties: true
      properties:
        upid: { type: string }
        remote: { type: string }
        node: { type: [string, "null"] }
        user: { type: [string, "null"] }
        worker_type: { type: string }
        kind: { type: string }
        worker_id: { type: string }
        start: { type: [integer, "null"] }
        end: { type: [integer, "null"] }
        error: { type: [string, "null"] }
    PdmRemotes:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        estate: { $ref: "#/components/schemas/PanelObject" }
        remotes:
          type: array
          items: { $ref: "#/components/schemas/PanelObject" }
    SkippedFeatures:
      type: object
      required: [features]
      properties:
        features:
          type: array
          items:
            type: object
            required: [feature, privilege]
            properties:
              feature:
                type: string
                description: Technical id (`guest_agent`, `updates`, `certificates`, `disks`, `services`, `traffic_control`, `remote_updates`).
              privilege:
                type: string
                description: The privilege the token lacks, as the device names it.
    PdmHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        memory_used_percent: { type: [number, "null"] }
        rootfs_used_percent: { type: [number, "null"] }
        certificates: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    PmgQueues:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        queues: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        total_messages: { type: number }
        stuck: { type: boolean }
    PmgTraffic:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        recent: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        spam_scores: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        viruses: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    PmgHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        nodes: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        cluster: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        stopped_services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    OpnsenseGateways:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        gateways: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        down: { type: integer }
        degraded: { type: integer }
        wan_addresses: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    OpnsenseTraffic:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        interfaces: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        dhcp: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    OpnsenseHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        hostname: { type: [string, "null"] }
        services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        stopped_services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        tunnels: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        tunnels_down: { type: integer }
    TruenasStorage:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        pools: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        unhealthy_pools: { type: integer }
        datasets: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        snapshots_total: { type: [number, "null"] }
        disks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    TruenasProtection:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        scrubs: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        tasks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        failed_tasks: { type: integer }
    TruenasHealth:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        version: { type: [string, "null"] }
        hostname: { type: [string, "null"] }
        alerts: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        stopped_services: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    ActiveDirectoryFinding:
      type: object
      required: [id, severity, category, title, detail, count, samples]
      properties:
        id: { type: string, description: "Stable identifier, e.g. asrep_roastable_users, krbtgt_password_age." }
        severity: { type: string, enum: [low, medium, high, critical] }
        category:
          type: string
          enum: [privileged, kerberos, accounts, policy, hygiene, infrastructure]
        title: { type: string }
        detail: { type: string }
        count: { type: integer, minimum: 0, description: "Objects concerned; 0 means the check was examined and found nothing." }
        samples: { type: array, items: { type: string }, maxItems: 20 }
    ActiveDirectoryFindingCounts:
      type: object
      properties:
        low: { type: integer }
        medium: { type: integer }
        high: { type: integer }
        critical: { type: integer }
    ActiveDirectoryFindings:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        inventory_at: { type: [integer, "null"] }
        findings: { type: array, items: { $ref: "#/components/schemas/ActiveDirectoryFinding" } }
        counts: { $ref: "#/components/schemas/ActiveDirectoryFindingCounts" }
    ActiveDirectoryOverview:
      type: object
      additionalProperties: true
      properties:
        probed_at: { type: [integer, "null"] }
        connection: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        bind_error: { type: [string, "null"] }
        domain: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        policy: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        dcs: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        fsmo: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        replication: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        privileged_groups: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        inventory: { oneOf: [{ $ref: "#/components/schemas/PanelObject" }, { type: "null" }] }
        findings: { type: array, items: { $ref: "#/components/schemas/ActiveDirectoryFinding" } }
        finding_counts: { $ref: "#/components/schemas/ActiveDirectoryFindingCounts" }
        errors: { type: array, items: { type: string } }
    RedfishOverview:
      type: object
      additionalProperties: true
      properties:
        service: { $ref: "#/components/schemas/PanelObject" }
        systems: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        temperatures: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        fans: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        power_supplies: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        drives: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        logs: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        scrape_errors: { type: [number, "null"] }
    ServiceOverview:
      type: object
      additionalProperties: true
      properties:
        kind: { type: string }
        version: { type: [string, "null"] }
        sampled_at: { type: [number, "null"] }
        state: { type: string }
        checks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        figures: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        breakdowns: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    Deadline:
      type: object
      required: [target, target_name, target_kind, kind, what, expires_at, days_left]
      properties:
        target: { type: integer }
        target_name: { type: string }
        target_kind: { type: string }
        kind:
          type: string
          description: >
            `domain`, `certificate`, `credential`, `product`, `key` or `license`;
            with `upcoming=true` also `disk` (full on that date) and `backup`
            (late on that date).
        what: { type: string, description: The object that expires (host, application, device…). }
        expires_at: { type: string, description: UTC, no suffix. }
        days_left: { type: number, description: Negative once expired. }
        value:
          type: number
          description: >
            Context of a `disk` (used, in percent) or a `backup` (age of the last
            success, in days). Absent from the other kinds.
    BlacklistOverview:
      type: object
      additionalProperties: true
      properties:
        kind: { type: string }
        sampled_at: { type: [number, "null"] }
        scan_running: { type: boolean }
        scan_age_seconds: { type: [number, "null"] }
        scan_duration_seconds: { type: [number, "null"] }
        addresses_checked: { type: [number, "null"] }
        addresses_listed: { type: [number, "null"] }
        listed_lists: { type: [number, "null"] }
        listed_major_lists: { type: [number, "null"] }
        unknown_checks: { type: [number, "null"] }
        domain_listed: { type: [boolean, "null"] }
        lists: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        checks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        addresses: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        auth: { type: [object, "null"], additionalProperties: true }
        providers: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
    CapacityForecast:
      type: object
      required: [family, family_label, metric, entity, labels, used_percent, used, size, unit, growth_per_day, days_to_full, full_at, confidence, status, severity, window_days]
      properties:
        family: { type: string, examples: [filesystem, pbs_datastore, truenas_pool] }
        family_label: { type: string }
        metric: { type: string, description: Metric of the percentage, or the family for an expression. }
        entity: { type: string, description: "Readable entity (`/srv`, `tank`…); empty for the whole device." }
        labels:
          type: object
          additionalProperties: { type: string }
        used_percent: { type: [number, "null"] }
        used: { type: [number, "null"], description: Raw used amount in `unit`, when the integration publishes it. }
        size: { type: [number, "null"], description: Raw total in `unit`. }
        unit: { type: string, examples: [bytes, seats, ""] }
        growth_per_day: { type: [number, "null"], description: Percentage points per day. }
        days_to_full: { type: [number, "null"], description: "`null` without growth or without enough history; 0 when full." }
        full_at: { type: [string, "null"], description: Estimated fill date, UTC without suffix. }
        confidence: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [growing, stable, full, insufficient_data] }
        severity:
          description: Severity the forecast rule would raise today; `null` when it would not fire.
          oneOf:
            - $ref: "#/components/schemas/Severity"
            - type: "null"
        window_days: { type: integer }
    SynologyOverview:
      type: object
      additionalProperties: true
      properties:
        system: { $ref: "#/components/schemas/PanelObject" }
        volumes: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        pools: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        ssd_caches: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        disks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        sampled_at: { type: [number, "null"] }
    SynologyActiveBackup:
      type: object
      additionalProperties: true
      properties:
        tasks: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        devices: { type: array, items: { $ref: "#/components/schemas/PanelObject" } }
        utc_offset_s: { type: integer }
    TargetLuns:
      type: object
      required: [luns, volumes, sampled_at]
      properties:
        luns:
          type: array
          items:
            type: object
            required: [id, name, host_volume, provisioning, lun_type, status, size_bytes, reserved_bytes, allocated_bytes, used_percent, mapped, sessions, targets, consumer]
            properties:
              id: { type: string, description: "DSM UUID or zvol name: the `lun` label." }
              name: { type: string }
              host_volume: { type: string, description: Host volume (Synology) or pool (TrueNAS). }
              provisioning: { type: string, enum: [thick, thin, unknown] }
              lun_type: { type: string, examples: [BLUN_THICK, BLUN, FILE] }
              status: { type: string }
              size_bytes: { type: [number, "null"] }
              reserved_bytes: { type: [number, "null"], description: "Space taken on the volume: the size if thick, the written space if thin." }
              allocated_bytes: { type: [number, "null"], description: Written space of a thin LUN. }
              used_percent: { type: [number, "null"], description: Written share of a thin LUN; null for a thick one. }
              mapped: { type: [boolean, "null"] }
              sessions: { type: [number, "null"] }
              targets:
                type: array
                items:
                  type: object
                  properties:
                    iqn: { type: string }
                    name: { type: string }
                    sessions: { type: number }
                    initiators: { type: array, items: { type: string } }
              consumer:
                oneOf:
                  - type: "null"
                  - type: object
                    required: [source, target_id, target_name, family, family_label, entity, used_percent, used_bytes, size_bytes]
                    properties:
                      source: { type: string, enum: [manual, auto] }
                      target_id: { type: integer, format: int64 }
                      target_name: { type: string }
                      family: { type: string }
                      family_label: { type: string }
                      entity: { type: string }
                      used_percent: { type: [number, "null"] }
                      used_bytes: { type: [number, "null"] }
                      size_bytes: { type: [number, "null"] }
        volumes:
          type: array
          description: Synology volumes hosting at least one LUN; empty elsewhere.
          items:
            type: object
            additionalProperties: true
            properties:
              volume: { type: string }
              name: { type: string }
              total_bytes: { type: [number, "null"] }
              used_bytes: { type: [number, "null"] }
              used_percent: { type: [number, "null"] }
              lun_count: { type: [number, "null"] }
              reserved_bytes: { type: [number, "null"], description: Sum of the thick LUN sizes. }
              thin_allocated_bytes: { type: [number, "null"] }
              thin_provisioned_bytes: { type: [number, "null"] }
              thin_promised_bytes: { type: [number, "null"], description: Promised to thin LUNs and not written yet. }
              data_bytes: { type: [number, "null"], description: Data outside LUNs. }
              effective_total_bytes: { type: [number, "null"] }
              effective_used_bytes: { type: [number, "null"] }
              effective_used_percent: { type: [number, "null"] }
              overcommit_percent: { type: [number, "null"], description: Promised thin space as a percentage of the free space. }
              fully_reserved: { type: [boolean, "null"] }
        sampled_at: { type: [number, "null"] }

    # -------------------------------------------------------------- sécurité
    SecurityGrade:
      type: [string, "null"]
      enum: [A, B, C, D, F, null]
      description: A ≥ 90, B ≥ 75, C ≥ 60, D ≥ 40, F below; null when nothing could be rated.
    SecurityCheck:
      type: object
      required: [id, title, category, severity, weight, result, evidence, remediation, reference]
      properties:
        id: { type: string, example: pve.updates.security }
        title: { type: string }
        category:
          type: string
          enum: [exposure, patching, authentication, encryption, backup, configuration]
        severity: { type: string, enum: [critical, high, medium, low] }
        weight: { type: integer, description: "critical 10, high 6, medium 3, low 1" }
        result: { type: string, enum: [pass, fail, unknown] }
        evidence: { type: string }
        remediation: { type: string }
        reference: { type: string, format: uri, description: Vendor best-practice page. }
    SecurityGuide:
      type: object
      description: How to raise the score on this kind of device.
      required: [product, steps, doc_url]
      properties:
        product: { type: string, examples: [Proxmox VE, Linux host] }
        steps: { type: array, items: { type: string }, description: Concrete steps, in order. }
        doc_url: { type: string, format: uri, description: Matching section of the documentation. }
    SelfMonitoringComponent:
      type: object
      required: [name, ok]
      properties:
        name: { type: string, enum: [scheduler, database, victoria] }
        ok: { type: boolean }
        error: { type: string }
    HeartbeatPing:
      type: object
      required: [at, outcome, ok, failed]
      properties:
        at: { type: string, description: "UTC, without suffix." }
        outcome:
          type: string
          enum: [up, fail, withheld]
          description: "`withheld`: a component was down and nothing was sent."
        ok: { type: boolean, description: The call left and the service accepted it. }
        error: { type: string }
        failed:
          type: array
          items: { type: string }
    Heartbeat:
      type: object
      required: [enabled, interval_seconds, send_fail, has_url, url_host, last_ping]
      properties:
        enabled: { type: boolean }
        interval_seconds: { type: integer, minimum: 30, maximum: 3600 }
        send_fail: { type: boolean, description: Send a failure signal instead of staying silent. }
        has_url: { type: boolean }
        url_host: { type: [string, "null"] }
        last_ping:
          oneOf:
            - { $ref: "#/components/schemas/HeartbeatPing" }
            - { type: "null" }
    HeartbeatUpdate:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        interval_seconds: { type: integer, minimum: 30, maximum: 3600 }
        send_fail: { type: boolean }
        url: { type: string, description: "Omitted: kept. Empty: cleared." }
    HeartbeatTestResult:
      type: object
      required: [ok, error]
      properties:
        ok: { type: boolean }
        error: { type: [string, "null"] }
    SelfMonitoring:
      type: object
      required: [status, components, data_free_bytes, data_total_bytes, database_bytes, vm_embedded, vm_restarts, scheduler_idle_seconds, scheduler_backlog, heartbeat]
      properties:
        status: { type: string, enum: [ok, degraded] }
        components:
          type: array
          items: { $ref: "#/components/schemas/SelfMonitoringComponent" }
        data_free_bytes: { type: [integer, "null"] }
        data_total_bytes: { type: [integer, "null"] }
        database_bytes: { type: integer }
        vm_embedded: { type: boolean }
        vm_restarts: { type: integer }
        scheduler_idle_seconds: { type: integer }
        scheduler_backlog: { type: integer }
        heartbeat: { $ref: "#/components/schemas/Heartbeat" }
    SecuritySettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    SecurityReport:
      type: object
      required: [enabled, target_id, target_name, kind, supported, score, grade, capped, evaluated_at, counts, checks, guide]
      properties:
        enabled:
          type: boolean
          description: "`false`: the score is turned off; `supported` is false and nothing else is filled."
        target_id: { type: integer }
        target_name: { type: string }
        kind: { type: string }
        supported: { type: boolean }
        score: { type: [integer, "null"], minimum: 0, maximum: 100 }
        grade: { $ref: "#/components/schemas/SecurityGrade" }
        capped:
          type: boolean
          description: A failing critical check capped the grade at C.
        evaluated_at: { type: string, description: UTC, without suffix. }
        counts:
          type: object
          properties:
            pass: { type: integer }
            fail: { type: integer }
            unknown: { type: integer }
        checks:
          type: array
          description: Failing checks first (heaviest first), then passing, then unknown.
          items: { $ref: "#/components/schemas/SecurityCheck" }
        guide:
          oneOf:
            - { $ref: "#/components/schemas/SecurityGuide" }
            - { type: "null" }
    SecuritySummary:
      type: object
      required: [enabled, evaluated_at, devices]
      properties:
        enabled: { type: boolean, description: "`false`: the score is turned off, `devices` is empty." }
        evaluated_at: { type: string }
        devices:
          type: array
          items:
            type: object
            properties:
              target_id: { type: integer }
              target_name: { type: string }
              kind: { type: string }
              score: { type: [integer, "null"] }
              grade: { $ref: "#/components/schemas/SecurityGrade" }
              capped: { type: boolean }
              pass: { type: integer }
              fail: { type: integer }
              unknown: { type: integer }
              top_failures: { type: array, items: { type: string } }

    ThreatMap:
      type: object
      required: [countries, sources, partial, evaluated_at]
      properties:
        countries:
          type: array
          description: Busiest first.
          items:
            type: object
            required: [code, total, crowdsec, firewall, cloudflare]
            properties:
              code: { type: string, description: ISO 3166-1 alpha-2 country code. }
              total: { type: integer }
              crowdsec: { type: integer }
              firewall: { type: integer }
              cloudflare: { type: integer }
        sources:
          type: array
          description: Sources plugged in, even with nothing seen; empty when none is.
          items:
            type: object
            required: [source, targets, total, window_secs]
            properties:
              source: { type: string, enum: [crowdsec, firewall, cloudflare] }
              targets: { type: array, items: { type: integer, format: int64 } }
              total: { type: integer }
              window_secs: { type: integer, description: Time span the counts of this source cover. }
        partial: { type: boolean, description: "`true`: VictoriaMetrics did not answer, only the firewall live windows are counted." }
        evaluated_at: { type: string }

    CveState:
      type: string
      enum: [vulnerable, patched, unknown]
      description: "`unknown`: to check by hand (backported fix possible, ambiguous data)."
    CveSeverity:
      type: string
      enum: [critical, high, medium, low, none]
      description: CVSS 3 class; `none` when no score is known.
    CveSettings:
      type: object
      required: [enabled, has_nvd_key]
      properties:
        enabled: { type: boolean }
        has_nvd_key: { type: boolean }
    CveSettingsInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        nvd_api_key: { type: string, description: "Omitted: kept. Empty: cleared." }
    CveFinding:
      type: object
      properties:
        target_id: { type: integer }
        target_name: { type: string }
        target_kind: { type: string }
        component: { type: string }
        installed_version: { type: string }
        fixed_version: { type: [string, "null"] }
        cve_id: { type: string }
        summary: { type: string }
        cvss: { type: [number, "null"] }
        severity: { $ref: "#/components/schemas/CveSeverity" }
        published: { type: [string, "null"] }
        exploited: { type: boolean, description: In the CISA KEV catalog. }
        ransomware: { type: boolean }
        state: { $ref: "#/components/schemas/CveState" }
        reason:
          type: string
          enum: [below_fixed_version, in_affected_range, no_fix_available, fixed_version_installed, vendor_build, undetermined, version_unparsed]
        source: { type: string, enum: [nvd, osv, debian] }
        link: { type: string }
        ignored: { type: boolean }
        ignore_note: { type: [string, "null"] }
        ignored_by: { type: [string, "null"] }
        ignored_at: { type: [string, "null"] }
    CveList:
      type: object
      required: [enabled, findings]
      properties:
        enabled: { type: boolean }
        findings: { type: array, items: { $ref: "#/components/schemas/CveFinding" } }
    CveSummary:
      type: object
      properties:
        enabled: { type: boolean }
        refreshing: { type: boolean }
        last_refresh: { type: [string, "null"] }
        counts:
          type: object
          properties:
            vulnerable: { type: integer }
            exploited: { type: integer }
            unknown: { type: integer }
            patched: { type: integer }
            ignored: { type: integer }
        targets: { type: integer }
        components: { type: integer }
        sources:
          type: array
          items:
            type: object
            properties:
              name: { type: string, enum: [nvd, osv, debian, kev] }
              last_success: { type: [string, "null"] }
              last_error: { type: [string, "null"] }
              items: { type: integer }
    CveInventory:
      type: object
      properties:
        components:
          type: array
          items:
            type: object
            properties:
              target_id: { type: integer }
              target_name: { type: string }
              component: { type: string }
              version: { type: string }
              origin: { type: string, examples: [nvd, "debian:bookworm", "osv:Ubuntu:24.04:LTS", none] }
              findings: { type: integer }

    # ------------------------------------------------------------------ MCP
    McpEndpointInfo:
      type: object
      required: [error]
      properties:
        error: { type: string }
        protocolVersion: { type: string }
        transport: { type: string, const: streamable-http }
        streaming: { type: boolean }
        docs: { type: string }
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      description: A request (with `id`) or a notification (without). Batches are refused.
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id: { type: [string, integer] }
        method:
          type: string
          examples: [server/discover, initialize, tools/list, tools/call, ping]
        params: { type: object, additionalProperties: true }
    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, const: "2.0" }
        id: { type: [string, integer, "null"] }
        result: { type: object, additionalProperties: true }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data: {}
    WallPlace:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string }
        region: { type: string }
        country_code: { type: string }
        latitude: { type: number }
        longitude: { type: number }
    WallWeatherPlace:
      type: object
      required: [name, latitude, longitude]
      properties:
        name: { type: string, maxLength: 100 }
        region: { type: [string, "null"] }
        country: { type: [string, "null"] }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
    WallWeather:
      type: object
      required: [place, unit, current]
      properties:
        place:
          oneOf:
            - { $ref: "#/components/schemas/WallWeatherPlace" }
            - { type: "null" }
        unit: { type: string, enum: [c, f] }
        current:
          oneOf:
            - type: object
              required: [temperature, condition, is_day]
              properties:
                temperature: { type: integer, description: Outside temperature in the chosen unit, rounded. }
                condition: { type: string, enum: [clear, partly_cloudy, cloudy, fog, rain, snow, thunder] }
                is_day: { type: boolean }
            - { type: "null" }
    OnCallPerson:
      type: object
      properties:
        id: { type: integer, format: int64 }
        display_name: { type: string }
        disabled: { type: boolean }
        on_call: { type: boolean, description: On call right now on at least one schedule. }
        username: { type: string, description: Administrators and the person themselves only. }
        role: { type: string, enum: [admin, operator, viewer, wall], description: Administrators and the person themselves only. }
        contacts: { type: integer, description: Enabled contact methods. Administrators and the person themselves only. }
    OnCallEntry:
      type: object
      properties:
        schedule_id: { type: integer, format: int64 }
        schedule_name: { type: string }
        user_id: { type: [integer, "null"], format: int64 }
        since: { type: [string, "null"], format: date-time }
        until: { type: [string, "null"], format: date-time }
        override_id: { type: [integer, "null"], format: int64 }
    OnCallWindow:
      type: object
      description: Weekly window in the schedule's time zone; an end at or before the start crosses midnight, equal start and end cover the whole day.
      required: [days, start_minute, end_minute]
      properties:
        days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: "0 = Monday." }
        start_minute: { type: integer, minimum: 0, maximum: 1439 }
        end_minute: { type: integer, minimum: 0, maximum: 1439 }
    OnCallLayer:
      type: object
      required: [rotation, participants]
      properties:
        name: { type: string }
        rotation:
          type: object
          required: [kind, start]
          properties:
            kind: { type: string, enum: [daily, weekly, custom] }
            start: { type: string, description: "First handoff, local time of the schedule (YYYY-MM-DDTHH:MM)." }
            length: { type: integer, minimum: 1, description: Custom rotations only. }
            unit: { type: string, enum: [hours, days, weeks], description: Custom rotations only. }
        participants: { type: array, items: { type: integer, format: int64 }, description: Account ids in rotation order. }
        restrictions: { type: array, items: { $ref: "#/components/schemas/OnCallWindow" } }
    OnCallSchedulePayload:
      type: object
      required: [name, timezone, layers]
      properties:
        name: { type: string }
        description: { type: string }
        timezone: { type: string, description: IANA time zone. }
        handoff_notifications: { type: boolean }
        layers: { type: array, items: { $ref: "#/components/schemas/OnCallLayer" }, description: A later layer wins where it is active. }
    OnCallSchedule:
      allOf:
        - $ref: "#/components/schemas/OnCallSchedulePayload"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            now:
              type: [object, "null"]
              properties:
                user_id: { type: integer, format: int64 }
                since: { type: [string, "null"], format: date-time }
                until: { type: [string, "null"], format: date-time }
                layer: { type: [integer, "null"] }
                override_id: { type: [integer, "null"], format: int64 }
            created_at: { type: string }
            updated_at: { type: string }
    OnCallShift:
      type: object
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        user_id: { type: integer, format: int64 }
        layer: { type: [integer, "null"] }
        override_id: { type: [integer, "null"], format: int64 }
    OnCallShifts:
      type: object
      properties:
        final: { type: array, items: { $ref: "#/components/schemas/OnCallShift" } }
        layers: { type: array, items: { type: array, items: { $ref: "#/components/schemas/OnCallShift" } } }
        overrides: { type: array, items: { $ref: "#/components/schemas/OnCallOverride" } }
    OnCallOverridePayload:
      type: object
      required: [user_id, starts_at, ends_at]
      properties:
        user_id: { type: integer, format: int64, description: Who takes the shift. }
        replaces: { type: [integer, "null"], format: int64, description: "Only while this person would be on call; null: whoever is." }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        note: { type: string }
    OnCallOverride:
      allOf:
        - $ref: "#/components/schemas/OnCallOverridePayload"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            schedule_id: { type: integer, format: int64 }
            created_by: { type: string }
            created_at: { type: string }
    EscalationStep:
      type: object
      required: [delay_minutes, targets]
      properties:
        delay_minutes: { type: integer, minimum: 1, maximum: 1440, description: Wait after this step before the next one. }
        targets:
          type: array
          items:
            type: object
            required: [type, id]
            properties:
              type: { type: string, enum: [schedule, user, channel] }
              id: { type: integer, format: int64 }
    EscalationPolicyPayload:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        description: { type: string }
        repeat: { type: integer, minimum: 0, maximum: 9, description: Extra rounds of the whole chain after the last step. }
        steps: { type: array, items: { $ref: "#/components/schemas/EscalationStep" } }
    EscalationPolicy:
      allOf:
        - $ref: "#/components/schemas/EscalationPolicyPayload"
        - type: object
          properties:
            id: { type: integer, format: int64 }
            channels: { type: array, items: { type: integer, format: int64 }, description: On-call channels that run this policy. }
            created_at: { type: string }
            updated_at: { type: string }
    Escalation:
      type: object
      properties:
        id: { type: integer, format: int64 }
        policy_id: { type: integer, format: int64 }
        policy_name: { type: string }
        channel_id: { type: integer, format: int64 }
        fingerprint: { type: string }
        target_id: { type: [integer, "null"], format: int64 }
        target_name: { type: string }
        rule_name: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        status: { type: string, enum: [active, acked, resolved, exhausted, cancelled] }
        step: { type: integer, description: Next step index. }
        round: { type: integer }
        next_at: { type: [string, "null"], format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
        acked_by: { type: [string, "null"] }
        events:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              step: { type: [integer, "null"] }
              round: { type: [integer, "null"] }
              event: { type: string, enum: [started, notified, failed, skipped, acked, resolved, exhausted, cancelled] }
              user_id: { type: [integer, "null"], format: int64 }
              user_name: { type: [string, "null"] }
              via: { type: string }
              kind: { type: string }
              detail: { type: string }
    ContactOptions:
      type: object
      properties:
        kinds: { type: array, items: { type: string } }
        team_channels:
          type: array
          items:
            type: object
            properties:
              id: { type: integer, format: int64 }
              name: { type: string }
              kind: { type: string }
              recipient: { type: string, enum: [email, phone, chat_id] }
    ContactPayload:
      type: object
      required: [label]
      properties:
        label: { type: string }
        kind: { type: string, description: Own service (one of `ContactOptions.kinds`). }
        via_channel_id: { type: [integer, "null"], format: int64, description: Team channel that reaches this address instead. }
        address: { type: [string, "null"] }
        settings: { type: object }
        secrets: { type: object, description: "Omitted: kept. `{}`: cleared." }
        enabled: { type: boolean }
        min_severity: { type: string, enum: [info, warning, critical] }
    Contact:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        kind: { type: string }
        via_channel_id: { type: [integer, "null"], format: int64 }
        via_channel_name: { type: [string, "null"] }
        address: { type: [string, "null"] }
        settings: { type: object }
        has_secret: { type: boolean }
        enabled: { type: boolean }
        min_severity: { type: string, enum: [info, warning, critical] }
        last_error: { type: [string, "null"] }
        last_used_at: { type: [string, "null"], format: date-time }
    OnCallProfilePayload:
      type: object
      properties:
        timezone: { type: string }
        quiet_hours: { type: [object, "null"], description: "A weekly window, as a channel's quiet hours. Outside on-call duty, only critical alerts get through during it." }
    OnCallProfile:
      type: object
      properties:
        timezone: { type: string }
        quiet_hours: { type: [object, "null"] }
        calendar: { type: boolean, description: An iCal link exists. }
        on_call: { type: array, items: { $ref: "#/components/schemas/OnCallEntry" } }
        next_shift:
          type: [object, "null"]
          properties:
            schedule_id: { type: integer, format: int64 }
            schedule_name: { type: string }
            start: { type: string, format: date-time }
            end: { type: string, format: date-time }
    OnCallCalendarLink:
      type: object
      properties:
        url: { type: string }
