        "404": { $ref: "#/components/responses/NotFound" }

  /api/remediation/policies/{id}/arm:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: armRemediationPolicy
      tags: [Remediation]
      summary: First step of arming a policy (admin, signed in)
      description: >-
        Returns a single-use code, valid two minutes, that only the same account can send
        to `confirm`, with a plain summary of what will run.
