# Spécification OpenAPI 3.1 de l'API HTTP de DumbMonit.
#
# Maintenue à la main, embarquée dans le binaire (`api/openapi.rs`) et servie en
# JSON à `GET /api/openapi.json`. Le serveur réécrit `info.version` avec sa
# constante API_VERSION et ajoute `info.x-server-version`.
#
# Un test de dérive compare les routes déclarées dans `crates/server/src/api/**`
# à ce fichier : toute route ajoutée au routeur doit l'être ici, avec ses méthodes
# exactes. Seules en sont exclues, volontairement, les routes du protocole des
# agents (`/api/ingest`, `/api/agent/commands*`, `/api/agent/relay*`, la
# WebSocket `/api/agent/ws`), les
# redirections du navigateur pour OpenID Connect (`/api/auth/oidc/start`,
# `/api/auth/oidc/callback`) et SAML (`/api/auth/saml/start`, `/acs`,
# `/complete`), et la distribution de l'agent (`/install.sh`,
# `/install.ps1`, `/download/{name}`).
#
# Chaque opération porte `x-token-scope` :
#   public  aucune authentification (`security: []`)
#   read    jeton `read` (ou `write`), ou session de n'importe quel compte
#   write   jeton `write`, ou session d'administrateur
#   none    session seulement : tout jeton d'API est refusé (403)
openapi: 3.1.0
info:
  title: DumbMonit HTTP API
  version: "0.1"
  summary: Monitoring from homelabs to mid-sized companies — the API the web UI uses, open to scripts and assistants.
  description: |
    Everything the DumbMonit web interface does goes through this API. It is an
    **alpha**: routes and fields may still change between releases. The
    `X-DumbMonit-Api-Version` header, present on every `/api` response, says
    which revision of this document the server implements.

    ## Authentication

    Two ways in, accepted on every protected route:

    - **API token** — `Authorization: Bearer dmt_…`, created in Settings →
      *API & assistants*. Meant for scripts, dashboards and assistants. No
      cookie is involved, so no anti-CSRF header is needed.
    - **Session cookie** — `__Host-dumbmonit_session`, what the web UI uses after
      `POST /api/auth/login`. Every state-changing request (`POST`, `PUT`,
      `DELETE`) sent with the cookie must also carry
      `X-Requested-With: DumbMonit`, or it is refused with `403`.

    A token has a scope. **`read`** grants what a *viewer* account sees: every
    `GET`. **`write`** grants what an *administrator* does: `POST`, `PUT` and
    `DELETE` as well. Whatever its scope, a token can never manage accounts,
    sessions, two-factor authentication, SSO, API or agent tokens, nor export
    or restore a backup: those operations are marked `x-token-scope: none` and
    answer `403` to a bearer token. A token can also expire, be restricted to
    some networks, and is refused when the account that created it is disabled;
    when that account is no longer an administrator, a `write` token acts as a
    `read` one.

    Each operation carries `x-token-scope`: `public` (no authentication),
    `read`, `write` or `none` (session only).

    ## Quick start

    Create a token in Settings → *API & assistants*, keep it in a variable, and
    send it on every call:

    ```sh
    export DUMBMONIT_TOKEN=dmt_…
    curl -sk -H "Authorization: Bearer $DUMBMONIT_TOKEN" https://dumbmonit.example:8080/api/targets
    ```

    The token is shown once, when it is created. A missing, wrong, revoked or
    expired token answers `401`; a `read` token on a write route answers `403`.
    The operations below carry a `curl` example (`x-codeSamples`).

    ## Roles

    Accounts have one of three roles. **`viewer`** reads every `GET`.
    **`operator`** reads the same and handles alerts — the operations marked
    `x-roles: [admin, operator]`: acknowledge, ignore a rule for one device
    (an override with `enabled: false` only, no threshold), snooze
    (maintenance windows) and clear resolved history. **`admin`** does
    everything. Every other write is admin only, and an operator can never
    manage accounts or roles.

    An admin may also define **custom roles** (`/api/roles`): a set of
    permissions from a fixed catalog (`GET /api/roles/permissions`), given to
    an account whose built-in role stays `viewer`. Such an account reads like
    a viewer and reaches, in addition, the operations marked
    `x-permissions` with one of its permissions; any other write answers
    `403`. Accounts, roles, teams, tokens, single sign-on, backups and
    instance settings are never in the catalog.

    A fourth role, **`wall`**, is a wall display: it signs in to show the
    wall (`/wall`) and nothing else. It reaches only what the wall reads —
    the operations marked `x-wall: true`:
    `GET /api/auth/me`, `POST /api/auth/logout`, `GET /api/instance/settings`,
    `GET /api/targets` (without addresses, options or credentials),
    `GET /api/alerts`, `GET /api/alerts/rules`, `GET /api/metrics/query`,
    `GET /api/metrics/query_range`, `GET /api/incidents`,
    `GET /api/alerts/silences` and `GET /api/wall/weather`. Everything else answers
    `403`, reads
    included. Its session is renewed while the screen shows the wall, so
    `DUMBMONIT_SESSION_DAYS` is how long it may stay idle rather than how
    long it lasts; the two-factor policy does not apply to it; team rights
    limit what it shows, as for any account. API tokens open nothing for it.

    ## Errors

    Every error body is JSON: `{"error": "message"}` — `400` bad request,
    `401` no valid session or token (with `WWW-Authenticate: Bearer` for a
    token), `403` not allowed (viewer, operator outside alert handling, wall
    display outside the wall, or `read` token on a write route, missing
    anti-CSRF header, token on a session-only route, token used from a network
    it is not allowed from), `404` unknown id, `409` conflict, `429` rate
    limited (with `Retry-After`), `500` otherwise. An unknown path under `/api`
    answers `404 {"error": "Unknown API route: …"}`.

    ## Limits

    Each API token may make **120 calls per minute**. Beyond, `429` with
    `Retry-After` (seconds). Every response to a token-authenticated request
    carries `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`.

    ## CORS

    Cross-origin requests are answered only when they carry an
    `Authorization: Bearer dmt_…` header (plus `GET /api/openapi.json`, which
    is public): `Access-Control-Allow-Origin` is sent, never
    `Access-Control-Allow-Credentials`, so a session cookie is never usable
    from another origin. Allowed origins: any by default, or the list in
    `DUMBMONIT_API_CORS_ORIGINS` (`off` disables CORS altogether).

    Full guide: <https://dumbmonit.selfhostr.io/docs/reference/api/>
  license:
    name: MIT
    identifier: MIT
  contact:
    name: DumbMonit
    url: https://github.com/selfhostr/dumbmonit
externalDocs:
  description: HTTP API reference
  url: https://dumbmonit.selfhostr.io/docs/reference/api/
servers:
  - url: /
    description: This DumbMonit instance
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Health
    description: Liveness of the server and its dependencies.
  - name: Specification
    description: This document.
  - name: Accounts
    description: Sign-in, sessions, two-factor authentication, SSO and accounts. Session only.
  - name: SCIM
    description: >-
      SCIM 2.0 provisioning of accounts and teams by an identity provider
      (Entra ID, Okta), with its own bearer token (`dmscim_…`). No API token or
      session is accepted; disabled, these routes answer 404.
  - name: API tokens
    description: Tokens for scripts and assistants. Session only — a token never creates another token.
  - name: Devices
    description: Monitored devices and services (targets).
  - name: Device types
    description: The catalogue of kinds this server can monitor.
  - name: Discovery
    description: SNMP network scan.
  - name: Onboarding
    description: The first-run guide.
  - name: Metrics
    description: MetricsQL queries proxied to VictoriaMetrics.
  - name: Alerts
    description: Active alerts, history and acknowledgements.
  - name: Rules
    description: Alert rules and per-device overrides.
  - name: Silences
    description: Maintenance windows.
  - name: Notifications
    description: Notification channels and the global notification policy.
  - name: On-call
    description: On-call schedules, replacements, escalation policies and their log; each account's contacts, quiet hours and calendar link.
  - name: Status pages
    description: Status pages, their items, logos and subscribers.
  - name: Reports
    description: Periodic availability reports sent by email.
  - name: Incidents
    description: Incidents and maintenance announcements shown on status pages.
  - name: SLOs
    description: Service level objectives, their error budget and burn rates.
  - name: Annotations
    description: Change markers (deployments, updates, maintenance) drawn on the charts.
  - name: Public status
    description: What a published status page exposes, without authentication.
  - name: Agents
    description: Machines running the DumbMonit agent, relays and enrolment tokens.
  - name: Containers
    description: Docker containers on agent machines, and the commands sent to them.
  - name: Heartbeats
    description: Push monitors — the secret URL a job calls.
  - name: Website changes
    description: Pages, changes and line diffs of a `webchange` device.
  - name: Websites
    description: Last reading, tracked SEO metadata and confirmed changes of a `website` device.
  - name: Network configuration backups
    description: Stored configuration versions, line diffs and the SSH host key of a `netconfig` device.
  - name: Integration packs
    description: Device types described in YAML.
  - name: Integrations
    description: Panels specific to one device kind (Proxmox, PBS, PDM, PMG, OPNsense, TrueNAS, Redfish, Synology, observability backends, proxies).
  - name: Security
    description: >-
      Security score per device: checks derived from vendor best practices,
      evaluated on the data collectors already gather.
  - name: Remediation
    description: >-
      Runbooks linked to alerts, remediation actions (closed catalogue), automatic
      policies armed in two steps, and the audit log. Actions are session only.
  - name: Backup
    description: Encrypted export and restore of the instance. Session only.
  - name: Configuration files
    description: >-
      Declarative configuration in YAML (GitOps): plan, apply and export.
      Administrator session or `write` token. Objects declared by a file are
      managed by it and refuse manual edits.
  - name: Logs
    description: Server logs kept on disk, their export, and shipping to a log service. Session only.
  - name: Storage
    description: Metrics retention, long-term 5-minute history, embedded log store and disk usage. Session only.
  - name: Self-monitoring
    description: Health of DumbMonit itself and the outgoing heartbeat.
  - name: Assistants
    description: The built-in Model Context Protocol (MCP) server.
  - name: Wall weather
    description: >-
      The outside temperature and weather icon beside the wall's date. The
      server asks Open-Meteo (browsers never do), only once a place is chosen.
  - name: Prometheus compatibility
    description: Read access for an existing Prometheus or Grafana, outside `/api`.
  - name: OpenTelemetry
    description: OTLP/HTTP reception of metrics and logs, outside `/api`.

paths:
  # ------------------------------------------------------------------ santé
  /api/health:
    get:
      operationId: getHealth
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # No token. Liveness: always 200.
            curl -sk https://dumbmonit.example:8080/api/health
      tags: [Health]
      summary: Server version and state of its dependencies
      description: >-
        Liveness probe. Always `200`; a failing component is reported in the body and `status` is
        then `degraded`. For a readiness probe, use `/api/ready`.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: Health report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/ready:
    get:
      operationId: getReady
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # No token. Readiness: 200, or 503 when the database or VictoriaMetrics is down.
            curl -sk -o /dev/null -w "%{http_code}\n" https://dumbmonit.example:8080/api/ready
      tags: [Health]
      summary: Readiness probe
      description: >-
        `200` when the database and VictoriaMetrics both answer, `503` otherwise. Public and without
        failure details: only the status code and three booleans. Use it as the Kubernetes
        `readinessProbe`; keep `/api/health` for liveness.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }
        "503":
          description: Not ready; the body says which dependency is down.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ready" }

  /api/integrations/wordpress.zip:
    get:
      operationId: downloadWordpressBanner
      tags: [Status pages]
      summary: Download the WordPress status banner plugin
      description: >-
        The `dumbmonit-status-banner` plugin as a zip with the plugin folder at its root, ready for
        Plugins > Add New > Upload Plugin. Embedded in the server; contains no secret.
      x-token-scope: read
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: The plugin archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/integrations/banner.php:
    get:
      operationId: downloadPhpBanner
      tags: [Status pages]
      summary: Download the PHP status banner helper
      description: >-
        `banner.php`, to `require` from a PHP site and call with the status page URL. Embedded in
        the server; contains no secret.
      x-token-scope: read
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: The PHP source.
          content:
            text/x-php:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/update:
    get:
      operationId: getUpdate
      tags: [Health]
      summary: Whether a newer release exists
      description: >-
        The server asks the public GitHub releases API for the latest release at most once
        every 24 hours (cached in memory) and compares it with the running version, pre-releases
        such as `0.1.0-alpha.7` included. Nothing is sent but an anonymous request. Disabled by
        `DUMBMONIT_UPDATE_CHECK=off` or by `PUT /api/update/settings`; `latest` stays empty then.
        Nothing is ever installed automatically.
      x-token-scope: read
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Update state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/update/check:
    post:
      operationId: checkUpdateNow
      tags: [Health]
      summary: Look for a new release now
      description: Bypasses the 24-hour cache. At most once a minute; `409` with the wait otherwise.
      x-token-scope: write
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      responses:
        "200":
          description: Update state after the check.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/update/settings:
    put:
      operationId: setUpdateCheck
      tags: [Health]
      summary: Turn the update check on or off
      description: Ignored while `DUMBMONIT_UPDATE_CHECK=off` is set (`locked_by_env`).
      x-token-scope: write
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Update state with the new setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpdateInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/upgrade-notes:
    get:
      operationId: getUpgradeNotes
      tags: [Health]
      summary: Configuration changes an update asks for (admin only)
      description: >-
        Some versions need a change outside the image, in the `docker-compose.yml` the
        user owns (a published port, an environment variable). Every known change is listed
        with its explanation, the block to copy and its `status`: `pending` when the instance
        went through the version that introduced it, or when the automatic `detection` finds
        it still missing; `closed` once an administrator closed it; `clear` otherwise.
        `announce` is true when the window should open by itself: changes are pending and it
        has not been shown for this version. Detections that probe the network are kept for a
        minute; `fresh=true` runs them again. Session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - name: fresh
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Run the automatic detections again instead of using the one-minute memory.
      responses:
        "200":
          description: The changes and where the instance stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeNotes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/upgrade-notes/close:
    post:
      operationId: closeUpgradeNotes
      tags: [Health]
      summary: Close configuration changes (admin only)
      description: >-
        A closed change never comes back for its version, and the reminder in the interface
        goes away once none is left. With no `ids`, every change that is pending is closed.
        Recorded in the audit log. Session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
                  description: Identifiers of the changes to close; empty or absent closes all pending ones.
      responses:
        "200":
          description: The changes after closing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpgradeNotes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/upgrade-notes/announce:
    post:
      operationId: announceUpgradeNotes
      tags: [Health]
      summary: Record that the changes window was shown (admin only)
      description: >-
        Stops `announce` from being true again for the running version; the changes stay
        pending until they are closed. Session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Recorded. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/openapi.json:
    get:
      operationId: getOpenApi
      tags: [Specification]
      summary: This OpenAPI document
      description: Public and free of any secret. Served with `Access-Control-Allow-Origin` so that API tools hosted elsewhere can load it.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: The OpenAPI 3.1 document, in JSON.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  # ------------------------------------------------------------- comptes
  /api/auth/status:
    get:
      operationId: getAuthStatus
      tags: [Accounts]
      summary: Whether the instance is configured and who is signed in
      description: >-
        `configured: false` means a fresh instance: until the first administrator
        exists, every protected route answers `401`.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: Authentication state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

  /api/auth/setup:
    post:
      operationId: setupFirstAdmin
      tags: [Accounts]
      summary: Create the first administrator
      description: Only on a fresh instance (`409` once an account exists), with the setup code printed in the server logs (`401` if wrong, `429` after too many attempts). Does not open a session.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetupRequest" }
      responses:
        "204": { description: Account created. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/login:
    post:
      operationId: login
      tags: [Accounts]
      summary: Sign in with a password
      description: >-
        `204` with a `Set-Cookie` header carrying the session. When the account
        has two-factor authentication, `200` with a pending ticket to finish
        with `POST /api/auth/login/totp`. Rate limited after five failures
        (`429`, `Retry-After` doubling from 30 s to 5 min).
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              description: "`__Host-dumbmonit_session`, Secure, HttpOnly, SameSite=Strict."
              schema: { type: string }
        "200":
          description: Two-factor authentication required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpChallenge" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/login/totp:
    post:
      operationId: loginTotp
      tags: [Accounts]
      summary: Finish a sign-in with a two-factor code
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpLoginRequest" }
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              description: "`__Host-dumbmonit_session`, Secure, HttpOnly, SameSite=Strict."
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/logout:
    post:
      operationId: logout
      tags: [Accounts]
      summary: End the current session
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      x-wall: true
      responses:
        "204": { description: Signed out; the cookie is cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/me:
    get:
      operationId: getCurrentUser
      tags: [Accounts]
      summary: The signed-in account
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      x-wall: true
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/password:
    post:
      operationId: changePassword
      tags: [Accounts]
      summary: Change the password of the signed-in account
      description: Signs out every other session of the account.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/passkey/login/begin:
    post:
      operationId: beginPasskeyLogin
      tags: [Accounts]
      summary: Start a sign-in with a passkey
      description: >-
        Returns the WebAuthn options for `navigator.credentials.get()` (discoverable
        credential, user verification required). The relying-party id is the host
        of the request's `Origin` (or of `DUMBMONIT_PUBLIC_URL` when set); HTTPS is
        required except on `localhost`, and an IP address is refused.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: A challenge id and the options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/auth/passkey/login/finish:
    post:
      operationId: finishPasskeyLogin
      tags: [Accounts]
      summary: Finish a sign-in with a passkey
      description: >-
        Verifies the assertion (challenge, origin, relying party, user presence and
        verification, ES256 signature, counter) and opens the session. A passkey
        replaces the password and the second factor.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, credential]
              properties:
                challenge_id: { type: string }
                credential:
                  type: object
                  required: [id, response]
                  properties:
                    id: { type: string, description: "Credential id, base64url." }
                    response:
                      type: object
                      required: [clientDataJSON, authenticatorData, signature]
                      properties:
                        clientDataJSON: { type: string }
                        authenticatorData: { type: string }
                        signature: { type: string }
                        userHandle: { type: [string, "null"] }
      responses:
        "204":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              description: "`__Host-dumbmonit_session`, Secure, HttpOnly, SameSite=Strict."
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/passkeys:
    get:
      operationId: listPasskeys
      tags: [Accounts]
      summary: Passkeys of the signed-in account
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The account's passkeys, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Passkey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      tags: [Accounts]
      summary: Start adding a passkey
      description: >-
        Asks for the password again (like the two-factor enrolment) and returns the
        options for `navigator.credentials.create()`: ES256 only, attestation
        `none`, resident key and user verification required. Local accounts only;
        at most 20 passkeys per account.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "200":
          description: A challenge id and the options.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyCeremony" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [Accounts]
      summary: Finish adding a passkey
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id, credential]
              properties:
                challenge_id: { type: string }
                name: { type: string, description: "Shown in the list; 60 characters at most." }
                credential:
                  type: object
                  required: [id, response]
                  properties:
                    id: { type: string }
                    transports: { type: array, items: { type: string } }
                    response:
                      type: object
                      required: [clientDataJSON, attestationObject]
                      properties:
                        clientDataJSON: { type: string }
                        attestationObject: { type: string }
      responses:
        "200":
          description: The passkey that was added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passkey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/passkeys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: renamePasskey
      tags: [Accounts]
      summary: Rename a passkey
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "204": { description: Renamed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deletePasskey
      tags: [Accounts]
      summary: Remove a passkey
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/auth/totp:
    get:
      operationId: getTotpStatus
      tags: [Accounts]
      summary: Two-factor state of the signed-in account
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Two-factor state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: disableTotp
      tags: [Accounts]
      summary: Remove the second factor of the signed-in account
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "204": { description: Second factor removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/totp/enroll:
    post:
      operationId: enrollTotp
      tags: [Accounts]
      summary: Propose a two-factor secret
      description: Nothing is enforced until the secret is confirmed with `POST /api/auth/totp/verify`.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordConfirmation" }
      responses:
        "200":
          description: The proposed secret.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpEnrolment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/totp/verify:
    post:
      operationId: verifyTotp
      tags: [Accounts]
      summary: Confirm the enrolment with a first code
      description: Returns the recovery codes — shown once.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TotpCode" }
      responses:
        "200":
          description: Two-factor enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Accounts]
      summary: Replace the recovery codes
      description: >-
        Keeps two-factor authentication on and invalidates every previous recovery
        code. Needs a current code from the authenticator app (`code`) or the
        account password (`password`). Returns the new codes — shown once.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryCodesConfirm" }
      responses:
        "200":
          description: The new recovery codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/sessions:
    get:
      operationId: listSessions
      tags: [Accounts]
      summary: Open sessions of the signed-in account
      description: Most recently active first. `current` marks the session making the request.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Sessions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/sessions/revoke-others:
    post:
      operationId: revokeOtherSessions
      tags: [Accounts]
      summary: Sign out every other session of the signed-in account
      description: The session making the request stays open.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Number of sessions closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionsClosed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Public identifier of the session, from the list.
        schema: { type: string }
    delete:
      operationId: revokeSession
      tags: [Accounts]
      summary: Sign out one of your other sessions
      description: "`404` for a session that is not yours; `409` for the current one (sign out instead)."
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Session closed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/policy:
    get:
      operationId: getAuthPolicy
      tags: [Accounts]
      summary: Authentication policy of the instance
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putAuthPolicy
      tags: [Accounts]
      summary: Change the authentication policy
      description: >-
        Administrator session only. An omitted field takes its default (off). With
        `require_totp`, admins and operators who sign in with a local password and
        have no second factor get `403` with `code: "totp_setup_required"` on every
        route but `GET /api/auth/me`, `GET /api/auth/totp`, the enrolment routes and
        logout. Single sign-on (OIDC, SAML), LDAP and passkey sessions are exempt,
        and viewers and wall displays are never concerned.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthPolicy" }
      responses:
        "200":
          description: The policy now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [Accounts]
      summary: Ask for a password reset link by email
      description: >-
        Public, like the sign-in. `login` is a username or an email address.
        The answer is always `202`, after the same delay, whether an account
        matches or not: nothing tells whether it exists. A link (`/reset?token=…`)
        is emailed only to an active account with a local password and an email
        address — never to an SSO, LDAP or wall-display account — when an
        administrator left self-service on, an email server is configured and a
        link base is known (the public URL, or the origin an administrator last
        used). Each request counts against a per-address and a per-account
        limit (`429`). Requires `X-Requested-With: DumbMonit`.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login]
              properties:
                login: { type: string, description: Username or email address. }
      responses:
        "202":
          description: Request taken; the same answer for every account.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/password-reset/check:
    post:
      operationId: checkPasswordReset
      tags: [Accounts]
      summary: Read a password reset link
      description: >-
        Public. `404` for any link that cannot be used (unknown, expired,
        already used, account no longer eligible), always with the same
        message; failures count against the address (`429`).
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkTokenRequest" }
      responses:
        "200":
          description: The link is valid.
          content:
            application/json:
              schema:
                type: object
                required: [username, expires_at]
                properties:
                  username: { type: string }
                  expires_at: { type: string, description: UTC, without suffix. }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/password-reset/complete:
    post:
      operationId: completePasswordReset
      tags: [Accounts]
      summary: Choose a new password with a reset link
      description: >-
        Public. Sets the password (12 characters at least), signs the account
        out everywhere and uses the link up, along with any other link of the
        account. Two-factor authentication stays on. Then sign in as usual.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 12 }
      responses:
        "204": { description: Password changed; every session of the account is closed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/invitations/check:
    post:
      operationId: checkInvitation
      tags: [Accounts]
      summary: Read an invitation link
      description: >-
        Public. `404` for any link that cannot be used (unknown, expired,
        revoked, already accepted), always with the same message.
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LinkTokenRequest" }
      responses:
        "200":
          description: The invitation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCheck" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [Accounts]
      summary: Create an account from an invitation
      description: >-
        Public. Creates the account with the role, email address and teams of
        the invitation, and closes the invitation. With a `password`, the
        account signs in with its `username`; with `sso: true` (single sign-on
        enabled), it has no password and its username is the invited address,
        which the identity provider must present as verified at the first
        sign-in. `409` when the username is taken (the invitation stays valid).
      security: []
      x-token-scope: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                username: { type: string }
                display_name: { type: string, maxLength: 120 }
                password: { type: string, format: password, minLength: 12 }
                sso: { type: boolean, default: false }
      responses:
        "201":
          description: Account created; sign in next.
          content:
            application/json:
              schema:
                type: object
                required: [username]
                properties:
                  username: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/auth/recovery:
    get:
      operationId: getAccountLinkSettings
      tags: [Accounts]
      summary: Settings of reset links and invitations
      description: >-
        Administrator session only. Also remembers the origin the
        administrator uses: it is the base of the links when no public URL is
        set.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The settings and what they make possible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountLinkSettingsView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putAccountLinkSettings
      tags: [Accounts]
      summary: Change the settings of reset links and invitations
      description: Administrator session only. An omitted field takes its default.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountLinkSettings" }
      responses:
        "200":
          description: The settings now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountLinkSettingsView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/notifications:
    get:
      operationId: getMyNotifications
      tags: [Accounts]
      summary: My personal notifications
      description: >-
        Session only, any role but wall displays. What the signed-in account
        receives itself, by email (to its address, through the instance email
        server) or Web Push (its subscribed devices), on top of the channels.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The choices, and the folders, tags and teams to pick from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyNotificationsView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putMyNotifications
      tags: [Accounts]
      summary: Change my personal notifications
      description: >-
        Session only. Replaces the choices; an omitted field takes its default.
        `email: true` needs an email address on the account.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonalNotificationPrefs" }
      responses:
        "200":
          description: The choices now in force.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyNotificationsView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/notifications/test:
    post:
      operationId: testMyNotifications
      tags: [Accounts]
      summary: Send myself a test notification
      description: Session only. Through each means saved as on; `409` when none is.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: What each means gave; `null` when not tried.
          content:
            application/json:
              schema:
                type: object
                properties:
                  email: { $ref: "#/components/schemas/PersonalDelivery" }
                  push: { $ref: "#/components/schemas/PersonalDelivery" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/auth/audit:
    get:
      operationId: listAuditLog
      tags: [Accounts]
      summary: The latest security events
      description: |
        Administrator session only. Filters combine with "and". For the next
        page, pass the `id` of the last event received as `before`.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: actor
          in: query
          description: Part of the account name.
          schema: { type: string }
        - name: action
          in: query
          description: Exact event, for example `login.failed`.
          schema: { type: string }
        - name: ip
          in: query
          description: Exact client address.
          schema: { type: string }
        - name: since
          in: query
          description: Oldest event, UTC, `YYYY-MM-DD` or `YYYY-MM-DD HH:MM:SS`.
          schema: { type: string }
        - name: until
          in: query
          description: Newest event, UTC. A bare day covers the whole day.
          schema: { type: string }
        - name: before
          in: query
          description: Cursor. Only events with an `id` below this one.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Events, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/audit/export:
    get:
      operationId: exportAuditLog
      tags: [Accounts]
      summary: Download the security events as CSV or JSON
      description: |
        Administrator session only, recorded in the audit log. Same filters as
        the list, up to 100 000 events. Cells of the CSV that a spreadsheet
        could read as a formula are prefixed with an apostrophe.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
        - { name: actor, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: ip, in: query, schema: { type: string } }
        - { name: since, in: query, schema: { type: string } }
        - { name: until, in: query, schema: { type: string } }
      responses:
        "200":
          description: The file.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/oidc/config:
    get:
      operationId: getOidcConfig
      tags: [Accounts]
      summary: Single sign-on settings
      description: Administrator session only. The client secret is never returned (`has_client_secret`).
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The effective settings and where they come from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putOidcConfig
      tags: [Accounts]
      summary: Store single sign-on settings
      description: An absent or empty `client_secret` keeps the stored one.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcConfigUpdate" }
      responses:
        "200":
          description: The new effective settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteOidcConfig
      tags: [Accounts]
      summary: Forget the stored single sign-on settings
      description: Environment variables, if any, apply again.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Settings forgotten. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/oidc/test:
    post:
      operationId: testOidc
      tags: [Accounts]
      summary: Fetch the identity provider's discovery document
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcTestRequest" }
      responses:
        "200":
          description: What was found, or why it failed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OidcTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/ldap/config:
    get:
      operationId: getLdapConfig
      tags: [Accounts]
      summary: LDAP / Active Directory settings
      description: Administrator session only. The service account password is never returned (`has_bind_password`).
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The effective settings and where they come from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LdapConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putLdapConfig
      tags: [Accounts]
      summary: Store LDAP / Active Directory settings
      description: >-
        An absent or empty `bind_password` keeps the stored one, as long as the
        server URL and bind DN are unchanged. An empty `bind_dn` (anonymous
        search) clears it. A plain `ldap://` URL without StartTLS is refused
        unless `DUMBMONIT_LDAP_ALLOW_PLAIN` is set.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LdapConfigUpdate" }
      responses:
        "200":
          description: The new effective settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LdapConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteLdapConfig
      tags: [Accounts]
      summary: Forget the stored LDAP settings
      description: Environment variables (`DUMBMONIT_LDAP_*`), if any, apply again.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The effective settings once the stored ones are gone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LdapConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/ldap/test:
    post:
      operationId: testLdap
      tags: [Accounts]
      summary: Test the directory connection
      description: >-
        Connects, binds the service account and, when `username` is given,
        searches that user and its groups. No user password is asked or tried.
        The stored service password is only used for the server URL and bind
        DN it was saved for.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LdapTestRequest" }
      responses:
        "200":
          description: A step-by-step diagnostic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LdapTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/saml/metadata:
    get:
      operationId: getSamlMetadata
      tags: [Accounts]
      summary: SAML service provider metadata
      description: |
        Public: give this URL (or the document) to the identity provider. It
        declares the entity ID, the assertion consumer service (HTTP-POST) and
        that assertions must be signed. The sign-in itself goes through
        `/api/auth/saml/start` (redirect to the identity provider),
        `/api/auth/saml/acs` (the provider's HTTP-POST response) and
        `/api/auth/saml/complete`: browser navigations, not API calls.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: SAML 2.0 metadata.
          content:
            application/samlmetadata+xml:
              schema: { type: string }

  /api/auth/saml/config:
    get:
      operationId: getSamlConfig
      tags: [Accounts]
      summary: SAML single sign-on settings
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The stored settings, with the addresses to declare at the identity provider.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamlConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putSamlConfig
      tags: [Accounts]
      summary: Store SAML single sign-on settings
      description: |
        Absent fields take their default. When `enabled`, the identity provider
        entity ID, sign-in URL and at least one signing certificate are required:
        unsigned assertions are always refused.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SamlConfigUpdate" }
      responses:
        "200":
          description: The new settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamlConfig" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/saml/metadata/import:
    post:
      operationId: importSamlMetadata
      tags: [Accounts]
      summary: Read identity provider metadata
      description: Extracts the entity ID, the sign-in URL and the signing certificates. Nothing is stored.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SamlMetadataImportRequest" }
      responses:
        "200":
          description: The values to put in the settings form.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamlMetadataImport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/scim:
    get:
      operationId: getScimSettings
      tags: [Accounts]
      summary: SCIM provisioning settings
      description: >-
        Administrator session only. Says whether SCIM provisioning is on, the
        base URL to give the identity provider, whether a token exists (never
        the token itself) and the role given to the accounts SCIM creates.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putScimSettings
      tags: [Accounts]
      summary: Turn SCIM provisioning on or off
      description: >-
        `default_role` is `viewer`, `operator` or `wall` (wall displays): SCIM
        never creates an administrator. An absent `default_role` keeps the current one.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
                default_role: { type: string, enum: [viewer, operator, wall] }
      responses:
        "200":
          description: The new settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScimSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/auth/scim/token:
    post:
      operationId: createScimToken
      tags: [Accounts]
      summary: Generate the SCIM token
      description: >-
        Generates a new bearer token for the identity provider and returns it
        in `token`, this once only. The previous token stops working at once.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The settings, with the new token in clear.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ScimSettings" }
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: "`dmscim_…`, shown once." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteScimToken
      tags: [Accounts]
      summary: Revoke the SCIM token
      description: Every SCIM request is refused until a new token is generated.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/scim/v2/ServiceProviderConfig:
    get:
      operationId: scimServiceProviderConfig
      tags: [SCIM]
      summary: SCIM service provider configuration
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/ResourceTypes:
    get:
      operationId: scimResourceTypes
      tags: [SCIM]
      summary: SCIM resource types (User, Group)
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "200": { $ref: "#/components/responses/ScimList" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Schemas:
    get:
      operationId: scimSchemas
      tags: [SCIM]
      summary: SCIM schemas (User, Group)
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "200": { $ref: "#/components/responses/ScimList" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Users:
    get:
      operationId: scimListUsers
      tags: [SCIM]
      summary: List provisioned accounts
      description: >-
        Only the accounts SCIM created or linked. `filter` understands `eq`
        comparisons joined by `and` on `id`, `userName`, `externalId`,
        `displayName`, `active`, `emails` and `emails[type eq "work"].value`;
        anything else is `400 invalidFilter`.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      parameters:
        - { $ref: "#/components/parameters/ScimFilter" }
        - { $ref: "#/components/parameters/ScimStartIndex" }
        - { $ref: "#/components/parameters/ScimCount" }
        - { $ref: "#/components/parameters/ScimExcludedAttributes" }
      responses:
        "200": { $ref: "#/components/responses/ScimList" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
    post:
      operationId: scimCreateUser
      tags: [SCIM]
      summary: Provision an account
      description: >-
        Creates the account with the `default_role` setting (never admin), or
        links the existing account with the same `userName` when it is not an
        administrator and not already provisioned (`409 uniqueness` otherwise).
        A `password` is never read: the account signs in through SSO.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimResource" }
      responses:
        "201": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "409": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Users/{id}:
    parameters:
      - { $ref: "#/components/parameters/ScimId" }
    get:
      operationId: scimGetUser
      tags: [SCIM]
      summary: A provisioned account
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
    put:
      operationId: scimReplaceUser
      tags: [SCIM]
      summary: Replace a provisioned account
      description: Refused (`403`) on an administrator.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimResource" }
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
        "409": { $ref: "#/components/responses/ScimError" }
    patch:
      operationId: scimPatchUser
      tags: [SCIM]
      summary: Update a provisioned account
      description: >-
        `add`, `replace` and `remove`, in any case, with or without `path`.
        `active: false` (or `"False"`) disables the account and closes its
        sessions; `true` only re-enables an account SCIM disabled. Attributes
        DumbMonit does not keep are ignored. Refused (`403`) on an administrator.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimPatch" }
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
    delete:
      operationId: scimDeleteUser
      tags: [SCIM]
      summary: Delete a provisioned account
      description: The account, its sessions and its API tokens go. Refused (`403`) on an administrator.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "204": { description: Account deleted. }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Groups:
    get:
      operationId: scimListGroups
      tags: [SCIM]
      summary: List provisioned teams
      description: >-
        Only the teams SCIM created or linked. `filter` understands `eq`
        comparisons joined by `and` on `id`, `displayName`, `externalId` and
        `members`. `excludedAttributes=members` leaves the members out.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      parameters:
        - { $ref: "#/components/parameters/ScimFilter" }
        - { $ref: "#/components/parameters/ScimStartIndex" }
        - { $ref: "#/components/parameters/ScimCount" }
        - { $ref: "#/components/parameters/ScimExcludedAttributes" }
      responses:
        "200": { $ref: "#/components/responses/ScimList" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
    post:
      operationId: scimCreateGroup
      tags: [SCIM]
      summary: Provision a team
      description: >-
        Creates the team, or links the existing team with the same name when no
        provider manages it yet. Folder rights stay the administrator's: a new
        team sees nothing until it is given some.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimResource" }
      responses:
        "201": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "409": { $ref: "#/components/responses/ScimError" }

  /api/scim/v2/Groups/{id}:
    parameters:
      - { $ref: "#/components/parameters/ScimId" }
    get:
      operationId: scimGetGroup
      tags: [SCIM]
      summary: A provisioned team
      security: [{ scimBearer: [] }]
      x-token-scope: none
      parameters:
        - { $ref: "#/components/parameters/ScimExcludedAttributes" }
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
    put:
      operationId: scimReplaceGroup
      tags: [SCIM]
      summary: Replace a provisioned team
      description: >-
        With `members`, the members SCIM added follow the list; members added by
        an administrator always stay. A linked team keeps its name.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimResource" }
      responses:
        "200": { $ref: "#/components/responses/ScimResource" }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
        "409": { $ref: "#/components/responses/ScimError" }
    patch:
      operationId: scimPatchGroup
      tags: [SCIM]
      summary: Update a provisioned team
      description: >-
        `members` add, remove and replace, `members[value eq "…"]` remove,
        `displayName` and `externalId`.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      requestBody: { $ref: "#/components/requestBodies/ScimPatch" }
      responses:
        "204": { description: Team updated. }
        "400": { $ref: "#/components/responses/ScimError" }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }
    delete:
      operationId: scimDeleteGroup
      tags: [SCIM]
      summary: Delete a provisioned team
      description: >-
        Deletes the team when SCIM created it; otherwise only removes the members
        SCIM added and unlinks it.
      security: [{ scimBearer: [] }]
      x-token-scope: none
      responses:
        "204": { description: Team deleted or unlinked. }
        "401": { $ref: "#/components/responses/ScimError" }
        "403": { $ref: "#/components/responses/ScimError" }
        "404": { $ref: "#/components/responses/ScimError" }

  /api/users:
    get:
      operationId: listUsers
      tags: [Accounts]
      summary: Every account
      description: Administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createUser
      tags: [Accounts]
      summary: Create an account
      description: "`password` may be omitted only when SSO is enabled."
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateUser
      tags: [Accounts]
      summary: Update an account
      description: An omitted field keeps its value. The last administrator can be neither demoted nor disabled.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserUpdate" }
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteUser
      tags: [Accounts]
      summary: Delete an account
      description: Not yourself, not the last administrator. The account's API tokens are revoked.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Account deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/roles:
    get:
      operationId: listCustomRoles
      tags: [Accounts]
      summary: Custom roles
      description: Administrator session only. `users` counts the accounts that have the role.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Custom roles, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CustomRole" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createCustomRole
      tags: [Accounts]
      summary: Create a custom role
      description: >-
        Administrator session only. `permissions` are names from
        `GET /api/roles/permissions`; `view` is always added. Managing accounts,
        roles, teams, tokens, single sign-on, backups and instance settings
        cannot be delegated.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRoleInput" }
      responses:
        "201":
          description: Role created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/roles/permissions:
    get:
      operationId: listPermissions
      tags: [Accounts]
      summary: The permission catalog
      description: >-
        Administrator session only. The fixed set of permissions a custom role
        can hold, with the API routes each one opens (beyond what a viewer
        reads). Operations opened by a permission carry `x-permissions` in this
        specification.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The catalog, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PermissionInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/roles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateCustomRole
      tags: [Accounts]
      summary: Replace a custom role
      description: Administrator session only. Applies at once to every account that has the role.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomRoleInput" }
      responses:
        "200":
          description: The role.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomRole" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteCustomRole
      tags: [Accounts]
      summary: Delete a custom role
      description: Administrator session only. Refused (409) while an account still has the role.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Role deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/teams:
    get:
      operationId: listTeams
