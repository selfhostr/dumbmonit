    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: confirmRemediationPolicy
      tags: [Remediation]
      summary: Second step of arming a policy
      description: The code is consumed whether it matches or not. Audited.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
