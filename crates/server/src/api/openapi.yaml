      tags: [Integrations]
      summary: Synology — Active Backup for Business tasks and protected devices
      x-token-scope: read
      responses:
        "200":
          description: Tasks and per-device reports.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SynologyActiveBackup" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/forecasts:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getTargetForecasts
      tags: [Alerts]
      summary: Fill-up forecasts — disks, datastores, pools, volumes, licences
      description: >-
        One entry per capacity entity of the device (every family of the
        capacity catalogue: agent filesystems, Proxmox and PBS datastores,
        TrueNAS/Synology/QNAP/Unraid/Ceph pools and volumes, Microsoft 365
        licences, UPS battery runtime…). The growth is a Theil–Sen fit over the
        last days (7 by default), restarted after the last lasting drop (cleanup,
        expansion, quota reset), so gaps and steps do not skew it. Uses the
        settings of the built-in `capacity_forecast` rule; `severity` is what
        that rule would raise today. Sorted by `days_to_full`, soonest first.
      x-token-scope: read
      responses:
        "200":
          description: Forecasts, soonest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CapacityForecast" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/targets/{id}/luns:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getTargetLuns
      tags: [Integrations]
      summary: iSCSI LUNs (Synology) or zvols (TrueNAS) of a NAS, and what uses them
      description: >-
        One entry per LUN or zvol, read from the last probe: provisioning
        (`thick`, `thin`, `unknown`), size, what it takes on its volume, the
        written share of a thin LUN, the iSCSI targets and connected initiators.
        A thick LUN is opaque from the NAS: `consumer` gives the monitor that
        uses it (a manual link, or an automatic match on name and size when it
        is unambiguous) and that monitor's own fill level. For a Synology, the
        volumes that host LUNs come with their effective usage (without
        thick reservations) and their thin over-allocation.
      x-token-scope: read
      responses:
        "200":
          description: LUNs and the volumes hosting them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetLuns" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/luns/{lun}/consumer:
    parameters:
      - $ref: "#/components/parameters/TargetId"
      - name: lun
        in: path
        required: true
        description: The `id` of the LUN (DSM UUID, zvol name), URL-encoded.
        schema: { type: string }
    put:
      operationId: linkLunConsumer
      tags: [Integrations]
      summary: Say which monitor uses a LUN
      description: >-
        Manual link "this LUN is entity X of monitor Y". `family` and `entity`
        name a capacity entity as `GET /api/targets/{id}/forecasts` returns it
        (for example `vsphere_datastore` and `datastore1`, or `filesystem` and
        `/srv`). Replaces any previous link of the LUN. Saved in backups.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, family, entity]
              properties:
                target_id: { type: integer, format: int64, description: The consuming monitor. }
                family: { type: string, examples: [vsphere_datastore, filesystem, proxmox_storage] }
                entity: { type: string, examples: [datastore1, /srv] }
      responses:
        "204": { description: Link saved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unlinkLunConsumer
      tags: [Integrations]
      summary: Remove the manual link of a LUN
      x-token-scope: write
      responses:
        "204": { description: Link removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- sécurité
  /api/targets/{id}/security:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getTargetSecurity
      tags: [Security]
      summary: Security score, grade and checks of one device
      description: >-
        Checks are evaluated on the last values the collectors recorded (6 h
        lookback). `unknown` checks are listed but excluded from the score. A
        device kind without checks answers `supported: false`. While the score
        is turned off (`/api/security/settings`), answers `enabled: false` and
        nothing else, without querying the time-series database.
      x-token-scope: read
      responses:
        "200":
          description: The device's security report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecurityReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/security/ports:
    get:
      operationId: getNetworkPorts
      tags: [Security]
      summary: Network ports to open in the firewall (admin only)
      description: >-
        Computed from the real configuration, not a fixed list: the web port
        (HTTPS only), the agent channel, syslog (UDP and TCP), SNMP traps, the
        embedded storage processes when they listen outside the loopback
        interface, and the gateway of each relay. A disabled listener is
        `off` (nothing to open), one bound to the loopback interface is
        `local`. `compose` and `ufw` are ready-to-copy blocks for the ports
        that are listening on this host and safe to open.
      x-token-scope: read
      responses:
        "200":
          description: The ports and the two copyable blocks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortsView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/https:
    get:
      operationId: getHttps
      tags: [Security]
      summary: HTTPS of the web port and what still travels in clear (admin only)
      description: >-
        The certificate served on the web port (provided or self-signed, its
        SHA-256 fingerprint and public-key pin), and every connection the
        server makes or accepts in clear or without certificate checks. The web
        port only serves HTTPS: plain-HTTP requests get a 308 to `https://` and
        nothing else. Session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: HTTPS state and the cleartext report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HttpsView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/https/certificate.pem:
    get:
      operationId: getHttpsCertificate
      tags: [Security]
      summary: The certificate served on the web port, in PEM (admin only)
      description: To trust it on a workstation, or compare it. Session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: PEM certificate.
          content:
            application/x-pem-file:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/security/summary:
    get:
      operationId: getSecuritySummary
      tags: [Security]
      summary: Security score of every rated device, worst first
      description: "While the score is turned off, answers `enabled: false` and no device."
      x-token-scope: read
      responses:
        "200":
          description: One row per enabled device whose kind has checks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/threats:
    get:
      operationId: getSecurityThreats
      tags: [Security]
      summary: Threat map, by country, every source together
      description: >-
        Attacks stopped, counted by country of origin: CrowdSec alerts of the
        last 24 hours (`source.cn`, needs a machine login on the CrowdSec
        monitor), inbound connections blocked by the OPNsense live map (its
        15-minute window, only while someone watches it) and Cloudflare threats
        by country (traffic analytics). Countries only: no address is ever read,
        stored or returned. A team-restricted account sees its own devices'
        sources only.
      x-token-scope: read
      parameters:
        - name: target
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Only the sources of this device (the CrowdSec panel).
      responses:
        "200":
          description: Countries, busiest first, and the sources that feed the map.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ThreatMap" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/security/settings:
    get:
      operationId: getSecuritySettings
      tags: [Security]
      summary: Is the security score turned on
      description: Off by default on a new installation.
      x-token-scope: read
      responses:
        "200":
          description: The current setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setSecuritySettings
      tags: [Security]
      summary: Turn the security score on or off
      description: >-
        Off: no periodic computation, no `dumbmonit_security_score` series, and
        the security reads answer `enabled: false`. Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecuritySettings" }
      responses:
        "200":
          description: The new setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves:
    get:
      operationId: listCves
      tags: [Security]
      summary: Known vulnerabilities (CVE) of the software inventory
      description: >-
        One row per device, component and CVE, read from the last scan (never
        from the sources directly). Exploited ones (CISA KEV) first, then
        vulnerable, to check (`unknown`) and patched, highest CVSS first.
        Ignored rows are included with `ignored: true` unless `ignored=false`.
      x-token-scope: read
      parameters:
        - { name: target, in: query, schema: { type: integer } }
        - { name: severity, in: query, schema: { $ref: "#/components/schemas/CveSeverity" } }
        - { name: state, in: query, schema: { $ref: "#/components/schemas/CveState" } }
        - { name: exploited, in: query, schema: { type: boolean } }
        - { name: ignored, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: The findings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves/summary:
    get:
      operationId: getCveSummary
      tags: [Security]
      summary: Vulnerability counts and source status
      description: "`target` narrows the counts to one device."
      x-token-scope: read
      parameters:
        - { name: target, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Counts, inventory size and the state of each source.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveSummary" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves/inventory:
    get:
      operationId: getCveInventory
      tags: [Security]
      summary: Inventoried software components and where their CVEs come from
      x-token-scope: read
      parameters:
        - { name: target, in: query, schema: { type: integer } }
      responses:
        "200":
          description: One row per device and component.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveInventory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves/settings:
    get:
      operationId: getCveSettings
      tags: [Security]
      summary: Is the CVE scan turned on
      description: >-
        Off by default: while off, nothing is sent to NVD, OSV.dev, the Debian
        security tracker or CISA. The NVD API key is never returned.
      x-token-scope: read
      responses:
        "200":
          description: The current setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setCveSettings
      tags: [Security]
      summary: Turn the CVE scan on or off, set the NVD API key
      description: >-
        `nvd_api_key` omitted keeps the stored key, an empty string clears it.
        Turning the scan on starts a first scan. Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CveSettingsInput" }
      responses:
        "200":
          description: The new setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CveSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves/refresh:
    post:
      operationId: refreshCves
      tags: [Security]
      summary: Re-read every source and recompute the verdicts now
      description: Runs in the background; poll the summary for `refreshing`. Administrators only.
      x-token-scope: write
      responses:
        "202":
          description: The refresh is queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  refreshing: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/security/cves/targets:
    post:
      operationId: setCveScanTargets
      tags: [Security]
      summary: Turn the CVE check on or off for several devices
      description: >-
        A device whose check is off is no longer inventoried, and its results
        disappear from the list, the summary and the alerts; they come back when
        the check is turned on again. Unknown ids are ignored, repeated ids count
        once. At most 500 ids per request. Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_ids, enabled]
              properties:
                target_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: integer, format: int64 }
                enabled: { type: boolean }
      responses:
        "200":
          description: How many devices actually changed (those already in the requested state do not count).
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/security/cves/ignores:
    post:
      operationId: ignoreCve
      tags: [Security]
      summary: Accept the risk of one CVE on one device
      description: >-
        The CVE is no longer counted nor alerted on for this device; it stays
        listed with `ignored: true`. Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, cve_id]
              properties:
                target_id: { type: integer }
                cve_id: { type: string, examples: [CVE-2024-6387] }
                note: { type: string, maxLength: 500 }
      responses:
        "204": { description: Ignored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/security/cves/ignores/{target_id}/{cve_id}:
    parameters:
      - { name: target_id, in: path, required: true, schema: { type: integer } }
      - { name: cve_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: unignoreCve
      tags: [Security]
      summary: Stop ignoring a CVE on a device
      x-token-scope: write
      responses:
        "204": { description: Counted and alerted on again. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------------------- assistants
  /api/mcp:
    get:
      operationId: describeMcpEndpoint
      tags: [Assistants]
      summary: Explains the MCP endpoint (405)
      description: There is no server-sent stream; the body only says what this endpoint is.
      security: []
      x-token-scope: public
      responses:
        "405":
          description: Method not allowed; `Allow` names `POST`.
          headers:
            Allow:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpEndpointInfo" }
    delete:
      operationId: deleteMcpSession
      tags: [Assistants]
      summary: Session termination is not supported (405)
      description: The server is stateless and issues no `Mcp-Session-Id`, so there is nothing to terminate.
      security: []
      x-token-scope: public
      responses:
        "405":
          description: Method not allowed; `Allow` names `POST`.
          headers:
            Allow:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/McpEndpointInfo" }
    post:
      operationId: callMcp
      tags: [Assistants]
      summary: Model Context Protocol server (Streamable HTTP, JSON-RPC 2.0)
      description: |
        One JSON-RPC 2.0 request or notification per `POST`, answered in
        `application/json` (no SSE stream, no session).

        Protocol revisions:

        - **2026-07-28** (stateless): every request carries
          `params._meta["io.modelcontextprotocol/protocolVersion"]` and
          `clientCapabilities`, plus the `MCP-Protocol-Version`, `Mcp-Method`
          and (for `tools/call`) `Mcp-Name` headers, which must match the body
          (`400` with error `-32020` otherwise). `server/discover` lists the
          supported versions; an unsupported one gets `400` with error
          `-32022`; an unknown method `404` with `-32601`.
        - **2025-11-25**, **2025-06-18**, **2025-03-26**: the `initialize`
          handshake, then `tools/list` and `tools/call`; `ping` is answered.

        A notification is acknowledged with `202` and no body. The API token's
        scope applies tool by tool: a `read` token can call every read tool and
        gets an explanatory tool error (`isError: true`) from a write tool. The
        28 tools are documented at
        <https://dumbmonit.selfhostr.io/docs/using/assistant/>.
      x-token-scope: read
      parameters:
        - name: MCP-Protocol-Version
          in: header
          schema: { type: string, examples: ["2026-07-28"] }
        - name: Mcp-Method
          in: header
          schema: { type: string }
        - name: Mcp-Name
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JsonRpcRequest" }
            example:
              jsonrpc: "2.0"
              id: 1
              method: tools/call
              params:
                name: get_status
                arguments: {}
                _meta:
                  io.modelcontextprotocol/protocolVersion: "2026-07-28"
                  io.modelcontextprotocol/clientCapabilities: {}
      responses:
        "200":
          description: A JSON-RPC response (result or error).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "202": { description: 'Notification accepted, no body.' }
        "400":
          description: Malformed request, header mismatch or unsupported protocol version (JSON-RPC error body).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Unknown method on a 2026-07-28 request (JSON-RPC error `-32601`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonRpcResponse" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ------------------------------------------- compatibilité Prometheus (hors /api)
  /metrics:
    get:
      operationId: getInstanceMetrics
      tags: [Prometheus compatibility]
      summary: Health of the instance itself, Prometheus text format
      description: >-
        Scheduler, probes, writes, alerting, notifications, agents, database,
        VictoriaMetrics — a few dozen series, never one per device. Public when
        `DUMBMONIT_METRICS_PUBLIC=true`.
      x-token-scope: read
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /federate:
    get:
      operationId: federateMetrics
      tags: [Prometheus compatibility]
      summary: The measurements, Prometheus text format
      description: >-
        `400` beyond 8 MiB, with what to narrow. Public when
        `DUMBMONIT_METRICS_PUBLIC=true`.
      x-token-scope: read
      parameters:
        - name: match[]
          in: query
          description: Series selector (repeatable, 10 at most; `{__name__=~"dumbmonit_.*"}` by default).
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: max_lookback
          in: query
          description: Window the last point is looked for in (`5m` by default).
          schema: { type: string }
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /prometheus/api/v1/{route}:
    parameters:
      - name: route
        in: path
        required: true
        description: >-
          One of `query`, `query_range`, `query_exemplars`, `series`, `labels`,
          `label/{name}/values`, `metadata`, `status/buildinfo`; anything else is
          `404`. Lets Grafana use `https://…/prometheus` as a Prometheus data source.
        schema: { type: string }
    get:
      operationId: prometheusApiGet
      tags: [Prometheus compatibility]
      summary: Read half of the Prometheus HTTP API, relayed to the store
      description: Public when `DUMBMONIT_METRICS_PUBLIC=true`.
      x-token-scope: read
      responses:
        "200":
          description: The Prometheus API response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: prometheusApiPost
      tags: [Prometheus compatibility]
      summary: Same as the GET, with form-encoded parameters
      description: Read-only despite the method, hence the `read` scope.
      x-token-scope: read
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: The Prometheus API response.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/otlp/v1/metrics:
    post:
      operationId: receiveOtlpMetrics
      tags: [OpenTelemetry]
      summary: Receive OpenTelemetry metrics
      description: >-
        OTLP/HTTP `ExportMetricsServiceRequest`, protobuf or JSON, optionally gzip (8 MiB, 32 MiB decompressed). Gauges, cumulative sums and histograms become `dumbmonit_*` series under the target. Delta temporality, exponential histograms and out-of-range timestamps are refused point by point and counted in `partialSuccess.rejectedDataPoints`.
      x-token-scope: write
      parameters:
        - name: X-DumbMonit-Target
          in: header
          description: Id of the target the data is written under (or the `target` query parameter).
          schema: { type: integer }
        - name: target
          in: query
          description: Same as the header, for exporters that cannot set one.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted; `partialSuccess` states what was not stored.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: Neither protobuf nor JSON, or an unsupported `Content-Encoding`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/otlp/v1/logs:
    post:
      operationId: receiveOtlpLogs
      tags: [OpenTelemetry]
      summary: Receive OpenTelemetry logs
      description: >-
        OTLP/HTTP `ExportLogsServiceRequest`, relayed unchanged to the embedded VictoriaLogs with the field `target`. `503` while log storage is disabled, `502` when VictoriaLogs does not answer.
      x-token-scope: write
      parameters:
        - name: X-DumbMonit-Target
          in: header
          description: Id of the target the data is written under (or the `target` query parameter).
          schema: { type: integer }
        - name: target
          in: query
          description: Same as the header, for exporters that cannot set one.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema: { type: string, format: binary }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Accepted by VictoriaLogs.
          content:
            application/x-protobuf:
              schema: { type: string, format: binary }
            application/json:
              schema: { type: object, additionalProperties: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "415":
          description: Neither protobuf nor JSON, or an unsupported `Content-Encoding`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { description: VictoriaLogs did not answer. }
        "503": { description: Log storage is not enabled. }

  # ---------------------------------------------------------- wall weather
  /api/wall/weather:
    get:
      operationId: getWallWeather
      tags: [Wall weather]
      summary: The wall's place and unit, and the weather there now
      description: >-
        Without a place nothing is asked of anyone and `current` is null. When
        Open-Meteo does not answer, `current` is null too (the wall then shows
        nothing). Cached on the server for at least ten minutes.
      x-token-scope: read
      x-wall: true
      responses:
        "200":
          description: The setting and, when a place is chosen, the weather.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallWeather" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: setWallWeather
      tags: [Wall weather]
      summary: "Choose the place and the unit (`place: null` turns the weather off)"
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                place:
                  oneOf:
                    - { $ref: "#/components/schemas/WallWeatherPlace" }
                    - { type: "null" }
                unit: { type: string, enum: [c, f], default: c }
      responses:
        "200":
          description: The new setting and the weather there.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WallWeather" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/wall/weather/places:
    get:
      operationId: searchWallWeatherPlaces
      tags: [Wall weather]
      summary: Look a city up by name (administrators)
      x-token-scope: read
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 80 } }
        - name: lang
          in: query
          required: false
          description: Language of the place names; only the primary subtag is used (`pt-BR` → `pt`), English otherwise.
          schema: { type: string, example: fr }
      responses:
        "200":
          description: Up to six places.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WallWeatherPlace" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502":
          description: The weather service failed or did not answer; the `error` message says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ---------------------------------------------------------- on-call
  /api/oncall/people:
    get:
      operationId: listOnCallPeople
      tags: [On-call]
      summary: Accounts that can be on call (name and on-call state; login, role and contact count for administrators and the person themselves)
      x-token-scope: read
      responses:
        "200":
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OnCallPerson" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runbooks:
    get:
      operationId: listRunbooks
      tags: [Remediation]
      summary: Every runbook, with its links
      x-token-scope: read
      responses:
        "200":
          description: Runbooks, by title.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Runbook" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRunbook
      tags: [Remediation]
      summary: Create a runbook (admin)
      description: >-
        Markdown text linked to alert rules (by uid), folders or device kinds. The
        interface escapes any HTML: the text is never rendered as markup. Audited.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunbookInput" }
      responses:
        "201":
          description: The runbook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runbook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runbooks/match:
    get:
      operationId: matchRunbooks
      tags: [Remediation]
      summary: Runbooks that apply to a rule and a device
      x-token-scope: read
      parameters:
        - { name: rule_uid, in: query, schema: { type: string } }
        - { name: target_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Matching runbooks.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Runbook" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/runbooks/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getRunbook
      tags: [Remediation]
      summary: One runbook
      x-token-scope: read
      responses:
        "200":
          description: The runbook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runbook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateRunbook
      tags: [Remediation]
      summary: Replace a runbook and its links (admin)
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RunbookInput" }
      responses:
        "200":
          description: The runbook.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runbook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRunbook
      tags: [Remediation]
      summary: Delete a runbook (admin)
      x-token-scope: write
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/remediation/kinds:
    get:
      operationId: listRemediationKinds
      tags: [Remediation]
      summary: The closed catalogue of action kinds and their fields
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Action kinds.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RemediationKind" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/remediation/actions:
    get:
      operationId: listRemediationActions
      tags: [Remediation]
      summary: Defined remediation actions (secrets never returned)
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Actions, by name.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/RemediationAction" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRemediationAction
      tags: [Remediation]
      summary: Define an action (admin)
      description: >-
        `kind` is one of the catalogue (`GET /api/remediation/kinds`); unknown fields are
        refused. No field carries a shell command: a script is named, and only runs if the
        machine declares it in its own actions folder. Audited.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemediationActionInput" }
      responses:
        "201":
          description: The action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemediationAction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/remediation/actions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateRemediationAction
      tags: [Remediation]
      summary: Change an action (admin); disarms every policy that uses it
      description: >-
        Omitting `secrets` keeps them, `{}` clears them. Changing the kind clears them.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
