      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "201":
          description: Team created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/teams/settings:
    put:
      operationId: updateTeamSettings
      tags: [Accounts]
      summary: What accounts without a team can see
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamSettings" }
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeamSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateTeam
      tags: [Accounts]
      summary: Update a team
      description: An omitted field keeps its value. Members added by an identity provider or SCIM are kept.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeamInput" }
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTeam
      tags: [Accounts]
      summary: Delete a team
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Team deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/clients:
    get:
      operationId: listClients
      tags: [Accounts]
      summary: MSP clients, the MSP setting and the accounts in no client
      description: MSP administrator session only.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Clients.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientsOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createClient
      tags: [Accounts]
      summary: Create a client
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "201":
          description: Client created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/clients/settings:
    put:
      operationId: updateMspSettings
      tags: [Accounts]
      summary: Turn MSP mode on or off
      description: >-
        Off, every account sees what its role and teams allow, as before. On,
        a non-admin account only sees the clients it belongs to.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MspSettings" }
      responses:
        "200":
          description: The setting.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MspSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/clients/overview:
    get:
      operationId: getClientsOverview
      tags: [Accounts]
      summary: State of each client, for the MSP overview
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: One entry per client.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClientHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/clients/assignments:
    get:
      operationId: getClientAssignments
      tags: [Accounts]
      summary: The client of every object that has one
      description: >-
        One map per kind (`targets`, `status_pages`, `agent_tokens`,
        `channels`, `rules`, `silences`, `reports`) from object id to client
        id. An object missing from its map is shared by the instance.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The maps.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/clients/assign:
    put:
      operationId: assignToClient
      tags: [Accounts]
      summary: Move objects to a client
      description: >-
        Moving a target takes along what depends on it (children, relayed
        targets, label-managed monitors) and cuts any link left between two
        clients. A status page of a client may only list targets of that
        client; a maintenance window on a target follows the target.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientAssign" }
      responses:
        "204": { description: Moved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateClient
      tags: [Accounts]
      summary: Update a client
      description: An omitted field keeps its value. Members added by an identity provider are kept.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientInput" }
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteClient
      tags: [Accounts]
      summary: Delete an empty client
      description: >-
        Refused while the client has targets, status pages or agent tokens,
        and for the default client. Its channels, rules, maintenance windows
        and report schedules go with it.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Client deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/clients/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getClientLogo
      tags: [Accounts]
      summary: Logo of a client
      description: For the MSP administrator and the members of the client; 404 for anyone else.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: uploadClientLogo
      tags: [Accounts]
      summary: Set the logo of a client
      description: PNG, JPEG or WebP, 256 KiB at most, shown on its reports and status pages.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: "The file in base64, with or without a `data:` prefix." }
      responses:
        "204": { description: Logo stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteClientLogo
      tags: [Accounts]
      summary: Remove the logo of a client
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Logo removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{id}/totp:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: resetUserTotp
      tags: [Accounts]
      summary: Reset another account's second factor
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Second factor removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{id}/sessions:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: signOutUser
      tags: [Accounts]
      summary: Sign an account out everywhere
      description: Administrator session only. For your own account, the session making the request stays open.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Number of sessions closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionsClosed" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/{id}/reset-link:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: createPasswordResetLink
      tags: [Accounts]
      summary: Create a password reset link for an account
      description: >-
        Administrator session only. For an active account with a local
        password (not a wall display: set its password instead). The link is
        emailed to the account's address when `send` is true and an email
        server is configured, and returned in every case, to hand over
        otherwise. A new link replaces the previous one.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                send: { type: boolean, default: true }
      responses:
        "200":
          description: The link, shown once.
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at, emailed]
                properties:
                  url: { type: string }
                  expires_at: { type: string, description: UTC, without suffix. }
                  emailed: { type: boolean }
                  email_error: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/users/invitations:
    get:
      operationId: listInvitations
      tags: [Accounts]
      summary: Open invitations
      description: Administrator session only. Expired ones included (`expired`), to resend or revoke.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: The invitations, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createInvitation
      tags: [Accounts]
      summary: Invite someone by email
      description: >-
        Administrator session only. Any role but `wall`, and teams to join on
        acceptance. Replaces an open invitation of the same address; `409` when
        an account already uses it. The link is emailed when `send` is true and
        an email server is configured, and returned in every case.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { $ref: "#/components/schemas/Role" }
                teams: { type: array, items: { type: integer, format: int64 } }
                send: { type: boolean, default: true }
      responses:
        "201":
          description: The invitation and its link, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationSent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/users/invitations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: revokeInvitation
      tags: [Accounts]
      summary: Revoke an open invitation
      description: Administrator session only. Its link stops working at once.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/users/invitations/{id}/resend:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resendInvitation
      tags: [Accounts]
      summary: Send an invitation again
      description: >-
        Administrator session only. A new link and a new expiry; the previous
        link stops working.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                send: { type: boolean, default: true }
      responses:
        "200":
          description: The invitation and its new link, shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationSent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- jetons d'API
  /api/tokens:
    get:
      operationId: listApiTokens
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            # Session only: a token cannot list tokens.
            curl -sk -c jar -X POST -H "X-Requested-With: DumbMonit" \
              -H "Content-Type: application/json" \
              -d '{"username":"admin","password":"…"}' \
              https://dumbmonit.example:8080/api/auth/login
            curl -sk -b jar https://dumbmonit.example:8080/api/tokens
      tags: [API tokens]
      summary: Every API token, revoked ones included
      description: Admin only. The secret is never listed.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Tokens, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ApiToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createApiToken
      tags: [API tokens]
      summary: Create an API token
      description: >-
        Administrator session only. The response is the only time the secret is
        shown. The token is tied to the account that creates it.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenCreate" }
            example:
              name: Grafana
              scope: read
              expires_in_days: 90
              allowed_networks: ["192.168.1.0/24"]
      responses:
        "201":
          description: Token created; `secret` is shown once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatedApiToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/tokens/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateApiToken
      tags: [API tokens]
      summary: Rename an API token, change its networks or its expiry
      description: >-
        Administrator session only. An omitted field keeps its value; the secret
        and the scope never change. `expires_in_days` counts from now (1 to 3650),
        `null` makes the token never expire. `404` when unknown or revoked.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiTokenUpdate" }
            example:
              name: Grafana (NAS)
              expires_in_days: 365
              allowed_networks: ["192.168.1.0/24", "10.8.0.5"]
      responses:
        "200":
          description: The token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiToken" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: revokeApiToken
      tags: [API tokens]
      summary: Revoke an API token
      description: Effective immediately. `404` when unknown or already revoked.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Token revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ----------------------------------------------------------- équipements
  /api/collectors:
    get:
      operationId: listDeviceTypes
      tags: [Device types]
      summary: Every device kind this server can monitor
      description: >-
        Drives the "Add device" form: label, examples, accepted credentials,
        setup notice and typed options (stored as `tags[key]` on the device).
        Kinds brought by an integration pack are listed as `pack.<id>`.
      x-token-scope: read
      responses:
        "200":
          description: The catalogue.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/KindDescription" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/discovery:
    post:
      operationId: scanNetwork
      tags: [Discovery]
      summary: Scan a network for SNMP devices
      description: >-
        At most 4096 addresses. A `POST` with a JSON body so that the community
        never appears in a URL or a log line.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryRequest" }
      responses:
        "200":
          description: What answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/discovery/subnets:
    get:
      operationId: localSubnets
      tags: [Discovery]
      summary: Suggested networks for the scan form
      description: >-
        In order, `DUMBMONIT_SCAN_SUBNETS`, /24 networks of the private IPv4
        addresses of monitored devices (most devices first), then the server's
        connected networks (not when the server runs in a container, where they
        are the container's own networks). Docker bridge ranges are excluded; the
        list is empty when nothing reliable is known. Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: Suggested IPv4 networks.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalSubnets" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/jobs:
    get:
      operationId: listDiscoveryJobs
      tags: [Discovery]
      summary: The last discovery scans
      description: >-
        The twenty most recent scans, kept in memory only (lost on restart, by
        design). Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: Recent scans.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: "#/components/schemas/DiscoveryJobSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: startDiscoveryJob
      tags: [Discovery]
      summary: Start a network discovery scan
      description: >-
        Sweeps common ports and SNMP on every address of a network (at most 1024,
        a /22), then fingerprints what answers — without ever authenticating. A
        scan with `agent_id` is run by that relay agent on its own network; an
        agent too old to understand the command fails the job with a clear
        message. The SNMP community is a secret, never logged nor returned.
        Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryJobRequest" }
      responses:
        "202":
          description: The scan has been queued.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A scan is already running for this target.

  /api/discovery/jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getDiscoveryJob
      tags: [Discovery]
      summary: A discovery scan, hosts included
      description: >-
        The hosts fill in as the scan progresses; the UI polls every two seconds.
        Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: The scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: cancelDiscoveryJob
      tags: [Discovery]
      summary: Cancel a discovery scan
      x-token-scope: write
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/schedules:
    get:
      operationId: listNetscanSchedules
      tags: [Discovery]
      summary: Scheduled network scans
      description: >-
        Subnets scanned at a fixed interval, by the server or by a relay agent, with
        the counts of their inventory. Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: The scheduled scans.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules:
                    type: array
                    items: { $ref: "#/components/schemas/NetscanSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createNetscanSchedule
      tags: [Discovery]
      summary: Schedule a network scan
      description: >-
        The first completed scan of a subnet initializes the inventory without
        alerting. At most 1024 addresses (a /22), an interval of 5 minutes to 30
        days, 50 schedules. One schedule per subnet and scanner. Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetscanScheduleInput" }
      responses:
        "201":
          description: The scheduled scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetscanSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/discovery/schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateNetscanSchedule
      tags: [Discovery]
      summary: Change a scheduled network scan
      description: >-
        Changing the subnet or the scanner starts again from an empty inventory.
        Administrators only.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NetscanScheduleInput" }
      responses:
        "200":
          description: The scheduled scan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NetscanSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteNetscanSchedule
      tags: [Discovery]
      summary: Delete a scheduled network scan and its inventory
      x-token-scope: write
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/schedules/{id}/run:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: runNetscanSchedule
      tags: [Discovery]
      summary: Scan now
      description: >-
        Asks for a scan at the next cycle of the scheduler (a few seconds) without
        waiting for the interval. Ignored while a scan of this subnet is running.
        Administrators only.
      x-token-scope: write
      responses:
        "202": { description: Requested. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/inventory:
    get:
      operationId: getNetscanInventory
      tags: [Discovery]
      summary: Known devices and open ports
      description: >-
        The inventory built by the scheduled scans, unknown devices first. An unknown
        device or port stays reported (see the `netscan_new_device` and
        `netscan_new_port` alert rules) until it is marked as known. A new device that
        takes the address of a known device under another MAC address carries
        `mac_change_from` (spoofing or replaced hardware; `netscan_mac_change` alert
        rule) until it is marked as known or ignored. Administrators only.
      x-token-scope: read
      parameters:
        - name: schedule_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Only the inventory of this scheduled scan.
      responses:
        "200":
          description: The inventory.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items: { $ref: "#/components/schemas/NetscanDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/inventory/known:
    post:
      operationId: markAllNetscanKnown
      tags: [Discovery]
      summary: Mark every unknown device and port as known
      x-token-scope: write
      parameters:
        - name: schedule_id
          in: query
          required: false
          schema: { type: integer, format: int64 }
          description: Only the inventory of this scheduled scan.
      responses:
        "200":
          description: How many items were unknown.
          content:
            application/json:
              schema:
                type: object
                required: [marked]
                properties:
                  marked: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/inventory/bulk:
    post:
      operationId: bulkNetscanDevices
      tags: [Discovery]
      summary: Add, ignore or restore several discovered devices at once
      description: >-
        `add` creates one monitor per device with the type the detection proposed
        (a device with no detected type is an `error`; one whose type needs
        credentials is created paused, outcome `pending_credentials`, tagged
        `pending=credentials`). `ignore` takes the devices out of the review list for
        good; `restore` puts them back. Each device is handled on its own: one failure
        never cancels the others. At most 200 devices per call. Needs edit rights, like
        creating a monitor.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, device_ids]
              properties:
                action: { type: string, enum: [add, ignore, restore] }
                device_ids:
                  type: array
                  maxItems: 200
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: One result per device, in request order (repeated ids are handled once).
          content:
            application/json:
              schema:
                type: object
                required: [results, added, pending_credentials, already_present, errors]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [device_id, outcome, target_id, message]
                      properties:
                        device_id: { type: integer, format: int64 }
                        outcome: { type: string, enum: [added, pending_credentials, already_present, ignored, restored, error] }
                        target_id: { type: [integer, "null"], format: int64 }
                        message: { type: [string, "null"] }
                  added: { type: integer }
                  pending_credentials: { type: integer }
                  already_present: { type: integer }
                  errors: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/review:
    get:
      operationId: getNetscanReview
      tags: [Discovery]
      summary: Devices waiting for review
      description: >-
        Devices found by a scan that are neither monitored nor ignored, and whether
        the latest batch of new devices has still to be announced (once per batch).
      x-token-scope: read
      responses:
        "200":
          description: The review queue.
          content:
            application/json:
              schema:
                type: object
                required: [to_review, announce, batch_count, batch]
                properties:
                  to_review: { type: integer }
                  announce: { type: boolean }
                  batch_count: { type: integer }
                  batch: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/review/seen:
    post:
      operationId: markNetscanReviewSeen
      tags: [Discovery]
      summary: Acknowledge the latest batch of new devices
      x-token-scope: write
      responses:
        "204": { description: Acknowledged; the batch is not announced again. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/discovery/inventory/devices/{id}/known:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: markNetscanDeviceKnown
      tags: [Discovery]
      summary: Mark a device, and its ports, as known
      x-token-scope: write
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/inventory/devices/{id}/ignore:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: ignoreNetscanDevice
      tags: [Discovery]
      summary: Ignore a device
      description: >-
        The device and its ports count as known and never alert again (new device,
        MAC change, new port). `markNetscanDeviceKnown` puts it back in the inventory.
      x-token-scope: write
      responses:
        "204": { description: Ignored. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/discovery/inventory/ports/{id}/known:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: markNetscanPortKnown
      tags: [Discovery]
      summary: Mark an open port as known
      x-token-scope: write
      responses:
        "204": { description: Marked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/onboarding:
    get:
      operationId: getOnboarding
      tags: [Onboarding]
      summary: Where the first-run guide stands
      x-token-scope: read
      responses:
        "200":
          description: Guide state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putOnboarding
      tags: [Onboarding]
      summary: Skip the guide or dismiss steps
      description: An omitted field keeps its stored value.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingPatch" }
      responses:
        "200":
          description: Guide state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Onboarding" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/instance:
    get:
      operationId: getInstance
      tags: [Onboarding]
      summary: Whether the setup wizard is done
      description: Public, so the interface knows before sign-in whether to offer the setup wizard. Nothing else about the instance is disclosed here.
      security: []
      x-token-scope: public
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicInstance" }

  /api/instance/effective-config:
    get:
      operationId: getEffectiveConfig
      tags: [Onboarding]
      summary: The effective configuration, without secrets
      description: >-
        Administrator only. What the server runs with: data directory, ports, VictoriaMetrics
        (embedded or external, host only), backup schedule, log filter, and so on. The instance
        secret, passwords, tokens and URL credentials are never listed.
      x-token-scope: read
      responses:
        "200":
          description: One entry per setting.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [key, value]
                  properties:
                    key: { type: string, examples: [data_dir] }
                    value: { type: string }
                    env: { type: [string, "null"], description: The environment variable that sets it. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/instance/settings:
    get:
      operationId: getInstanceSettings
      tags: [Onboarding]
      summary: Instance settings chosen in the setup wizard
      x-token-scope: read
      x-wall: true
      responses:
        "200":
          description: Instance settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putInstanceSettings
      tags: [Onboarding]
      summary: Change the name, language or time zone, or finish the wizard
      description: An omitted field keeps its stored value. The former `product_mode` field is ignored if sent (there is a single interface).
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstancePatch" }
      responses:
        "200":
          description: Instance settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstanceSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets:
    get:
      operationId: listTargets
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -sk -H "Authorization: Bearer $DUMBMONIT_TOKEN" \
              https://dumbmonit.example:8080/api/targets
      tags: [Devices]
      summary: Every device
      x-token-scope: read
      x-wall: true
      responses:
        "200":
          description: Devices.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Target" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createTarget
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -sk -X POST -H "Authorization: Bearer $DUMBMONIT_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"Core switch","address":"192.168.1.10","kind":"snmp","interval_secs":60,"tags":{},"credential":{"type":"snmp_community","community":"public"}}' \
              https://dumbmonit.example:8080/api/targets
      tags: [Devices]
      summary: Add a device
      description: Profile detection starts in the background for SNMP.
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPayload" }
            example:
              name: Core switch
              address: 192.168.1.10
              kind: snmp
              interval_secs: 60
              tags: {}
              credential: { type: snmp_community, community: public }
      responses:
        "201":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/targets/import:
    post:
      operationId: importTargets
      tags: [Devices]
      summary: Import websites from a CSV
      description: >-
        Creates one `website` device per CSV row. Body: `text/csv`, or JSON
        `{"csv": "..."}`. A header row is required; columns are `url`
        (required), `name`, `folder`, `tags` (`k=v;k=v`), `interval`
        (`300`, `5m`, `1h`), `expect_text` and `category` (free text, stored
        as the `category` option). At most 1000 rows. Without `folder`, the
        folder is `Websites/<category>` (the given category, else one guessed
        from the page: E-commerce, Blog, Web app, Showcase), otherwise
        `Websites/<platform>` (platform detected by one GET per site, 4 at a
        time, 10 s each) or `Websites/Other`. Rows
        already monitored are skipped and reported. With `dry_run=true`
        nothing is created and rows come back with status `ok`. Admin only.
      x-token-scope: write
      x-permissions: [monitors.manage]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: { type: string }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/test:
    post:
      operationId: testTargetConnection
      tags: [Devices]
      summary: Probe a device once without saving it
      description: >-
        Reads the identity of an SNMP device once with the submitted address and
        credentials and reports the result; nothing is stored. The device answers
        with its `sysName` / `sysDescr`. A failed probe is a `200` with `ok: false`
        and the probe's message. SNMP only (other kinds are a `400`), and not
        available through a relay.
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetTestRequest" }
      responses:
        "200":
          description: The outcome of the probe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetTestReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/import/kuma:
    post:
      operationId: importKuma
      tags: [Devices]
      summary: Import monitors from an Uptime Kuma backup
      description: >-
        Body: the JSON file exported by Uptime Kuma 1.x (Settings, Backup,
        Export; version 2 has no backup export), at most 4 MiB and 2000
        monitors. `http`, `keyword` and `json-query` monitors become `http`
        devices, `ping` becomes `ping`, `port` becomes `tcp`, `dns` becomes
        `dns`, `push` becomes a `push` heartbeat (with a new URL); groups
        become folders and tags become device tags. Other types, upside-down
        monitors and devices already monitored are skipped with a reason.
        Notifications, credentials, headers and request bodies are never
        imported. With `dry_run=true` nothing is created and rows come back
        with status `ok`. Admin only.
      x-token-scope: write
      x-permissions: [monitors.manage]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: via_agent
          in: query
          schema: { type: integer, format: int64 }
          description: Relay agent that probes the imported monitors (a remote site). Ignored for kinds a relay cannot probe.
        - name: rows
          in: query
          description: >-
            Comma-separated row numbers of the preview to import (the others are
            left out of the answer). Absent: every row.
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitorList]
              properties:
                version: { type: string }
                notificationList: { type: array, items: { type: object } }
                monitorList: { type: array, items: { type: object } }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { description: The file is larger than 4 MiB. }

  /api/targets/import/kuma-db:
    post:
      operationId: importKumaDb
      tags: [Devices]
      summary: Import monitors from an Uptime Kuma database (kuma.db)
      description: >-
        Body: the raw SQLite file `data/kuma.db` of Uptime Kuma 1.x or 2.x
        (`Content-Type: application/octet-stream`), at most 512 MiB. It is
        written to a temporary file, read once in read-only mode (never attached
        to DumbMonit's database) and deleted afterwards. Monitors, groups,
        tags and intervals are mapped exactly as for `/api/targets/import/kuma`;
        notifications, credentials, headers and request bodies are never read
        into DumbMonit. Rows are sorted by device type, folder, then name, and
        numbered in that order, so a preview (`dry_run=true`) and the import of
        the same file agree on the numbers given to `rows`. Uptime Kuma 2 on
        MariaDB cannot be read. Admin only.
      x-token-scope: write
      x-permissions: [monitors.manage]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: via_agent
          in: query
          schema: { type: integer, format: int64 }
          description: Relay agent that probes the imported monitors (a remote site). Ignored for kinds a relay cannot probe.
        - name: rows
          in: query
          description: >-
            Comma-separated row numbers of the preview to import (the others are
            left out of the answer). Absent: every row.
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/import/uptimerobot:
    post:
      operationId: importUptimeRobot
      tags: [Devices]
      summary: Import monitors from UptimeRobot
      description: >-
        Body: `{"api_key"}` (a read-only API key, used once to call UptimeRobot's
        `getMonitors` and never stored) or `{"csv"}` (the export of the
        dashboard, columns recognised by title: Friendly Name, URL / IP, Type,
        Port, Interval, Keyword). HTTP(s) and keyword monitors become `http`
        devices, ping becomes `ping`, port becomes `tcp`, heartbeat becomes a
        `push` heartbeat (with a new URL). Paused monitors stay paused.
        Contacts, credentials, headers and request bodies are never imported.
        Same preview / `rows` contract as `/api/targets/import/kuma`, at most 2000
        monitors. Admin only.
      x-token-scope: write
      x-permissions: [monitors.manage]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: via_agent
          in: query
          schema: { type: integer, format: int64 }
          description: Relay agent that probes the imported monitors (a remote site). Ignored for kinds a relay cannot probe.
        - name: rows
          in: query
          description: >-
            Comma-separated row numbers of the preview to import. Absent: every row.
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                api_key: { type: string, description: A read-only UptimeRobot API key. }
                csv: { type: string, description: The CSV exported from the dashboard. }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: UptimeRobot is unreachable or answered with an error. }

  /api/targets/import/gatus:
    post:
      operationId: importGatus
      tags: [Devices]
      summary: Import endpoints from a Gatus configuration
      description: >-
        Body: `{"yaml"}`, the content of Gatus's `config.yaml`. `endpoints` with an
        `http(s)://` URL become `http` devices (status and `[BODY].path`
        conditions are kept as options, the others are listed in the row's
        message), `tcp://` becomes `tcp`, `icmp://` becomes `ping`, endpoints with
        a `dns:` block become `dns`; `external-endpoints` become `push`
        heartbeats (with a new URL). `group` becomes the folder. Headers, bodies
        and alert settings are never imported. Same preview / `rows` contract as
        `/api/targets/import/kuma`. Admin only.
      x-token-scope: write
      x-permissions: [monitors.manage]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: via_agent
          in: query
          schema: { type: integer, format: int64 }
          description: Relay agent that probes the imported monitors (a remote site). Ignored for kinds a relay cannot probe.
        - name: rows
          in: query
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [yaml]
              properties:
                yaml: { type: string }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/import/healthchecks:
    post:
      operationId: importHealthchecks
      tags: [Devices]
      summary: Import checks from Healthchecks.io
      description: >-
        Body: `{"api_key", "base_url"?}`. The key is used once against
        `GET /api/v3/checks/` of healthchecks.io (or of the self-hosted
        `base_url`, which goes through the same outbound guard as notification
        channels) and is never stored. Each check becomes a `push` heartbeat whose
        expected interval is the check's `timeout` (or an approximation of its
        cron `schedule`) and whose grace time is kept; tags become device tags.
        The monitor gets a new push URL: the row's message recalls the old ping
        URL (visible with a read-write key) so the job can be updated or the old
        address redirected. Same preview / `rows` contract as
        `/api/targets/import/kuma`. Admin only.
      x-token-scope: write
      x-permissions: [monitors.manage]
      parameters:
        - name: dry_run
          in: query
          schema: { type: boolean, default: false }
        - name: via_agent
          in: query
          schema: { type: integer, format: int64 }
          description: Relay agent that probes the imported monitors (a remote site). Ignored for kinds a relay cannot probe.
        - name: rows
          in: query
          schema: { type: string, example: "1,4,5" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key]
              properties:
                api_key: { type: string }
                base_url: { type: string, description: "Self-hosted server, e.g. `https://healthchecks.example.org`. Default: healthchecks.io." }
      responses:
        "200":
          description: Preview (dry run).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "201":
          description: Import done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KumaImportReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "502": { description: Healthchecks is unreachable or answered with an error. }

  /api/targets/{id}/release:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: releaseManagedTarget
      tags: [Devices]
      summary: Release a monitor managed by Docker labels
      description: >-
        Hands a monitor created from `dumbmonit.*` container labels back to
        manual management: it stops following the labels and can be edited and
        deleted. Until then, `PUT` (other than pausing) and `DELETE` answer `409`.
        Admin only.
      x-token-scope: write
      x-permissions: [monitors.manage]
      responses:
        "204": { description: Released. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/summary:
    get:
      operationId: getSummary
      tags: [Devices]
      summary: Flat status counters for dashboards (Homepage, Homarr…)
      description: >-
        Compact counters in a shape that Homepage's `customapi` widget reads by
        path (`devices.down`, `alerts.firing`): the same figures as the MCP
        `get_status` tool. A `read` API token is enough.
      x-token-scope: read
      responses:
        "200":
          description: Counters and an overall verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/overview/widgets:
    get:
      operationId: getOverviewWidgets
      tags: [Devices]
      summary: Figures of the overview dashboards
      description: >-
        Everything the Command, NOC and Hybrid overview dashboards add to the
        existing routes, in one read: monitors grouped by site (the relay that
        reaches them, or this instance) with their status and category, the
        top five CPU, memory, disk (with days until full) and network
        consumers, backup jobs, service checks with their last 36 results,
        30 days of alert statistics (MTTA, MTTR, noisiest rule), agents and
        relays, the latest events, fleet availability per day and alerts
        opened per day. Each part degrades on its own: when VictoriaMetrics
        does not answer, the metric parts are empty lists and the rest is
        still served. A team-restricted account only sees its own monitors.
        Timestamps are UTC without suffix.
      x-token-scope: read
      parameters:
        - name: range
          in: query
          description: Window of the sparklines, p95 and top series. 24h by default.
          schema: { type: string, enum: [1h, 24h, 7d, 30d] }
      responses:
        "200":
          description: The dashboard figures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverviewWidgets" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/reorder:
    post:
      operationId: reorderTargets
      tags: [Devices]
      summary: Reorder devices
      description: >-
        Sets the manual rank of each listed device to its index in `order`
        (0, 1, 2…). Devices left out keep their rank: a local reorder (one
        folder, one Up/Down click) does not need to know every other device's
        rank — `/targets` only ever compares rank between devices of the same
        state tier and folder.
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "204": { description: Devices reordered. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/folders/rename:
    post:
      operationId: renameTargetFolder
      tags: [Devices]
      summary: Rename a folder
      description: >-
        Moves every device filed under folder `from` to folder `to`. Status
        pages that ticked the folder follow the new name in the same
        transaction.
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from: { type: string }
                to: { type: string, maxLength: 60 }
      responses:
        "204": { description: Folder renamed. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/targets/bulk:
    patch:
      operationId: bulkUpdateTargets
      tags: [Devices]
      summary: Edit several devices at once
      description: >-
        Applies one change to every listed device: check interval, notification
        channels (`set`, `add` or `remove`), free tags (`add`, `remove`; a key
        that is an option of the device's type is refused when added and left
        alone when removed) and folder (`""`: no folder). Fields left out stay
        as they are. Each device is checked as a single edit would be (it must
        exist and be visible, a team-restricted account needs `manage` on it
        and on the destination folder, a monitor managed by Docker labels or a
        configuration file is refused, a channel of another MSP client is
        refused) and gets its own verdict in `results`. The devices that pass
        are written together in one transaction. A request that changes
        nothing, or an interval, folder name, tag or channel that is invalid
        for every device, is refused as a whole (400).
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, patch]
              properties:
                ids:
                  type: array
                  maxItems: 20000
                  items: { type: integer, format: int64 }
                patch: { $ref: "#/components/schemas/TargetBulkPatch" }
      responses:
        "200":
          description: One verdict per device, in the order of `ids` (a repeated id counts once).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TargetBulkReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/monitor-templates:
    get:
      operationId: listMonitorTemplates
      tags: [Devices]
      summary: Monitor templates
      description: >-
        Saved starting points for the add form: a type, its options and free
        tags without any secret, a check interval and notification channels.
        Never an address or a credential.
      x-token-scope: read
      responses:
        "200":
          description: Every template, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MonitorTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createMonitorTemplate
      tags: [Devices]
      summary: Save a device as a template
      description: >-
        Builds the template from what is stored for `target_id`: its type,
        interval, notification channels and options and tags, leaving out
        every key that names a secret, the HTTP headers, any value carrying a
        password (`https://user:pass@host`) and, of a scenario, everything but
        each step's name, method and URL. An agent cannot be a template.
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, target_id]
              properties:
                name: { type: string, maxLength: 80 }
                target_id: { type: integer, format: int64 }
      responses:
        "201":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/monitor-templates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getMonitorTemplate
      tags: [Devices]
      summary: One monitor template
      x-token-scope: read
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: renameMonitorTemplate
      tags: [Devices]
      summary: Rename a monitor template
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
      responses:
        "200":
          description: The template.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorTemplate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteMonitorTemplate
      tags: [Devices]
      summary: Delete a monitor template
      description: Devices created from it are not affected.
      x-token-scope: write
      x-permissions: [monitors.manage]
      responses:
        "204": { description: Template deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getTarget
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -sk -H "Authorization: Bearer $DUMBMONIT_TOKEN" \
              https://dumbmonit.example:8080/api/targets/12
      tags: [Devices]
      summary: One device
      x-token-scope: read
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateTarget
      tags: [Devices]
      summary: Replace a device
      description: >-
        Omitting `credential` keeps the stored secret; omitting `profile_id` keeps
        the detected profile (`""` clears it); omitting `via_agent` keeps the
        relay (`null` goes back to direct probing). `enabled: false` clears the
        device's alerts without notifying.
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetPayload" }
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Target" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteTarget
      tags: [Devices]
      summary: Delete a device
      description: Clears its alerts without notifying and deletes its time series (best effort).
      x-token-scope: write
      x-permissions: [monitors.manage]
      responses:
        "204": { description: Device deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/targets/{id}/probe-locations:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: getProbeLocations
      tags: [Devices]
      summary: State and latency per probe location
      description: >-
        For a monitor probed from several locations: the last quorum decision and
        each location's last result. A monitor probed from one place returns
        `unknown` with no locations.
      x-token-scope: read
      responses:
        "200":
          description: Quorum decision and locations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeLocationsReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/targets/{id}/probe:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: probeTarget
      tags: [Devices]
      summary: Probe a device now
      description: >-
        Through its relay agent when the device has one (`409` when a probe is
        already in flight, `400 Timed out: relay agent …` when it does not answer).
      x-token-scope: write
      x-permissions: [monitors.manage]
      responses:
        "200":
          description: What was measured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProbeReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/targets/{id}/discover:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    post:
      operationId: rediscoverTarget
      tags: [Devices]
      summary: Re-run profile detection
      x-token-scope: write
      x-permissions: [monitors.manage]
      responses:
        "200":
          description: The detected profile, or `null`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/targets/{id}/rules:
    parameters:
      - $ref: "#/components/parameters/TargetId"
    get:
      operationId: listTargetRules
      tags: [Rules]
      summary: Alert rules that watch a device
      description: >-
        The rules whose query reads a metric the device has written in the last
        24 hours, with whether each is turned off for this device (a rule
        override with `enabled: false`) and firing on it now.
      x-token-scope: read
      responses:
        "200":
          description: The device's rules.
          content:
            application/json:
              schema:
                type: object
                required: [status, rules]
                properties:
                  status:
                    type: string
                    enum: [ok, no_data, unavailable]
                    description: >-
                      `no_data`: nothing written in the last 24 hours;
                      `unavailable`: VictoriaMetrics did not answer.
                  rules:
                    type: array
                    items:
                      type: object
                      required: [id, uid, name, description, severity, enabled, ignored, custom_threshold, firing]
                      properties:
                        id: { type: integer, format: int64 }
                        uid: { type: string }
                        name: { type: string }
                        description: { type: string }
                        severity: { type: string, enum: [info, warning, critical] }
                        enabled: { type: boolean, description: Enabled for every device. }
                        ignored: { type: boolean, description: Turned off for this device. }
                        custom_threshold: { type: boolean, description: A threshold is set for this device. }
                        firing: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------------- mesures
  /api/metrics/query:
    get:
      operationId: queryMetrics
      tags: [Metrics]
      summary: Instant MetricsQL query
      description: Each series carries a single `[timestamp, "value"]` pair in `values`.
      x-token-scope: read
      x-wall: true
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
          example: avg by (target, host) (dumbmonit_cpu_usage_percent)
      responses:
        "200":
          description: Series, in the Prometheus shape.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/metrics/query_range:
    get:
      operationId: queryMetricsRange
      tags: [Metrics]
      summary: Range MetricsQL query
      description: >-
        `start` and `end` are milliseconds since the epoch (400 days at most
        between them); `step` is in seconds and is widened so that a series
        never exceeds 2,000 points.
      x-token-scope: read
      x-wall: true
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string }
        - name: start
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: end
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: step
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Series, in the Prometheus shape.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Series" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "502": { $ref: "#/components/responses/BadGateway" }

  # ---------------------------------------------------------------- alertes
  /api/alerts:
    get:
      operationId: listActiveAlerts
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -sk -H "Authorization: Bearer $DUMBMONIT_TOKEN" \
              https://dumbmonit.example:8080/api/alerts
      tags: [Alerts]
      summary: Active alerts
      description: >-
        Pending, firing, suppressed and recently resolved. `phase` is the
        engine's state; `effective_phase` is what to show (`suppressed` when a
        parent device is unreachable, named by `suppressed_by`). Alerts of
        deleted or paused devices are never listed. Dismissed alerts are left
        out unless `dismissed=true`, which lists only them.
      x-token-scope: read
      x-wall: true
      parameters:
        - name: target_id
          in: query
          description: Only the alerts of this device.
          schema: { type: integer }
        - name: dismissed
          in: query
          description: >-
            `true`: only the dismissed alerts that are still active (to restore
            one). Default: dismissed alerts are not listed.
          schema: { type: boolean }
      responses:
        "200":
          description: Alerts.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActiveAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /api/alerts/history:
    get:
      operationId: listAlertHistory
      tags: [Alerts]
      summary: Alert phase transitions
      x-token-scope: read
      parameters:
        - name: since
          in: query
          description: RFC 3339 lower bound; the last seven days by default.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1 }
        - name: dismissed
          in: query
          description: >-
            False (default): entries cleared with the dismiss endpoints below
            are left out. True includes them — nothing is ever destroyed by a
            "clear", only hidden from the active view.
          schema: { type: boolean }
      responses:
        "200":
          description: Transitions, most recent first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AlertHistoryEntry" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/noise:
    get:
      operationId: getAlertNoise
      tags: [Alerts]
      summary: Alert noise report
      description: >-
        Over the last 7, 30 or 90 days of alert history: the noisiest rules
        (firing episodes and notifications), flapping alerts (state changes
        per alert), and the mean time to acknowledge (MTTA) and to resolve
        (MTTR) overall, per rule and per team. An episode is one transition to
        `firing`; its notifications are the firing, reminders, escalations and
        resolution the engine routed to at least one channel. Acknowledging or
        dismissing an alert dates the episode's first reaction. Admin and
        operator accounts only (viewers get 403); a team-restricted account
        sees the episodes of its own devices and the rows of its own teams.
      x-token-scope: read
      parameters:
        - name: days
          in: query
          description: Window, in days. 30 by default.
          schema: { type: integer, enum: [7, 30, 90] }
      responses:
        "200":
          description: The report.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertNoise" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/history/dismiss-resolved:
    post:
      operationId: dismissResolvedAlertHistory
      tags: [Alerts]
      summary: "Clear all resolved history entries"
      description: >-
        Marks every not-yet-cleared `resolved` transition as dismissed: they
        leave the default history view, the rows stay in the database.
      x-token-scope: write
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      responses:
        "200":
          description: How many entries were cleared.
          content:
            application/json:
              schema:
                type: object
                required: [dismissed]
                properties:
                  dismissed: { type: integer, format: int64 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/history/{id}/dismiss:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: dismissAlertHistoryEntry
      tags: [Alerts]
      summary: Clear one resolved history entry
      description: >-
        Only a `resolved` transition can be cleared: an active one still
        needs attention. The row stays in the database, only hidden from the
        default history view.
      x-token-scope: write
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      responses:
        "204": { description: Entry cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/{fingerprint}/ack:
    parameters:
      - name: fingerprint
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acknowledgeAlert
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -sk -X POST -H "Authorization: Bearer $DUMBMONIT_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"duration_secs":14400,"note":"Looking into it"}' \
              https://dumbmonit.example:8080/api/alerts/$FINGERPRINT/ack
      tags: [Alerts]
      summary: Acknowledge an alert
      description: >-
        Reminders and escalations pause until `until` (or for `duration_secs`;
        neither means 4 hours, at most 30 days). `{"until": null}` lifts the
        acknowledgement. The resolution is still notified. Audited.
      x-token-scope: write
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AckRequest" }
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAlert" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: unacknowledgeAlert
      tags: [Alerts]
      summary: Lift an acknowledgement
      x-token-scope: write
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/{fingerprint}/dismiss:
    parameters:
      - name: fingerprint
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: dismissAlert
      tags: [Alerts]
      summary: Dismiss an alert
      description: >-
        "Got it": the current occurrence leaves the active alerts (list,
        overview, wall, counters) and sends nothing more — no reminder, no
        escalation, no resolution — for as long as the condition lasts. Once the
        condition clears, the dismissal ends with it: if it comes back, that is
        a new alert, notified as usual. Its resolution is recorded in the
        history as "dismissed by …". Audited.
      x-token-scope: write
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: undismissAlert
      tags: [Alerts]
      summary: Restore a dismissed alert
      description: Undo a dismissal while the alert is still active. Audited.
      x-token-scope: write
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      responses:
        "200":
          description: The alert.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActiveAlert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/rules:
    get:
      operationId: listRules
      tags: [Rules]
      summary: Every alert rule
      x-token-scope: read
      x-wall: true
      responses:
        "200":
          description: Rules, with their per-device overrides.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createRule
      tags: [Rules]
      summary: Create an alert rule
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RulePayload" }
      responses:
        "201":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/alerts/rules/backtest:
    post:
      operationId: backtestRule
      tags: [Rules]
      summary: Test a rule on history
      description: >-
        Replays the rule as submitted (saved or not, same body as a rule
        creation) over the last 1, 7 or 30 days of stored metrics, at the
        engine's evaluation step, with the engine's own threshold, clear
        threshold and hold-duration logic, and says what it would have done:
        firing periods per series (start, end, peak value), notifications
        (firing, reminders, escalation, resolution — before maintenance
        windows, dependencies and channel policies), and the breaches the hold
        duration absorbed. Nothing is written. The cost is bounded: past
        10,000 steps the step is widened (`coarsened`), past 100 series only
        the ones most often over the threshold are replayed (`truncated`), and
        the metrics read gives up after 20 seconds (502). Anomaly, log
        pattern, forecast, drift and error budget rules cannot be replayed:
        the answer is then `replayable: false` with the reason.
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleBacktestRequest" }
      responses:
        "200":
          description: What the rule would have done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleBacktest" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/BadGateway" }

  /api/alerts/rules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateRule
      tags: [Rules]
      summary: Update an alert rule
      description: A built-in rule keeps its query.
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RulePayload" }
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRule
      tags: [Rules]
      summary: Delete an alert rule
      description: Built-in rules cannot be deleted — disable them instead.
      x-token-scope: write
      x-permissions: [monitors.manage]
      responses:
        "204": { description: Rule deleted. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/rules/{id}/enable:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: setRuleEnabled
      tags: [Rules]
      summary: Enable or disable an alert rule
      x-token-scope: write
      x-permissions: [monitors.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnableRequest" }
      responses:
        "200":
          description: The rule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/rules/{id}/reset:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: resetRule
      tags: [Rules]
      summary: Reset a built-in rule to its default values
      description: >-
        Restores thresholds, hold time, severity, selector, channels, parameters and the
        enabled state a rule ships with. Per-device overrides are kept. A rule created here
        has no defaults and answers 409.
      x-token-scope: write
      x-permissions: [monitors.manage]
      responses:
        "200":
          description: The rule, back to its defaults.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/alerts/overrides:
    get:
      operationId: listOverrides
      tags: [Rules]
      summary: Per-device rule overrides
      x-token-scope: read
      parameters:
        - name: target_id
          in: query
          description: Only the overrides of this device.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Overrides.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RuleOverride" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/rules/{id}/overrides:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listRuleOverrides
      tags: [Rules]
      summary: The overrides of one rule
      x-token-scope: read
      responses:
        "200":
          description: Overrides.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RuleOverride" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/rules/{id}/overrides/{target_id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: target_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: putRuleOverride
      tags: [Rules]
      summary: Create or replace an override for one device
      description: Each field is optional; `null` means "as the rule". An empty override is removed.
      x-token-scope: write
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverridePayload" }
      responses:
        "200":
          description: The override.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RuleOverride" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteRuleOverride
      tags: [Rules]
      summary: Remove an override
      x-token-scope: write
      x-permissions: [alerts.operate]
      x-roles: [admin, operator]
      responses:
        "204": { description: Override removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/alerts/silences:
    get:
      operationId: listSilences
      tags: [Silences]
      summary: Every maintenance window
      x-token-scope: read
      x-wall: true
      responses:
        "200":
          description: Windows, with `active_now`, `active_until` and `next_start_at` computed by the server.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Silence" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createSilence
      tags: [Silences]
      summary: Create a maintenance window
      x-token-scope: write
      x-permissions: [alerts.operate, maintenance.manage]
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SilencePayload" }
            example:
              name: Sunday backups
              comment: NAS is busy
              target_id: 4
              matchers: {}
              schedule: { kind: weekly, days: [6], start_minute: 120, end_minute: 240, timezone: Europe/Paris }
              enabled: true
      responses:
        "201":
          description: The window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Silence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/silences/occurrences:
    get:
      operationId: listSilenceOccurrences
      tags: [Silences]
      summary: Maintenance windows unrolled into dated occurrences
      description: |
        One-off windows and weekly or monthly rules expanded between `from` and `to`
        (at most 100 days, 2000 occurrences). "Until recovery" windows have no end and
        are not listed. Powers the maintenance calendar.
      x-token-scope: read
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: Occurrences sorted by start.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [silence_id, name, starts_at, ends_at, state, recurring, enabled]
                  properties:
                    silence_id: { type: integer }
                    name: { type: string }
                    starts_at: { type: string, format: date-time }
                    ends_at: { type: string, format: date-time }
                    state: { type: string, enum: [active, upcoming, past] }
                    recurring: { type: boolean }
                    enabled: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/alerts/silences/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateSilence
      tags: [Silences]
      summary: Edit a maintenance window
      description: >-
        Replaces the name, comment, scope and schedule. To end a window now, send
        a one-off schedule whose end is the current time.
      x-token-scope: write
      x-permissions: [alerts.operate, maintenance.manage]
      x-roles: [admin, operator]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SilencePayload" }
      responses:
        "200":
          description: The updated window.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Silence" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteSilence
      tags: [Silences]
      summary: Delete a maintenance window
      x-token-scope: write
      x-permissions: [alerts.operate, maintenance.manage]
      x-roles: [admin, operator]
      responses:
        "204": { description: Window deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------------------------------------------------- notifications
  /api/notify/kinds:
    get:
      operationId: listChannelKinds
      tags: [Notifications]
      summary: Every notification channel type and its fields
      x-token-scope: read
      responses:
        "200":
          description: Channel types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChannelKind" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/channels:
    get:
      operationId: listChannels
      tags: [Notifications]
      summary: Every notification channel
      description: Secrets are never returned (`has_secret`).
      x-token-scope: read
      responses:
        "200":
          description: Channels.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Channel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createChannel
      tags: [Notifications]
      summary: Create a notification channel
      x-token-scope: write
      x-permissions: [notifications.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelPayload" }
            example:
              name: Ops Discord
              kind: discord
              enabled: true
              settings: { username: DumbMonit }
              secrets: { webhook_url: "https://discord.com/api/webhooks/…" }
      responses:
        "201":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateChannel
      tags: [Notifications]
      summary: Update a notification channel
      description: >-
        Omitting `secrets` keeps the stored ones; `"secrets": {}` clears them.
        Otherwise secrets are merged by key: a key sent replaces its value, a
        key left out is kept, and `null` or `""` clears it. Changing the kind
        or the destination replaces the whole set instead.
        In `policy`, omitting `matcher` keeps the routing filter and
        `"matcher": null` clears it.
      x-token-scope: write
      x-permissions: [notifications.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChannelPayload" }
      responses:
        "200":
          description: The channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Channel" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteChannel
      tags: [Notifications]
      summary: Delete a notification channel
      x-token-scope: write
      x-permissions: [notifications.manage]
      responses:
        "204": { description: Channel deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notify/channels/{id}/test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: testChannel
      tags: [Notifications]
      summary: Send a test message through a channel
      x-token-scope: write
      x-permissions: [notifications.manage]
      responses:
        "200":
          description: Whether the message left.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/notify/template-preview:
    post:
      operationId: previewMessageTemplate
      tags: [Notifications]
      summary: Preview a channel's message templates on a sample alert
      description: >-
        Renders the title and body templates (`message_title_template`,
        `message_body_template` in the channel settings) for a channel type, on a sample
        disk-full alert, with the escaping of that service (`plain`, `slack_mrkdwn`, `html`,
        `telegram_markdown_v2`). Empty templates render the defaults, which give the usual
        message. `400` with the reason when saving the channel would refuse the templates
        (unknown variable, unclosed braces), or when the type takes no message template.
        Changes nothing.
      x-token-scope: write
      x-permissions: [notifications.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TemplatePreviewRequest" }
      responses:
        "200":
          description: The rendered sample.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TemplatePreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/mail-server:
    get:
      operationId: getMailServer
      tags: [Notifications]
      summary: The email server (SMTP) of the instance
      description: >-
        Used by status page email subscriptions and by scheduled reports that have no email
        channel of their own. The password is never returned (`has_password`). When
        `DUMBMONIT_SMTP_HOST` is set, the `DUMBMONIT_SMTP_*` variables describe the server and
        `locked_by_env` is true. Administrators only.
      x-token-scope: read
      responses:
        "200":
          description: The effective settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailServer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putMailServer
      tags: [Notifications]
      summary: Save the email server (SMTP) of the instance
      description: >-
        Omitted `secrets` keep the stored password, `"secrets": {}` clears it,
        `"secrets": {"password": "…"}` replaces it. A stored password is only kept while the
        host and username stay the same; otherwise it must be typed again (400). An empty host
        and sender forget the server. 409 when the `DUMBMONIT_SMTP_*` variables set it.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailServerUpdate" }
      responses:
        "200":
          description: The new effective settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailServer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/notify/mail-server/test:
    post:
      operationId: testMailServer
      tags: [Notifications]
      summary: Send a test email through the email server
      description: >-
        Sends a short email to `to`, with the unsaved settings in `server` when given (same
        password rules as `PUT`), otherwise with the effective ones. A failure answers 400 with
        the SMTP error, the password redacted.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MailServerTest" }
      responses:
        "200":
          description: The email left.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChannelTestReport" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/webpush:
    get:
      operationId: getWebPush
      tags: [Notifications]
      summary: Web Push key and the signed-in account's devices
      description: The VAPID public key to subscribe with (`applicationServerKey`), generated at first start. The private key is never returned. Only the signed-in account's devices are listed, without their endpoint or keys.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "200":
          description: Key and devices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebPushOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/webpush/subscriptions:
    post:
      operationId: subscribeWebPush
      tags: [Notifications]
      summary: Subscribe this browser to Web Push
      description: Body is `PushSubscription.toJSON()`. The endpoint must be HTTPS on a public address (private, loopback and link-local addresses are refused). The same endpoint subscribing again replaces its row. Allowed for viewers too.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebPushSubscription" }
      responses:
        "201":
          description: The subscribed device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebPushDevice" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/webpush/subscriptions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    delete:
      operationId: deleteWebPushDevice
      tags: [Notifications]
      summary: Remove one of the signed-in account's devices
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      responses:
        "204": { description: Device removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/webpush/test:
    post:
      operationId: testWebPush
      tags: [Notifications]
      summary: Send a test notification to the signed-in account's devices
      description: Every device of the account, or the one named by `id`. Expired subscriptions (404/410 from the push service) are removed on the way.
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: integer, description: "One device only." }
      responses:
        "200":
          description: What the push services answered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebPushTestReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/policy:
    get:
      operationId: getNotifyPolicy
      tags: [Notifications]
      summary: The global notification policy
      x-token-scope: read
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      operationId: putNotifyPolicy
      tags: [Notifications]
      summary: Update the global notification policy
      description: 'Every field is optional; an omitted field keeps its value. `"escalate_channel": null` switches escalation off.'
      x-token-scope: write
      x-permissions: [notifications.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotifyPolicyUpdate" }
      responses:
        "200":
          description: The policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotifyPolicy" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/notify/match-preview:
    post:
      operationId: previewChannelMatcher
      tags: [Notifications]
      summary: Which devices a channel routing filter selects
      description: Read-only, but a `POST` because the filter is a JSON body; needs the `write` scope like every `POST`.
      x-token-scope: write
      x-permissions: [notifications.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchPreviewRequest" }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MatchPreview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ------------------------------------------------------- pages de statut
  /api/status-pages:
    get:
      operationId: listStatusPages
      x-codeSamples:
        - lang: Shell
          label: curl
          source: |
            curl -sk -H "Authorization: Bearer $DUMBMONIT_TOKEN" \
              https://dumbmonit.example:8080/api/status-pages
      tags: [Status pages]
      summary: Every status page with its items
      x-token-scope: read
      responses:
        "200":
          description: Pages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusPageView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createStatusPage
      tags: [Status pages]
      summary: Create a status page
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPagePayload" }
      responses:
        "201":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/status-pages/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getStatusPage
      tags: [Status pages]
      summary: One status page with its items
      x-token-scope: read
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateStatusPage
      tags: [Status pages]
      summary: Replace a status page
      description: >-
        A full replacement: `title` is required and every omitted field goes back
        to its default — except `accent`, `footer_text`, `homepage_url`,
        `subscribe_channel_id`, `subscribe_email`, `domain`, `hide_branding` and `listed`, which
        keep their stored value when omitted.
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPagePayload" }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      operationId: deleteStatusPage
      tags: [Status pages]
      summary: Delete a status page
      description: The public URL stops answering.
      x-token-scope: write
      x-permissions: [status_pages.manage]
      responses:
        "204": { description: Page deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/items:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setStatusPageItems
      tags: [Status pages]
      summary: Replace the devices shown on a page
      description: The full ordered list (200 at most). An empty label takes the device's name.
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/StatusPageItemInput" }
      responses:
        "200":
          description: The items, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/StatusPageItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: previewStatusPage
      tags: [Status pages]
      summary: Editor preview of a status page
      description: >-
        The public document of the saved page, published or not and whatever its
        access mode, for the page editor. Each service also carries `target_id`,
        the monitor it shows, so the editor can keep its state and history while
        the page is being changed. Never cached; the public route never carries
        `target_id`.
      x-token-scope: read
      responses:
        "200":
          description: The page as visitors would read it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/languages:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getStatusPageLanguages
      tags: [Status pages]
      summary: Default language and translations of a status page
      x-token-scope: read
      responses:
        "200":
          description: The page's languages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageLanguages" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putStatusPageLanguages
      tags: [Status pages]
      summary: Replace the default language and the translations of a page
      description: >-
        Translations cover the title, description, footer and the names of services
        and groups (`labels`, from the written name to its translation). An empty
        field keeps the written text. Incident messages are not translated.
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusPageLanguages" }
      responses:
        "200":
          description: The saved languages.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageLanguages" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/access:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: setStatusPageAccess
      tags: [Status pages]
      summary: Choose who can read a page
      description: >-
        `public` (anyone with the link), `password` (a password of its own,
        hashed with Argon2id and never returned) or `users` (a signed-in DumbMonit
        account, local, LDAP or SSO, on the main address only). A page that is not
        public is never indexed or listed in the sitemap, and its document,
        badges, RSS and iCal feeds, logo and day detail follow the same access.
        With `password`, the field is required the first time and kept when
        omitted afterwards; changing it ends every access cookie already issued.
        Any other mode erases the stored password.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [public, password, users] }
                password: { type: string, minLength: 8, maxLength: 200 }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusPageView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/logo:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getStatusPageLogo
      tags: [Status pages]
      summary: The page's logo (editor preview, drafts included)
      x-token-scope: read
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: uploadStatusPageLogo
      tags: [Status pages]
      summary: Upload the page's logo
      description: PNG, JPEG or WebP, recognised by content, 256 KiB at most.
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoUpload" }
      responses:
        "204": { description: Logo stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteStatusPageLogo
      tags: [Status pages]
      summary: Remove the page's logo
      x-token-scope: write
      x-permissions: [status_pages.manage]
      responses:
        "204": { description: Logo removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/subscribers:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listStatusPageSubscribers
      tags: [Status pages]
      summary: Subscribers of a page
      description: >-
        Admin accounts and `write` tokens only (personal data). Email, SMS, webhook and Slack
        subscribers are listed together; phone numbers and URLs are masked, and tokens and
        secrets never leave the server.
      x-token-scope: read
      responses:
        "200":
          description: Subscribers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subscriber" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/subscribers.csv:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: exportStatusPageSubscribers
      tags: [Status pages]
      summary: Export the subscribers of a page as CSV
      description: >-
        Admin accounts and `write` tokens only. Columns: type, destination, status,
        subscribed_at, services. Webhook and Slack URLs stay masked.
      x-token-scope: read
      responses:
        "200":
          description: CSV file.
          content:
            text/csv: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/subscription:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getStatusPageSubscription
      tags: [Status pages]
      summary: Subscription channels open on a page (besides email)
      x-token-scope: read
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSubscriptionSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: setStatusPageSubscription
      tags: [Status pages]
      summary: Open or close the SMS, webhook and Slack subscriptions of a page
      description: >-
        Email is opened with the page itself (`subscribe_email`). SMS needs a Vonage, Telnyx
        or ASPSMS notification channel; webhook and Slack need nothing, the visitor gives their URL.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StatusSubscriptionSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusSubscriptionSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/status-pages/{id}/subscribers/{subscriber}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - name: subscriber
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      operationId: removeStatusPageSubscriber
      tags: [Status pages]
      summary: Remove a subscriber
      x-token-scope: write
      responses:
        "204": { description: Subscriber removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ------------------------------------------------- rapports périodiques
  /api/reports/schedules:
    get:
      operationId: listReportSchedules
      tags: [Reports]
      summary: Every periodic email report
      description: >-
        Administrators only, even for reading: the response lists the
        recipients' addresses.
      x-token-scope: read
      x-permissions: [reports.view]
      responses:
        "200":
          description: Report schedules.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReportSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createReportSchedule
      tags: [Reports]
      summary: Create a periodic email report
      description: >-
        Omitted fields take their default: weekly, Monday at 8:00, UTC. A new
        schedule never sends a report for a slot that already passed.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportSchedulePayload" }
      responses:
        "201":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reports/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getReportSchedule
      tags: [Reports]
      summary: One periodic email report
      x-token-scope: read
      x-permissions: [reports.view]
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: updateReportSchedule
      tags: [Reports]
      summary: Replace a periodic email report
      description: >-
        A full replacement. Changing the frequency, day, hour, timezone or
        turning the report on re-arms it: a slot that already passed is not sent.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportSchedulePayload" }
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportSchedule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteReportSchedule
      tags: [Reports]
      summary: Delete a periodic email report
      x-token-scope: write
      responses:
        "204": { description: Schedule deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reports/schedules/{id}/send-test:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: sendReportPreview
      tags: [Reports]
      summary: Send a preview of the report now
      description: >-
        Sends the report for the current period to the saved recipients, marked
        as a preview. It does not change the schedule: nothing is recorded as
        sent. One preview per schedule every 30 seconds.
      x-token-scope: write
      responses:
        "200":
          description: How many recipients were reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPreviewResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reports/schedules/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      operationId: retryReportSend
      tags: [Reports]
      summary: Send again a report whose last send failed
      description: >-
        A real send (not a preview) to the saved recipients. On success the
        recorded error is cleared. Only while the last send is marked failed;
        one retry per schedule every 30 seconds.
      x-token-scope: write
      responses:
        "200":
          description: How many recipients were reached.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportPreviewResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/reports/schedules/{id}/pdf:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: downloadScheduledReportPdf
      tags: [Reports]
      summary: The PDF of the last SLA report sent, made again
      description: >-
        Sent reports do not keep their attachments: the PDF is rebuilt for the
        same period (the calendar month before the last send) from the
        recorded history. `404` before the first send, `400` for a digest.
      x-token-scope: read
      x-permissions: [reports.view]
      parameters:
        - name: disposition
          in: query
          schema: { type: string, enum: [attachment, inline], default: attachment }
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/reports/sla:
    get:
      operationId: downloadSlaReport
      tags: [Reports]
      summary: Availability (SLA) report of a chosen period
      description: >-
        Builds the report on the spot: availability per monitor and per group
        against the period of the same length before it, incidents, response
        times (mean and 95th percentile) and, with `objective`, whether each
        monitor met it. Without `from` and `to`, the previous calendar month.
        `from` and `to` are inclusive days in `tz`, one year at most; a period
        that is not over stops at now. Administrators only, except in MSP
        mode, where a member of a client reads the report of that client
        (`client`), and of nothing else.
      x-token-scope: read
      parameters:
        - { name: from, in: query, schema: { type: string, format: date }, description: First day included. }
        - { name: to, in: query, schema: { type: string, format: date }, description: Last day included; today when omitted. }
        - { name: tz, in: query, schema: { type: string, default: UTC }, description: IANA timezone of the period and of the dates shown. }
        - name: format
          in: query
          schema: { type: string, enum: [pdf, csv, incidents_csv, json], default: pdf }
        - { name: objective, in: query, schema: { type: number, exclusiveMinimum: 0, maximum: 100 }, description: Availability objective in percent. }
        - { name: page, in: query, schema: { type: integer, format: int64 }, description: Status page whose title heads the report. }
        - { name: title, in: query, schema: { type: string, maxLength: 120 }, description: Report name shown under the header. }
        - { name: client, in: query, schema: { type: integer, format: int64 }, description: "MSP mode: the client reported on (its targets only, its name and logo). Required for a member of several clients." }
        - { name: template, in: query, schema: { type: string, enum: [detailed, summary], default: detailed }, description: "PDF template: `detailed` (every monitor and incident) or `summary` (one or two pages: overall availability against the objective, availability by group or monitor, major incidents, total downtime)." }
        - { name: paper, in: query, schema: { type: string, enum: [a4, letter], default: a4 } }
        - name: sections
          in: query
          schema: { type: string, example: "summary,chart,monitors,incidents" }
          description: "Comma-separated sections to include, among `summary`, `chart`, `monitors`, `incidents`, `maintenance`, `response_times`, `notes`. Omitted: all of them."
        - { name: notes, in: query, schema: { type: string, maxLength: 2000 }, description: Free text printed in the Notes section. }
        - { name: logo, in: query, schema: { type: string, enum: [auto, client, page, custom, none], default: auto }, description: "Logo at the top: `auto` (the client's, else the status page's), `client`, `page`, `custom` (the logo uploaded for reports, `/api/reports/logo`) or `none`. `true` and `false` are read as `auto` and `none`." }
        - name: scope
          in: query
          schema: { type: string, example: '{"targets":[1,2],"groups":["Edge"]}' }
          description: "JSON `ReportScope`: the monitors listed and those of the groups listed (union). Omitted: every monitor the report can see."
        - name: objectives
          in: query
          schema: { type: string, example: '{"groups":{"Edge":99.5},"monitors":{"Gateway":99.99}}' }
          description: "JSON `ReportObjectives`: objectives of single groups or monitors, which replace `objective` for those rows."
        - name: disposition
          in: query
          schema: { type: string, enum: [attachment, inline], default: attachment }
          description: "`inline` lets the browser show the file (a PDF opens in the tab) instead of saving it."
      responses:
        "200":
          description: The file, as an attachment (or inline), or with `format=json` the report as data (the printable page of the web interface).
          content:
            application/pdf: { schema: { type: string, format: binary } }
            text/csv: { schema: { type: string } }
            application/json: { schema: { $ref: "#/components/schemas/SlaReport" } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/reports/logo:
    get:
      operationId: getReportLogo
      tags: [Reports]
      summary: Logo uploaded for SLA reports
      description: Shown at the top of an SLA report whose layout picks `custom`. Readable by any signed-in account, like the report preview that shows it.
      x-token-scope: read
      responses:
        "200":
          description: The image.
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: uploadReportLogo
      tags: [Reports]
      summary: Set the logo of SLA reports
      description: Administrators only. A PNG (8-bit, not interlaced) or a JPEG, 256 KiB at most, the images the PDF can embed.
      x-token-scope: write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: string, description: "The file in base64, with or without a `data:` prefix." }
      responses:
        "204": { description: Logo stored. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteReportLogo
      tags: [Reports]
      summary: Remove the logo of SLA reports
      description: Administrators only. Reports set to `custom` then have no logo.
      x-token-scope: write
      responses:
        "204": { description: Logo removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/calendar/maintenance:
    get:
      operationId: getMaintenanceCalendarToken
      tags: [Status pages]
      summary: Token and address of the private maintenance calendar
      description: >-
        The token is created on first use. Administrators only: anyone holding
        the address can read every announced maintenance.
      x-token-scope: read
      responses:
        "200":
          description: The token and the feed path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceCalendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/calendar/maintenance/rotate:
    post:
      operationId: rotateMaintenanceCalendarToken
      tags: [Status pages]
      summary: Replace the private calendar token
      description: The previous address stops working at once.
      x-token-scope: write
      responses:
        "200":
          description: The new token and the feed path.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceCalendar" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/calendar/maintenance.ics:
    get:
      operationId: getMaintenanceCalendar
      tags: [Public status]
      summary: Every maintenance as an iCalendar feed (private, token)
      description: >-
        RFC 5545 feed of the announced maintenance from 90 days back to the far
        future, for a calendar app to subscribe to. The token travels in the
        address and is the only protection: treat the URL as a secret. An
        unknown token answers 404.
      security: []
      x-token-scope: public
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: iCalendar.
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/incidents:
    get:
      operationId: listIncidents
      tags: [Incidents]
      summary: Every incident and maintenance announcement, with its updates
      x-token-scope: read
      x-wall: true
      responses:
        "200":
          description: Incidents.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidentView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createIncident
      tags: [Incidents]
      summary: Open an incident or announce a maintenance
      description: "`body` becomes the first update."
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentPayload" }
      responses:
        "201":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/incidents/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      operationId: updateIncident
      tags: [Incidents]
      summary: Update an incident
      description: An omitted field keeps its value.
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentPayload" }
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteIncident
      tags: [Incidents]
      summary: Delete an incident
      x-token-scope: write
      x-permissions: [status_pages.manage]
      responses:
        "204": { description: Incident deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/incidents/{id}/updates:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: listIncidentUpdates
      tags: [Incidents]
      summary: The timeline of an incident
      x-token-scope: read
      responses:
        "200":
          description: Updates, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidentUpdate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: addIncidentUpdate
      tags: [Incidents]
      summary: Post an update and move the incident to its status
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentUpdatePayload" }
      responses:
        "201":
          description: The incident.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/incidents/{id}/postmortem:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getIncidentPostmortem
      tags: [Incidents]
      summary: The post-mortem of an incident, draft or published
      x-token-scope: read
      responses:
        "200":
          description: The post-mortem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Postmortem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: saveIncidentPostmortem
      tags: [Incidents]
      summary: Write or replace the post-mortem of an incident
      description: >-
        A full replacement: an omitted field is empty. A draft can be written at
        any time; `published: true` needs a resolved incident and a summary.
        `published_at` is set on the first publication, kept while it stays
        published and cleared when it goes back to draft. The text is plain
        text, shown by paragraphs. Maintenance windows have no post-mortem.
      x-token-scope: write
      x-permissions: [status_pages.manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PostmortemPayload" }
      responses:
        "200":
          description: The incident, with its post-mortem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncidentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteIncidentPostmortem
      tags: [Incidents]
      summary: Delete the post-mortem of an incident
      x-token-scope: write
      x-permissions: [status_pages.manage]
      responses:
        "204": { description: Post-mortem deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/slos:
    get:
      operationId: listSlos
      tags: [SLOs]
      summary: Every service level objective, with its current state
      description: >-
        Availability over the window, error budget and burn rates come from
        VictoriaMetrics; when it does not answer, the list is still served with
        `status.measured: false`.
      x-token-scope: read
      responses:
        "200":
          description: SLOs, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Slo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createSlo
      tags: [SLOs]
