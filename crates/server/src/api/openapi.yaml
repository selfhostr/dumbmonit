              schema: { type: string }
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/logs/export/estimate:
    get:
      operationId: estimateLogsExport
      tags: [Logs]
      summary: Estimated size of the archive for N days, before downloading it
      security: [{ cookieAuth: [] }]
      x-token-scope: none
      parameters:
        - $ref: "#/components/parameters/LogDays"
      responses:
        "200":
          description: Period, number of files and estimated compressed size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogsEstimate" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
